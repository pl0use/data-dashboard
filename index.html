    const reanalysis = {"en":[{"title":"1. The central finding. The recorded caseload changes substantially over time, alongside changes in the kind of operations and the completeness of recording. The strongest conclusions concern service demand, recorded recurrence and the limits of follow-up evidence.","blocks":[{"type":"li","text":"The operation serves several different populations. The early files mostly record non-citizens classified as begging. The later files mostly record Malaysian men classified as homeless. Combining these categories into one uniform “homeless population” would hide major differences."},{"type":"li","text":"Recurrence is understated by the frequency labels. The conservative document-based linkage identifies 296 later-date encounters in 208 groups. Of those later encounters, 206 are still labelled “first”. Combining these visible returns with JKM’s recorded repeat history gives 537 repeat-evidence records: 328 JKM-flagged records plus 209 additional records found by matching."},{"type":"li","text":"The later caseload is older. In 2026, 117 records have reported ages of at least 60, representing 39.1% of all 299 records and 39.5% of those with a known age. The Malaysian subgroup was already old in the earlier files, so the changing citizenship mix matters."},{"type":"li","text":"The 2026 health signal is concentrated. Thirty-two of that year’s 35 records with a mental-health indication occur on 24 September. This is not evidence of a uniform increase across the year."},{"type":"li","text":"A referral or administrative closure does not establish recovery. The files do not systematically record completed treatment, confirmed housing retention, employment after referral, or freedom from repeat street encounters."},{"type":"li","text":"Data collection changes are large enough to distort simple trend comparisons. In particular, disability recording, health recording, location detail and reason-for-case coding differ sharply by year."}]},{"title":"2. What was counted and what was excluded. Each retained row is a case entry in the principal profile table with an operation date. All 2,021 retained rows have a populated name field and a valid operation date in the corresponding reporting year. Six name values are placeholders such as Unknown or Tiada Maklumat; these do not establish a known personal identity.","blocks":[{"type":"table","rows":[["Workbook","Period covered by operation dates","Retained records","Case-table range","Excluded template-only rows"],["Dec 2023.xlsx","2023-01-04 to 2023-12-29","687","'Profil '!A7:BG693","28"],["Dec 2024.xlsx","2024-01-06 to 2024-12-24","350","'Profil '!A7:BG356","0"],["Dec 2025.xlsx","2025-01-08 to 2025-12-16","685","'Profil '!A7:BG691","0"],["Sept 2026.xlsx","2026-01-07 to 2026-09-24","299","'Profil '!A7:BG305","69"],["Combined","January 2023–September 2026","2,021","Four principal profile tables","97"]]},{"type":"p","text":"All worksheets were inspected, including hidden coding sheets. The 2025 workbook contains a second table on Sheet1. Its 685 case records exactly reproduce the principal profile records, with a two-row offset. Counting both sheets would incorrectly raise the total to 2,706. The duplicated copy is excluded. The guide and coding worksheets contain definitions and options, not additional cases."},{"type":"p","text":"No two complete records in the four principal profile tables are identical when the sequence number is ignored. There are three extra rows within the same linked identity/date combinations, including two 2026 pairs with different dispositions. They are retained as recorded entries because it is unclear whether they describe separate actions or duplicate documentation. Repeat analysis counts different dates, so these pairs do not create false returns."},{"type":"p","text":"The sequence-number column is not a reliable control total. For example, the 2023 sheet continues with pre-filled month and sequence values after the last real case. Formatted worksheet dimensions also extend far beyond the actual data. Neither was used to estimate case volume."}]},{"title":"3. Recorded volume and operation patterns. The figures show activity recorded by this operation. They cannot measure the prevalence of homelessness without information about search effort, coverage, recording completeness and the wider population.","blocks":[{"type":"table","rows":[["Measure","2023","2024","2025","2026 Jan–Sep","2023–Sep 2026 combined"],["All recorded case rows","687","350","685","299","2,021"],["January–September rows, using operation date","608","320","536","299","1,763"],["Distinct dates with at least one record","101","57","42","34","234"],["Scheduled/periodic operation rows","594","256","116","110","1,076"],["Integrated operation rows","43","12","510","133","698"],["Unscheduled operation rows","50","82","59","56","247"],["Share arising on the two busiest dates","5.5%","14.0%","35.8%","76.3%","12.4% on the two busiest dates of the whole period"]]},{"type":"p","text":"Full-year entries fell 49.1% from 687 in 2023 to 350 in 2024, then rose 95.7% to 685 in 2025. For a matching January–September comparison, 2026 has 299 entries against 536 in 2025, a decline of 44.2%. That is a decline in recorded encounters, not proof that homelessness or repeat homelessness declined."},{"type":"p","text":"Activity becomes much more concentrated in a few operations. The six busiest dates in 2025 account for 535 of 685 entries (78.1%). In 2026, 4 March contributes 110 and 24 September contributes 118, together 228 of 299 (76.3%). The two busiest dates in 2023 contribute only 38 of 687 (5.5%). This changing concentration can move annual demographic and health percentages even if the underlying street population changes less."},{"type":"table","rows":[["Busiest operation dates","Records","Share of that year"],["2023: 2023-07-21","20","2.9%"],["2023: 2023-06-09","18","2.6%"],["2023: 2023-03-31","17","2.5%"],["2024: 2024-02-23","29","8.3%"],["2024: 2024-05-12","20","5.7%"],["2024: 2024-02-03","15","4.3%"],["2025: 2025-02-23","132","19.3%"],["2025: 2025-05-18","113","16.5%"],["2025: 2025-07-06","99","14.5%"],["2026: 2026-09-24","118","39.5%"],["2026: 2026-03-04","110","36.8%"],["2026: 2026-07-16","13","4.3%"]]},{"type":"table","rows":[["Operation month","2023","2024","2025","2026","Total for supplied periods"],["January","68","21","1","25","115"],["February","67","67","139","0","273"],["March","79","64","31","111","285"],["April","18","15","73","7","113"],["May","99","74","162","6","341"],["June","107","47","0","7","161"],["July","57","22","115","17","211"],["August","56","3","8","6","73"],["September","57","7","7","120","191"],["October","17","11","120","Outside supplied period","148"],["November","34","8","19","Outside supplied period","61"],["December","28","11","10","Outside supplied period","49"],["All months","687","350","685","299","2,021"]]},{"type":"p","text":"Monthly counts use operation date J. The month-name field B disagrees with the date on 24 rows and is blank on one row. Consequently these monthly counts differ from simply grouping the month-name field. June 2025 and February 2026 contain no dated case entries in the supplied files; this does not establish that no operations took place."},{"type":"p","text":"Source: Dec 2023.xlsx · Profil · rows 7–693; Dec 2024.xlsx · Profil · rows 7–356; Dec 2025.xlsx · Profil · rows 7–691; Sept 2026.xlsx · Profil · rows 7–305. Fields: J operation date; K operation type; B reported month.."}]},{"title":"4. Who appears in the records. Demographic totals are encounter-weighted: a person recorded repeatedly contributes repeatedly. Gender and citizenship are the categories recorded by staff, without inference from names or document numbers.","blocks":[{"type":"table","rows":[["Profile","2023","2024","2025","2026 Jan–Sep","All records"],["Male","346 (50.4%)","168 (48.0%)","577 (84.2%)","238 (79.6%)","1,329 (65.8%)"],["Female","338 (49.2%)","182 (52.0%)","106 (15.5%)","61 (20.4%)","687 (34.0%)"],["Gender missing","3","0","2","0","5"],["Malaysian citizen","201 (29.3%)","83 (23.7%)","479 (69.9%)","251 (83.9%)","1,014"],["Non-citizen","484 (70.5%)","267 (76.3%)","205 (29.9%)","48 (16.1%)","1,004"],["Citizenship unknown","2","0","1","0","3"],["Recorded as having no citizenship","0","0","0","0","0"]]},{"type":"p","text":"The pooled citizenship split is almost even: 1,014 citizens and 1,004 non-citizens, plus three unknowns. That pooled result hides the change from 29.3% citizens in 2023 and 23.7% in 2024 to 69.9% in 2025 and 83.9% in 2026. Citizens are more heavily male across the period: 806 of 1,014 (79.5%), compared with 520 of 1,004 non-citizen entries (51.8%). This contributes to the later male-heavy profile."},{"type":"p","text":"No record is explicitly coded “Tiada Kewarganegaraan” in the citizenship field. This does not prove there are no stateless people. A missing passport, a Rohingya label, an UNHCR card or an unknown citizenship code cannot on its own establish statelessness. Similarly, a non-citizen code or an immigration handover does not establish an undocumented or unlawful immigration status."},{"type":"p","text":"Source: Dec 2023.xlsx · Profil · rows 7–693; Dec 2024.xlsx · Profil · rows 7–356; Dec 2025.xlsx · Profil · rows 7–691; Sept 2026.xlsx · Profil · rows 7–305. Fields: V gender; W citizenship.."}]},{"title":"5. Age demographics and the ageing pattern. Age statistics use the numeric reported age in T. They do not silently substitute the source age-band field or infer age from identity numbers. “Children” here means reported age under 18, and “older” means reported age 60 or above.","blocks":[{"type":"table","rows":[["Reported age","2023","2024","2025","2026 Jan–Sep","Total"],["0-17","110","25","27","1","163"],["18-29","76","52","45","13","186"],["30-39","121","69","90","24","304"],["40-49","137","79","162","74","452"],["50-59","91","48","155","67","361"],["60-64","55","27","73","45","200"],["65+","81","50","99","72","302"],["Unknown","16","0","34","3","53"]]},{"type":"table","rows":[["Age measure","2023","2024","2025","2026 Jan–Sep","2023–Sep 2026 pooled"],["Known numeric ages","671","350","651","296","1,968"],["Median reported age","41.0","44.0","50.0","55.0","47.0"],["Mean reported age","39.9","43.7","48.6","53.9","45.6"],["Age range, known ages","0–88","0–89","1–84","15–79","0–89"],["Age 60+, as share of known ages","20.3%","22.0%","26.4%","39.5%","25.5%"],["Age 65+, as share of known ages","12.1%","14.3%","15.2%","24.3%","15.3%"],["Citizen median age","58.0","58.0","53.0","55.0","54.0"],["Non-citizen median age","36.0","41.0","36.0","50.0","38.0"]]},{"type":"p","text":"Across all years, 502 records are aged 60 or above and 302 are aged 65 or above. Among 1,968 known ages, these are 25.5% and 15.3%, respectively. The largest combined age band is 40–49, with 452 entries. In 2026, 258 of 296 known-age records (87.2%) are aged at least 40. Service needs therefore extend beyond employment placement to the practical needs of middle-aged and older adults."},{"type":"p","text":"The overall increase in age is partly a composition effect. The citizen median is 58 in both 2023 and 2024, 53 in 2025 and 55 in 2026. It does not show a steady increase. The large rise in the pooled median from 41 to 55 occurs while the files move from younger non-citizens toward citizens. It would be misleading to say that the same cohort aged by 14 years in this period."},{"type":"p","text":"The reported ages are imperfect: 92 records differ by more than one year from operation-year minus recorded birth-year, and 22 have a numeric age outside the stated source age band. One 2026 record gives age 22, birth-year 1971 and an age band of 55–59. Another gives numeric age 59 but a 65+ band. Accordingly the numeric-age total of 72 aged 65+ in 2026 differs from the 73 rows labelled 65+ in the band field. These source inconsistencies are preserved and flagged."},{"type":"p","text":"Source: Dec 2023.xlsx · Profil · rows 7–693; Dec 2024.xlsx · Profil · rows 7–356; Dec 2025.xlsx · Profil · rows 7–691; Sept 2026.xlsx · Profil · rows 7–305. Fields: S birth-year; T numeric age; U source age band; W citizenship.."}]},{"title":"6. Children and families. There are 163 records with a reported age under 18, including 69 under five. These are case entries, not verified unique children or family counts.","blocks":[{"type":"table","rows":[["Child-related finding","Count"],["Under 18: 2023 / 2024 / 2025 / 2026","110 / 25 / 27 / 1"],["Non-citizen child records","133"],["Citizen child records","30"],["Classified as begging","145"],["Handed to a protector (Pelindung)","33"],["Released","55"],["No action recorded","65"],["Returned to family","3"],["Hospital / immigration / NGO / other","1 / 1 / 1 / 4"]]},{"type":"p","text":"Non-citizens account for 81.6% of child entries. The most common recorded origins among non-citizen children are Myanmar (53), Cambodia (17), Indonesia (15), Pakistan (13), Palestine (12) and Syria (12). Because family relationships are not systematically coded, the files cannot establish how many households are affected, whether children were accompanied, or whether sibling groups received a coordinated intervention."},{"type":"p","text":"Some alternative-document and UNHCR identifiers are shared across adults and children. Treating each shared card number as one person would incorrectly merge family members. This is why alternative documents require an exact normalized name match in the recurrence method. Repeated adult names and their children can still be separate records even when a card appears on both."},{"type":"p","text":"The reason “no employment” is recorded for 36 child entries. It should not be interpreted as an adult labour-market explanation for those children. The records also include notes about accompanying a mother who is begging, mothers who work, and children who remain in school. These details show why the operation’s categories need to be interpreted at the individual and family level."},{"type":"p","text":"Source: Dec 2023.xlsx · Profil · rows 7–693; Dec 2024.xlsx · Profil · rows 7–356; Dec 2025.xlsx · Profil · rows 7–691; Sept 2026.xlsx · Profil · rows 7–305. Fields: T age; W citizenship; AB/AC origin; AF category; AJ/AK factor; AO action; R/AE alternative documents used only for linkage checks.."}]},{"title":"7. Types of cases. The source uses three substantive case categories: Pengemis (begging), Gelandangan (homelessness), and Peleser (the source’s loitering/vagrancy category). These are staff classifications rather than independently verified living arrangements.","blocks":[{"type":"table","rows":[["Case category","2023","2024","2025","2026 Jan–Sep","Total"],["Begging / Pengemis","659","326","73","24","1,082"],["Homelessness / Gelandangan","18","20","544","270","852"],["Peleser, source category","3","2","67","1","73"],["Unknown or blank","7","2","1","4","14"]]},{"type":"p","text":"Begging accounts for 95.9% of records in 2023 and 93.1% in 2024. Homelessness accounts for 79.4% in 2025 and 90.3% in 2026. Across the whole period there are 1,082 begging entries, 852 homelessness entries and 73 Peleser entries. Non-citizens make up 799 of the begging entries, while citizens make up 671 of the homelessness entries."},{"type":"p","text":"The 2025 shift coincides with integrated operations rising to 510 of 685 records (74.5%), from 43 of 687 (6.3%) in 2023. This is evidence that the way the population was encountered changed. It is not sufficient evidence that begging disappeared or that homelessness suddenly multiplied in the wider city."},{"type":"p","text":"Some narrative notes explicitly describe people who have a home, rented room, work, family support, or a room funded by another organization. The records therefore include people encountered while begging or during street operations who are not necessarily sleeping rough. In one linked 2025 group, the same document appears under homelessness five times and Peleser once. Category changes do not necessarily mean a different person or a clear change in housing status."},{"type":"p","text":"Source: Dec 2023.xlsx · Profil · rows 7–693; Dec 2024.xlsx · Profil · rows 7–356; Dec 2025.xlsx · Profil · rows 7–691; Sept 2026.xlsx · Profil · rows 7–305. Fields: AF case category; K operation type; AK/AN/AP narrative notes.."}]},{"title":"8. Nationality, origin, citizenship and UNHCR. Country-of-origin fields are analysed only among the 1,004 records explicitly coded as non-citizen. Variations such as Yaman/Yemen and Palestin/Palestine are normalized. These remain recorded origins, not independently verified nationality determinations.","blocks":[{"type":"table","rows":[["Recorded origin among non-citizens","2023","2024","2025","2026 Jan–Sep","Total"],["Pakistan","129","158","30","1","318"],["Myanmar","99","32","56","5","192"],["Indonesia","48","20","48","13","129"],["China","39","8","12","0","59"],["Cambodia","39","9","1","6","55"],["Palestine","38","7","0","0","45"],["Bangladesh","12","4","14","1","31"],["Syria","25","5","0","0","30"],["India","7","2","17","2","28"],["Yemen","16","6","0","0","22"],["Jordan","2","4","1","0","7"],["Thailand","4","3","0","0","7"],["Vietnam","3","1","2","0","6"],["Philippines","1","0","3","0","4"],["Ukraine","0","1","3","0","4"],["Sri Lanka","2","0","0","1","3"],["Nepal","0","0","3","0","3"],["Turkey","0","1","1","0","2"],["Singapore","0","0","1","0","1"],["Jamaica","0","0","1","0","1"],["Sudan","0","0","1","0","1"],["Japan","0","0","1","0","1"],["Cameroon","0","0","1","0","1"],["Uganda","0","0","1","0","1"],["Somalia","1","0","0","0","1"],["Uzbekistan","0","0","1","0","1"],["Great Britain","0","0","0","1","1"],["Rohingya label, country unclear","0","3","1","0","4"],["Unknown","18","3","6","18","45"],["Other, Unspecified","1","0","0","0","1"],["All non-citizen records","484","267","205","48","1,004"]]},{"type":"p","text":"Pakistan is the largest recorded origin with 318 entries (31.7% of non-citizen records), followed by Myanmar with 192 (19.1%). Indonesia has 123 entries in the designated country fields plus six explicitly described as “PR INDONESIA” in the alternative-document field. India has 27 in the designated fields plus one “PR INDIA” note. The table includes those seven explicitly labelled origin notes, giving Indonesia 129 and India 28. It does not infer origins from names, identity-number prefixes or ethnicity."},{"type":"p","text":"The designated country fields are missing or unknown for 52 non-citizen entries. The seven PR notes resolve origin for seven of them, leaving 45 unknown in this table. In 2026 alone, 25 of 48 non-citizen entries lack a country in the designated fields; after the seven PR notes, 18 remain unknown. This limits conclusions about the changing nationality mix in 2026. Four additional rows carry a Rohingya label without a stated country. They remain separate rather than being assigned a nationality."},{"type":"table","rows":[["UNHCR-holder field, non-citizen records only","2023","2024","2025","2026 Jan–Sep","Total"],["Yes","43","8","19","4","74"],["No","133","11","46","10","200"],["Unknown, blank or invalid","308","248","140","34","730"]]},{"type":"p","text":"The 74 positive UNHCR-holder entries include 65 with Myanmar recorded as origin. They are not 74 verified unique cardholders. There is one row with a card-like number entered into the yes/no holder field; it is treated as invalid status, not automatically as “yes”. Some “no” values also appear on citizen records and are excluded from the applicable non-citizen table. These records cannot establish the total refugee population or the exact numbers with valid, expired or unverified documents."},{"type":"p","text":"Permanent-resident or red-card descriptions occur in notes, including seven explicit PR-country notes in 2026 and red-card descriptions in 2025. They are not a consistently maintained legal-status field. Refugee status, permanent residence, work permission, passport validity, citizenship and statelessness should remain separate concepts."},{"type":"p","text":"Source: Dec 2023.xlsx · Profil · rows 7–693; Dec 2024.xlsx · Profil · rows 7–356; Dec 2025.xlsx · Profil · rows 7–691; Sept 2026.xlsx · Profil · rows 7–305. Fields: W citizenship; AB country; AC other country; R document descriptions; AD UNHCR-holder field; AE card number, used only for linkage.."}]},{"title":"9. Ethnicity and Malaysian state of origin. Ethnicity is reported primarily for citizens. The table below therefore uses the 1,014 citizen entries as its denominator instead of interpreting foreign-country labels as ethnicity.","blocks":[{"type":"table","rows":[["Recorded citizen ethnicity","2023","2024","2025","2026 Jan–Sep","Total"],["Malay","66","39","194","65","364"],["Chinese","33","18","111","50","212"],["Indian","13","9","87","35","144"],["Indigenous Peninsular category","0","0","1","0","1"],["Indigenous Sabah category","1","1","7","4","13"],["Indigenous Sarawak category","0","0","6","2","8"],["Other","1","0","2","1","4"],["Missing or unknown","87","16","71","94","268"]]},{"type":"table","rows":[["State of origin, citizen records","Count","Share of 1,014 citizen entries"],["Selangor","176","17.4%"],["Perak","135","13.3%"],["W.P. Kuala Lumpur","130","12.8%"],["(blank)","117","11.5%"],["Johor","71","7.0%"],["Negeri Sembilan","54","5.3%"],["Kedah","46","4.5%"],["Sabah","45","4.4%"],["Kelantan","44","4.3%"],["Pulau Pinang","40","3.9%"],["Tiada Maklumat","38","3.7%"],["Pahang","35","3.5%"],["Melaka","31","3.1%"],["Sarawak","26","2.6%"],["Perlis","14","1.4%"],["Terengganu","12","1.2%"],["All citizen records","1,014","100.0%"]]},{"type":"p","text":"Selangor (176), Perak (135) and Kuala Lumpur (130) are the largest recorded citizen origins. Selangor and Kuala Lumpur together account for 306 of 1,014 citizen entries (30.2%). State of origin is known for 859 citizen entries; of these, 729 (84.9%) name a state other than Kuala Lumpur. That does not establish recent migration: birthplace or state of origin is not the same as last residence, current family location or the place a person became homeless."},{"type":"p","text":"Ethnicity is missing or unknown for 268 citizen entries (26.4%). The observed ethnic mix cannot establish disproportionate risk without compatible population denominators and equivalent operation coverage. No ethnicity is inferred from a name."},{"type":"p","text":"Source: Dec 2023.xlsx · Profil · rows 7–693; Dec 2024.xlsx · Profil · rows 7–356; Dec 2025.xlsx · Profil · rows 7–691; Sept 2026.xlsx · Profil · rows 7–305. Fields: W citizenship; X ethnicity; AA state of origin.."}]},{"title":"10. Repeat cases, counted in two different ways. The staff frequency code measures reported encounter history. Longitudinal linkage measures recurrence visible inside these files. They answer different questions and must not be substituted for one another.","blocks":[{"type":"p","text":"21 October 2026 — JKM repeat records versus the combined total. JKM coded 328 records (16.2%) as second, third or more-than-three encounters. The corrected matching identifies 209 additional records not flagged as repeat by JKM. The combined total is therefore 537 repeat-evidence records (26.6% of 2,021). After consolidating two extra same-day entries, these represent 535 distinct identity/date encounters. This is the defensible combined count under the stated rules, not a verified census of repeat people or every possible unrecorded return."},{"type":"table","rows":[["Staff frequency code","2023","2024","2025","2026 Jan–Sep","Total"],["First","470","240","647","293","1,650"],["Second","40","28","33","2","103"],["Third","15","9","3","1","28"],["More than three","124","70","2","1","197"],["Missing","38","3","0","2","43"],["All records","687","350","685","299","2,021"]]},{"type":"p","text":"The source frequency partition reconciles exactly: 1,650 first + 103 second + 28 third + 197 more-than-three + 43 missing = 2,021 records. The repeat subtotal is 103 + 28 + 197 = 328. This is a subtotal, not an extra category to add again."},{"type":"p","text":"Staff-coded repeat entries fall from 179 of 687 (26.1%) in 2023 and 107 of 350 (30.6%) in 2024 to 38 of 685 (5.5%) in 2025 and four of 299 (1.3%) in 2026. These figures alone would suggest a dramatic improvement. The identity linkage contradicts that simple reading."},{"type":"table","rows":[["JKM repeat codes versus data-matched repeats: record rows","2023","2024","2025","2026 Jan–Sep","Total"],["JKM-coded repeat records (second, third or more)","179","107","38","4","328"],["Data-matched records with an earlier linked date","50","63","107","78","298"],["Of those: labelled first","24","31","79","74","208"],["Of matched records: already JKM-flagged (overlap)","25","32","28","4","89"],["Of those: frequency missing","1","0","0","0","1"],["Additional matched records not JKM-flagged","25","31","79","74","209"],["Combined repeat-evidence records (no double-counting)","204","138","117","78","537"],["Combined repeat share of all case records","29.7%","39.4%","17.1%","26.1%","26.6%"]]},{"type":"p","text":"Of the additional records identified through matching, 208 are coded first despite a document-linked earlier date. They belong to 160 linked identity groups. Among all 208 recurring groups, 123 have every recorded row labelled first. The 208 suspect first-coded rows are 12.6% of all 1,650 first-coded rows. They are flags for source review, not verified administrative errors or independently confirmed identities."},{"type":"table","rows":[["Repeat audit, same-day consolidated dates","2023","2024","2025","2026 Jan–Sep","Total"],["Later linked dates","50","63","107","76","296"],["Of those: labelled first","24","31","79","72","206"],["Of those: labelled second or later","25","32","28","4","89"],["Of those: frequency missing","1","0","0","0","1"]]},{"type":"p","text":"Why 206 and 208 are both present: two 2026 later-date identity groups each have an extra same-day row, and both extra rows are first-coded. Counting one entry per linked group/date gives 206 first-coded later dates out of 296 (69.6%). Retaining every source row gives 208 first-coded later rows out of 298 (69.8%). The two extra rows are the hospital/release conflicts described below. They are not counted as additional return dates."},{"type":"p","text":"The recurring cohort reconciles as 506 recorded rows = 208 first observed group/dates + 296 later group/dates + 2 additional same-day rows. Across the whole dataset, 2,021 rows = 1,722 initial group/dates + 296 later group/dates + 3 additional same-day rows. One extra same-day row occurs in a group seen on only one date. Initial observed dates are not necessarily first-ever encounters."},{"type":"p","text":"Combining JKM’s repeat codes with the matching evidence without double-counting gives 328 JKM-coded repeat records + 209 additional matched records = 537 records. The 209 additions comprise 208 first-coded records + 1 record with missing frequency. Equivalently, 328 + 298 − 89 = 537, because 89 of the 298 matched later records were already JKM-coded repeat. This is 209 more records than the JKM repeat subtotal, an increase of 63.7%; 38.9% of the combined repeat-evidence records were not JKM-flagged as repeat."},{"type":"p","text":"There are 239 JKM-coded repeat records without an earlier document-linked date in these files. Their prior history may pre-date January 2023, be absent from the supplied files or lack a usable identifier. They remain in the combined total because JKM explicitly recorded them as repeat. Matching alone therefore does not replace the JKM count: it supplies additional evidence and the overlap is removed."},{"type":"p","text":"Counting units: the 537 source rows correspond to 535 distinct identity/date encounters after two same-day extra rows are consolidated. The encounter-level calculation is 328 + 296 − 89 = 535. These records involve 425 candidate linked identity groups: 297 with at least one JKM repeat code, plus 208 with a matched later date, minus 80 groups present in both sets. Group membership is counted once across the whole period. The 425 groups are not independently verified unique people, and annual group counts must not be added. The 208 multiple-date groups and their 506 rows remain a different measure that includes their first observed entries."},{"type":"p","text":"There are 388 first-coded rows somewhere within the recurring cohort, but 180 of those are at the group’s first observed date. They cannot all be called misclassified. Only the 208 rows with an earlier linked date support the primary first-coded-return flag."},{"type":"p","text":"A separate review tier finds 34 additional first-coded rows with an exact normalized multi-word name, birth-year, gender and citizenship matching an earlier record in a different document-linked group: nine in 2023, seven in 2024, 15 in 2025 and three in 2026. These may reflect missing or mistyped documents, or different people with matching demographics. They are provided in possible-repeat-name-matches.csv and are excluded from the 208, 296 and 537 primary figures. No fuzzy spelling match is used."},{"type":"li","text":"Linkage rule: exact normalized document values in the IC/MyKid column Q form an identity group. Eleven-digit numeric Q values are padded to 12 digits to preserve a likely lost leading zero. The exact alternative-document or UNHCR value in R/AE requires an exact normalized name match as corroboration. Matching also recognises the same normalized document and exact normalized name across Q, R and AE. Names alone do not merge records, and fuzzy spelling matches are not used."},{"type":"li","text":"Observed recurrence: 208 linked groups appear on more than one operation date. They contain 506 recorded rows across 504 group/date combinations: 208 first observed dates and 296 subsequent dates. Of these groups, 102 appear in more than one calendar year."},{"type":"li","text":"Narrower document-only check: the IC/MyKid column alone contains 1,022 populated rows and 821 distinct normalized values. Of those document groups, 141 recur on different dates, covering 342 rows. This narrower result does not depend on alternative-document/name linkage."},{"type":"li","text":"Label disagreement after same-day consolidation: of 296 later-date encounters, 206 (69.6%) remain labelled “first”, 89 are labelled second or later and one has no frequency. Also, 205 of those consolidated later entries are marked “new” in the separate case-status field. The raw-row first-coded count is 208, as reconciled above."},{"type":"li","text":"2026 disagreement: 76 entries are later-date encounters in the longitudinal grouping, and 72 of those are labelled “first”. Sixty-three linked groups recorded in 2026 were already present in an earlier year, contributing 71 of the year’s 299 rows."},{"type":"li","text":"Limits: 431 rows have no document usable under this rule. Spelling variants can split the same person across groups, and data-entry or document-sharing errors can merge different people. One Q-linked group has inconsistent gender codes, and 48 Q-linked groups have name variants. The resulting 1,722 groups are not a verified count of unique people."},{"type":"li","text":"Historical repeat cases remain relevant: 216 staff-coded repeat rows occur in groups with only one observed row here. Their earlier encounter may pre-date the files, be absent, or lack a linkable document. A single observed row does not establish a first-ever case."},{"type":"table","rows":[["Within-year linkage only","2023","2024","2025","2026 Jan–Sep","Whole-period comparison (not a sum)"],["Groups appearing on multiple dates in that year","38","28","61","13","208 across the whole period"],["Rows belonging to those groups","88","69","145","27","506 across the whole period"],["Subsequent distinct dates within that year","50","41","84","13","188 within-year returns; 296 including cross-year returns"]]},{"type":"p","text":"The median interval between consecutive observed dates in a linked group is 132 days, ranging from one day to 1,228 days. Sixty-three of 296 return intervals are 30 days or less, 125 are 90 days or less and 243 are 365 days or less. These are observed encounter intervals. They do not measure days without housing, continuous time on the street, or time since discharge unless those events are explicitly recorded."},{"type":"p","text":"Among the immediately preceding entries before these 296 returns, the recorded main actions include release in 123, NGO placement in 25, immigration handover in 14, temporary institutional orders in ten and hospital referral in six. These counts show later re-encounters after those recorded actions. They do not establish failure rates for the services because follow-up duration, completed attendance, other support and comparable denominators are missing."},{"type":"p","text":"Source: Dec 2023.xlsx · Profil · rows 7–693; Dec 2024.xlsx · Profil · rows 7–356; Dec 2025.xlsx · Profil · rows 7–691; Sept 2026.xlsx · Profil · rows 7–305. Fields: Q/R/AE identifiers and P name for local linkage only; J dates; AH frequency; AG status; AO action.."}]},{"title":"11. What recurring individual pathways look like. The following examples use pseudonymous groups and source-row references. They illustrate the records without publishing names or identity numbers.","blocks":[{"type":"table","rows":[["Group P1028: 2025 date","Source row","Recorded category","Recorded main action","Frequency"],["2025-02-23","114","Gelandangan","Lain-lain (Nyatakan)","Pertama"],["2025-04-30","200","Gelandangan","Dilepaskan","Pertama"],["2025-05-18","326","Gelandangan","Lain-lain (Nyatakan)","Pertama"],["2025-05-21","388","Peleser","Lain-lain (Nyatakan)","Pertama"],["2025-10-15","588","Gelandangan","Lain-lain (Nyatakan)","Pertama"],["2025-11-26","646","Gelandangan","Diperintah tahan sementara di Desa Bina Diri/Pusat Sehenti Bina Diri-Sek. 3(2)","Pertama"]]},{"type":"p","text":"P1028 is recorded as a Malaysian citizen with reported age 57 on six dates in 2025. All six records say “first”. The category changes once to Peleser and later back to homelessness. The final observed entry records a temporary Desa Bina Diri/Pusat Sehenti Bina Diri order. This is a concrete example of recurrence and classification change that a simple repeat-code total misses."},{"type":"p","text":"P0504 is an adult non-citizen group linked by alternative document plus exact normalized name across all four years: 2023 rows 546 and 675, 2024 row 312, 2025 row 241, and 2026 row 29. The shared document also appears on differently named children, who are kept separate. The adult’s recorded birth-year is inconsistent on one entry. This illustrates both persistence across years and the need to guard against family-card over-merging."},{"type":"p","text":"Two 24 September 2026 identity/date pairs have conflicting main actions: rows 220 and 272, and rows 228 and 273 of the 2026 profile. In each pair one row records a hospital referral and the other release. Without a time-of-day sequence or supporting case notes, the final disposition cannot be determined. These pairs remain visible in the quality audit."}]},{"title":"12. Mental-health indications and mental disability. The mental-health count deliberately combines several distinct signals without equating them. A coded illness, an assessed need, a stated causal factor and an OKU mental-disability category are different kinds of record.","blocks":[{"type":"table","rows":[["Mental-health signal","2023","2024","2025","2026 Jan–Sep","Total"],["Illness field explicitly coded Mental","5","0","11","33","49"],["Disability field coded Mental","1","0","8","2","11"],["Mental illness recorded as factor","1","0","6","1","8"],["Mental rehabilitation recorded as need","2","1","4","0","7"],["Mental mentioned in selected narrative fields","0","2","3","0","5"],["Any of these, counted once per row","5","2","14","35","56"]]},{"type":"p","text":"Signal rows overlap and must not be added. Selected narrative fields are AK, AN, AP and AW. Suspected mental illness is retained as an indication, not upgraded to a confirmed diagnosis. The files do not supply standardized psychiatric diagnoses, clinical assessment results, severity, capacity assessments or medication histories."},{"type":"p","text":"There are 49 records explicitly coded Mental in the illness field and 56 with any of the mental-health signals. These 56 rows belong to 52 linked groups under the stated rule. Their reported ages have a median of 54, with 16 aged 60 or above and four missing ages. There are 47 citizen entries and nine non-citizen entries; 37 are recorded male, 18 female and one has no gender."},{"type":"p","text":"The broad mental-health count rises from five records in 2023 to two in 2024, 14 in 2025 and 35 in 2026. In 2026, 32 of 35 occur on 24 September; all 32 carry the Mental illness code. That day alone accounts for 57.1% of all 56 mental-health-indication rows across the entire period. This could reflect who was encountered, screening or recording practices, and concentration of operations. The files cannot separate those explanations or establish a city-wide prevalence trend."},{"type":"table","rows":[["Recorded main action for mental-health-indication rows","2023","2024","2025","2026 Jan–Sep","Total"],["Hospital referral","0","1","4","27","32"],["Released","0","1","2","1","4"],["Immigration handover","0","0","2","6","8"],["Returned to family","1","0","0","0","1"],["Other action","0","0","6","1","7"],["No recorded action","4","0","0","0","4"]]},{"type":"p","text":"Across these 56 records, 32 have a main action of hospital referral, eight immigration handover, seven other action, four release, one family return and four no recorded action. In 2026 the corresponding actions are 27 hospital referrals, six immigration handovers, one release and one other action. These are recorded routes or recommendations. They do not prove hospital admission, treatment completion, clinical improvement, safe discharge or a completed immigration process."},{"type":"p","text":"A further distinction matters: 11 rows have a mental-disability code, of which nine also have the Mental illness code. Thirty-two mental-health-indication rows are coded “Tiada/Normal” in the disability field, all in 2026. Mental illness is not automatically registered mental disability. The combination may be a valid distinction or inconsistent recording; the file does not resolve it. No person is reclassified as OKU simply because a mental-health indication appears."},{"type":"p","text":"Only seven of the 56 mental-health-indication rows record mental rehabilitation as the primary need, while 36 have an unknown primary need. This indicates a documentation gap between the mental-health signal and the needs field. It does not prove that no assessment or support occurred outside the spreadsheet."},{"type":"p","text":"Source: Dec 2023.xlsx · Profil · rows 7–693; Dec 2024.xlsx · Profil · rows 7–356; Dec 2025.xlsx · Profil · rows 7–691; Sept 2026.xlsx · Profil · rows 7–305. Fields: AV illness; AX disability; AJ factor; AM need; AK/AN/AP/AW narratives; AO main action; J date.."}]},{"title":"13. OKU and other disabilities. The primary OKU-related count includes disability-field codes 2–8. The spreadsheet does not consistently distinguish a formally registered OKU status from a recorded disability description, so the report calls these coded disability records.","blocks":[{"type":"table","rows":[["Coded disability","2023","2024","2025","2026 Jan–Sep","Total"],["Physical","3","9","17","8","37"],["Mental","1","0","8","2","11"],["Learning disability","1","4","2","2","9"],["Visual","0","1","2","3","6"],["Hearing","1","1","1","1","4"],["Multiple","0","0","1","0","1"],["Speech","0","0","0","0","0"],["All coded disabilities","6","15","31","16","68"],["No disability / Normal","1","59","403","262","725"],["Missing or unknown","680","276","251","21","1,228"]]},{"type":"p","text":"The 68 coded disability records belong to 65 linked groups: 39 citizen and 29 non-citizen entries. Physical disability is the largest category, with 37 records, followed by mental disability with 11 and learning disability with nine. Learning disability is kept separate from the mental-disability and mental-illness counts. One multiple-disability entry does not specify its component disabilities, so it cannot be assigned to physical and mental subcategories."},{"type":"p","text":"Disability recording changes enormously. In 2023, 680 of 687 disability fields are blank; only seven have either a normal or disability code. In 2026, only 21 of 299 are blank or unknown. The apparent rise from six to 16 coded disabilities therefore cannot be interpreted as a reliable increase in prevalence. Across all records, 1,228 entries (60.8%) have no usable disability status."},{"type":"table","rows":[["Recorded main action","All coded disability rows","Physical disability rows","Mental disability rows"],["Released","40","27","2"],["Hospital referral","6","0","6"],["Temporary institution order, RSK","2","2","0"],["Temporary institution order, DBD/PSBD","8","5","0"],["Immigration handover","3","1","1"],["Family return","1","0","1"],["NGO placement","1","0","0"],["Protector handover","1","0","0"],["Other action","3","1","1"],["No main action","3","1","0"]]},{"type":"p","text":"Forty of 68 coded disability records (58.8%) have release as their main action. For physical disability this is 27 of 37 (73.0%). Physical-disability entries include 22 non-citizen records and 15 citizen records, and 24 are classified as begging. Mental-disability entries more often record hospital referral: six of 11. Release does not establish that accommodation, equipment, transport, care or follow-up were unnecessary or provided."},{"type":"p","text":"Three further rows contain an explicit disability-related description in selected narratives without a substantive disability code: 2023 rows 97 and 107 and 2024 row 338. They are listed separately in the quality audit rather than silently added to the coded disability total. Pain, a weak leg, an illness or an older age is not automatically classified as disability."},{"type":"p","text":"Source: Dec 2023.xlsx · Profil · rows 7–693; Dec 2024.xlsx · Profil · rows 7–356; Dec 2025.xlsx · Profil · rows 7–691; Sept 2026.xlsx · Profil · rows 7–305. Fields: AX disability; AW/AK narrative descriptions; W citizenship; AF category; AO main action.."}]},{"title":"14. Other health needs and substance-use information. Health information is not a clinical register. Many records say only “healthy”, “unwell” or “unknown”, and diagnoses are not independently verified.","blocks":[{"type":"table","rows":[["Health-status field","2023","2024","2025","2026 Jan–Sep","Total"],["Healthy","558","3","415","227","1,203"],["Unwell / health problem","24","20","48","71","163"],["Explicitly unknown","101","327","134","0","562"],["Blank","4","0","88","1","93"]]},{"type":"p","text":"There are 163 entries recorded as unwell, 1,203 as healthy, and 655 with unknown or blank health status. Health recording is particularly incomplete in 2024: 327 of 350 (93.4%) are unknown. In 2026, 71 of 299 (23.7%) are coded unwell and only one health-status field is blank. The change in recording completeness is too large to interpret raw annual illness counts as disease incidence."},{"type":"p","text":"Outside mental health, the structured illness field records HIV on six rows and Hepatitis B on three. Narrative notes additionally mention diabetes, hypertension, heart and kidney problems, asthma, stroke, fractures or mobility difficulties, skin conditions, gout and alcohol dependence. Eight 2025 rows mention Hepatitis C without an explicit negative result. A separate row explicitly says Hep C and HIV negative and is excluded from that positive/unspecified Hepatitis C mention count. One 2024 note describes suspected tuberculosis; this is not treated as a confirmed case. One narrative HIV mention is not added blindly to the structured HIV count because the fields may overlap."},{"type":"table","rows":[["Drug-use field","2023","2024","2025","2026 Jan–Sep","Total"],["Never used, as recorded","201","2","44","185","432"],["Currently using","3","1","6","9","19"],["Former user","1","2","6","9","18"],["Unknown or blank","482","345","629","96","1,552"]]},{"type":"p","text":"Only 19 records explicitly state current drug use and 18 former use. Unknown or blank status affects 1,552 of 2,021 rows (76.8%). The files do not support a conclusion that drug use is either rare or the main driver of this caseload. Drug-related needs, illness notes and AADK routes may occur on rows without a completed drug-use field."},{"type":"p","text":"The primary action field records 52 hospital referrals. In 2025, the “other action” detail additionally records 34 KKM routes and three nearby-clinic referrals. Counting these explicitly recorded health routes produces 89 rows across the period, rather than only 52. This shows that reliance on the main action code alone misses health-related routing. It is not a count of 89 completed treatments."},{"type":"p","text":"Source: Dec 2023.xlsx · Profil · rows 7–693; Dec 2024.xlsx · Profil · rows 7–356; Dec 2025.xlsx · Profil · rows 7–691; Sept 2026.xlsx · Profil · rows 7–305. Fields: AU health status; AV illness code; AW illness narrative; AY drug use; AO/AP actions.."}]},{"title":"15. Reasons for becoming a case and stated needs. Each source field provides one main category, while a person may have multiple simultaneous problems. The tables describe recorded reasons and priorities, not causal estimates.","blocks":[{"type":"table","rows":[["Main recorded factor","2023","2024","2025","2026 Jan–Sep","Total"],["No employment","127","321","47","72","567"],["Low income","8","0","8","3","19"],["Poverty","417","10","3","1","431"],["No accommodation","24","7","132","133","296"],["Family rejection","0","0","2","0","2"],["Mental illness","1","0","6","1","8"],["Other health problem","3","1","5","2","11"],["Drug addiction","2","0","11","0","13"],["Former prisoner","0","0","1","0","1"],["Other","1","4","26","16","47"],["Unknown or blank","104","7","444","71","626"]]},{"type":"p","text":"No employment (567), poverty (431), and no accommodation (296) are the largest substantive factor categories. But their coding changes dramatically: poverty dominates in 2023 (417 of 687), no employment in 2024 (321 of 350), unknown reasons in 2025 (444 including one blank), and no accommodation in 2026 (133 of 299). These shifts may reflect both changing cases and changing data entry. The evidence does not establish that poverty stopped being a problem or that unemployment rose and then disappeared."},{"type":"table","rows":[["Primary recorded need","2023","2024","2025","2026 Jan–Sep","Total"],["Accommodation","17","8","99","137","261"],["Employment","49","11","6","30","96"],["Return-home assistance","179","5","1","2","187"],["Medical care","1","2","17","8","28"],["Mental rehabilitation","2","1","4","0","7"],["Drug rehabilitation","1","0","5","2","8"],["Psychology / counselling","2","0","0","1","3"],["Alcohol rehabilitation","0","0","0","0","0"],["Other","0","2","13","1","16"],["None","304","1","35","30","370"],["Unknown or blank","132","320","505","88","1,045"]]},{"type":"p","text":"Unknown or blank need affects 1,045 records (51.7%). A recorded “none” (370 rows) is kept distinct from missing information. Accommodation is the leading substantive need at 261 rows, including 137 in 2026. Of those 261 housing-need rows, 226 are citizens and 126 have a reported age of at least 60."},{"type":"p","text":"For the 261 accommodation-need records, the main action is a temporary institutional order in 105, NGO placement in 58, release in 44, immigration handover in 23, another action in 13, hospital referral in ten, a permanent institutional order in three, family return in one, and blank in four. These are immediate routes; none proves sustained housing. The 44 releases are cases worth checking for what accommodation or follow-up was arranged, rather than automatically labelling the release inappropriate."},{"type":"p","text":"Recorded duration also changes in a way that makes a simple chronic-homelessness trend unsafe. In 2023, 594 rows (86.5%) use the 1–2 year duration category. In 2024, 194 rows use 1–2 months. In 2025, 347 duration fields are unknown or blank, rising to 212 of 299 in 2026 (70.9%). This could reflect case mix, defaults, limited assessment or other recording practices. It cannot establish that long-term homelessness was eliminated."},{"type":"p","text":"Source: Dec 2023.xlsx · Profil · rows 7–693; Dec 2024.xlsx · Profil · rows 7–356; Dec 2025.xlsx · Profil · rows 7–691; Sept 2026.xlsx · Profil · rows 7–305. Fields: AJ/AK factor; AL duration; AM/AN need; AO action.."}]},{"title":"16. Where the operation encounters people. Parliamentary areas and operation locations show where recorded encounters occur. They are not residential addresses or area-level prevalence rates. Broad or multi-location entries are not artificially allocated to particular streets.","blocks":[{"type":"table","rows":[["Parliament field","2023","2024","2025","2026 Jan–Sep","Total"],["P120 Bukit Bintang","473","131","144","250","998"],["P119 Titiwangsa","100","176","479","14","769"],["P117 Segambut","56","8","0","1","65"],["P121 Lembah Pantai","18","21","4","15","58"],["W.P. Kuala Lumpur","0","0","47","0","47"],["P122 Seputeh","14","5","0","0","19"],["P123 Cheras","9","1","5","2","17"],["P114 Kepong","2","1","1","7","11"],["P116 Wangsa Maju","4","1","3","3","11"],["P115 Batu","7","1","1","1","10"],["P124 Bandar Tun Razak","2","0","1","6","9"],["P118 Setiawangsa","2","5","0","0","7"]]},{"type":"p","text":"Bukit Bintang accounts for 998 records (49.4%) and Titiwangsa for 769 (38.1%). Together these two labels cover 1,767 of 2,021 rows (87.4%). Bukit Bintang dominates in 2023 and 2026; Titiwangsa dominates in 2024 and 2025. The sharp switch could reflect operation targeting or coding as well as the distribution of people."},{"type":"table","rows":[["Normalized specific location label","2023","2024","2025","2026 Jan–Sep","Total"],["BUKIT BINTANG","214","32","6","131","383"],["JALAN TUANKU ABDUL RAHMAN","54","46","0","0","100"],["CHOW KIT/JALAN TAR","0","65","0","0","65"],["MASJID INDIA","49","0","0","0","49"],["CHOW KIT","30","12","5","0","47"],["KOTA RAYA","31","5","4","0","40"],["MASJID DANG WANGI","17","13","0","0","30"],["MASJID BANGSAR","12","7","0","8","27"],["MASJID KAMPUNG BHARU","10","15","0","0","25"],["DANG WANGI","24","0","0","0","24"],["LEBUH PUDU","0","0","22","2","24"],["MASJID JAMEK","14","8","0","0","22"],["PASAR MALAM JALAN KUCHING","15","0","0","6","21"],["MASJID TTDI","21","0","0","0","21"],["PASAR CHOW KIT","6","14","0","0","20"],["BAZAAR RAMADAN JALAN RAJA ALANG","0","19","0","0","19"],["LRT PASAR SENI","6","10","0","0","16"],["JALAN LUMUT","0","1","1","14","16"]]},{"type":"p","text":"The strongest specific labels are Bukit Bintang (383), Jalan Tuanku Abdul Rahman/Jalan TAR (100), the combined Chow Kit/Jalan TAR entry (65), Masjid India (49), Chow Kit (47) and Kota Raya (40). Chow Kit, Jalan TAR, Masjid India, Kota Raya, Dang Wangi, Pudu and transit locations form a repeated central-city pattern, but the combined entries are not double-counted into each component street."},{"type":"p","text":"Location precision deteriorates sharply in 2025: 601 of 685 entries (87.7%) say only Bandar Kuala Lumpur or Kuala Lumpur. Another 110 of 299 (36.8%) are generic in 2026. Across the full dataset, 711 rows lack a specific location, plus one blank location in 2025. A detailed street-level hotspot ranking based only on 2025 would therefore be misleading. The 2026 Bukit Bintang label covers a broad district, not a precise coordinate."},{"type":"p","text":"Places of worship, night markets, bazaars and transit locations recur in the specific labels. Explicit Ramadan/Aidilfitri bazaar labels and notes about begging only during the fasting month indicate that some activity may be tied to particular contexts. The data do not establish a recurring seasonal effect because the mix and intensity of operations varies substantially."},{"type":"p","text":"Source: Dec 2023.xlsx · Profil · rows 7–693; Dec 2024.xlsx · Profil · rows 7–356; Dec 2025.xlsx · Profil · rows 7–691; Sept 2026.xlsx · Profil · rows 7–305. Fields: F parliamentary area; I operation location. Normalization merges case, spacing, Jln/Jalan, Kotaraya/Kota Raya and the explicit Jalan TAR variants; distinct religious sites and combined-location strings remain separate.."}]},{"title":"17. What happens next in the records. The primary action field is labelled “type of action/recommendation by the case officer”. A recorded value may be an action or a recommendation. Court decisions and closure dates are separate fields and do not automatically confirm that the recommended route was completed.","blocks":[{"type":"table","rows":[["Main action or recommendation","2023","2024","2025","2026 Jan–Sep","Total"],["Released","184","312","211","124","831"],["Other action / agency route","0","0","248","14","262"],["Immigration handover","0","0","110","35","145"],["Temporary order: DBD/PSBD","12","1","14","76","103"],["Temporary order: RSK","0","4","23","0","27"],["NGO care placement","0","6","56","0","62"],["Hospital referral","1","4","4","43","52"],["Protector handover","20","8","5","0","33"],["Returned to family","3","7","8","1","19"],["Permanent order: RSK","1","1","0","0","2"],["Permanent order: DBD/PSBD","0","0","0","3","3"],["Left before action taken","0","0","1","2","3"],["Police handover","0","0","1","0","1"],["Unknown or blank","466","7","4","1","478"]]},{"type":"p","text":"Release is the largest recorded main action, with 831 rows (41.1% of the whole dataset). The action is unknown or blank on 478 rows (23.7%), including 466 of 687 in 2023. Among rows with a substantive main action, release is 831 of 1,543 (53.9%). The whole-period release percentage should not be interpreted as a reliable policy trend because 2023 action recording is incomplete."},{"type":"p","text":"In 2026 the main actions include 124 releases, 76 temporary DBD/PSBD orders, three permanent DBD/PSBD orders, 43 hospital referrals and 35 immigration handovers. Institutional-order action codes therefore cover 79 of 299 entries (26.4%), compared with 37 of 685 (5.4%) in 2025. Hospital referrals rise from four in 2025 to 43 in 2026, although the extra KKM/clinic routes in 2025 narrow the difference in broader health routing."},{"type":"table","rows":[["Detail within the 248 “other action” rows in 2025","Count"],["JWP / Diserah ke JWP","114"],["YKN / Rujuk ke YKN","35"],["KKM","34"],["PKG / Rujuk ke PKG / Pusat Khidmat Geladangan","22"],["MKN","19"],["AADK / AADK Dang Wangi","17"],["Nearby-clinic referral","3"],["Housing note only","1"],["RSK temporary-order narrative","1"],["No other-action detail","2"]]},{"type":"p","text":"Acronyms are preserved as entered. Different organizations and descriptions in the free-text “other” field are not all interpreted as treatment, housing or case resolution. This table is limited to rows whose main action is actually “other”; it therefore differs slightly from totals of the free-text field across every row."},{"type":"p","text":"The separate court-stage field records a magistrates-court stage on 137 rows, but only 35 rows contain a court-decision value: 19 temporary DBD/PSBD decisions and 16 temporary RSK decisions. Of 135 rows carrying an institutional-order code in the main action field, 100 have no populated court-decision field. The spreadsheet cannot establish that all these proposed or recorded routes were confirmed court decisions. The source section references are retained as labels; this report does not offer a legal interpretation of those provisions."},{"type":"table","rows":[["Administrative recording","2023","2024","2025","2026 Jan–Sep","Total"],["Closure/end date populated","78","350","684","286","1,398"],["Closure dated the same day as operation","75","326","570","46","1,017"],["Closure dated the next day","0","2","108","204","314"],["Status explicitly marked completed/finished","0","1","0","0","1"]]},{"type":"p","text":"Closure dates are populated on 1,398 rows, but only one case-status value is explicitly completed/finished. This mismatch suggests that the fields are not being used as a consistent end-to-end case-management system. In 2026, 204 closure dates are the day after the operation. That may mark an administrative step; it is not evidence of recovery within one day."},{"type":"p","text":"Thirty-three 2026 closure dates occur after 30 September. Thirty-two are 25 October 2026, later than this analysis date of 18 October, and one is 1 October. All 33 belong to institutional-order action rows. Their meaning needs checking: they may be intended dates, scheduled milestones or entry errors. They cannot be accepted as completed September outcomes. Five records across the files have an end date earlier than the operation date."},{"type":"p","text":"Only 67 records carry a positive answer to the 30-day social-report charter field: one in 2025 and 66 in 2026. Of 137 rows marked as having a magistrates-court stage, 50 have that positive charter response. Seventeen other positives occur on rows marked not applicable for court stage. Since the source does not consistently provide the temporary-order receipt date and social-report completion date, the file cannot independently establish a compliance rate."},{"type":"li","text":"What can be described: recorded release, family return, institutional route, protector or agency handover, hospital or clinic referral, and the next observed encounter in these files."},{"type":"li","text":"What cannot be established: referral attendance, admission or discharge details, medication or therapy, disability registration completion, benefits received, immigration case resolution, stable housing at 30/90/180 days, employment retention, mortality or long-term recovery."},{"type":"li","text":"Absence of a later record: a person may have obtained housing, moved away, avoided an operation, been admitted elsewhere or simply not been documented again. Absence is not a successful-outcome measure."},{"type":"p","text":"Source: Dec 2023.xlsx · Profil · rows 7–693; Dec 2024.xlsx · Profil · rows 7–356; Dec 2025.xlsx · Profil · rows 7–691; Sept 2026.xlsx · Profil · rows 7–305. Fields: AO/AP main action and narrative; AQ court stage; AR court decision; AT decision date; BD closure date; AG status; BE charter.."}]},{"title":"18. Education, work and family circumstances. These fields provide useful examples but are too incomplete to describe the entire population reliably.","blocks":[{"type":"table","rows":[["Field","Substantive recorded categories across all years","Missing or unknown"],["Education","Never attended school 134; primary 20; secondary 12; SPM/equivalent 1; STPM/equivalent 1","1,853 (91.7%)"],["Previous occupation","Not working 273; self-employed 47; private-sector employee 19; government employee 3; homemaker 6; student 2; retired 1","1,670 (82.6%)"],["Marital status","Single 310; married 233; Duda 61; Janda 43; Balu 29","1,345 (66.6%)"]]},{"type":"p","text":"The work field explicitly asks about previous occupation, so “not working” should not be treated as a verified current unemployment rate. Some case narratives also say that a person works but lacks accommodation, has irregular income, or has a room but insufficient income. These combinations are hidden by a single no-work/no-housing category."},{"type":"p","text":"The source marital labels Duda, Janda and Balu are preserved rather than assuming identical meanings. Recording does not establish whether a named relative is able or willing to provide care or housing. A family-return action is not evidence of a safe or sustained placement without subsequent confirmation."},{"type":"p","text":"Source: Dec 2023.xlsx · Profil · rows 7–693; Dec 2024.xlsx · Profil · rows 7–356; Dec 2025.xlsx · Profil · rows 7–691; Sept 2026.xlsx · Profil · rows 7–305. Fields: AZ/BA education; BB previous occupation; BC marital status; AK/AP narrative notes.."}]},{"title":"19. Data-quality findings that affect interpretation. Missing values and inconsistent fields are analytical findings in their own right. They limit what can be concluded and show where recording improvements would be most useful.","blocks":[{"type":"table","rows":[["Missing or explicitly unknown field","2023","2024","2025","2026 Jan–Sep","Total"],["Health status","105 (15.3%)","327 (93.4%)","222 (32.4%)","1 (0.3%)","655 (32.4%)"],["Disability status","680 (99.0%)","276 (78.9%)","251 (36.6%)","21 (7.0%)","1228 (60.8%)"],["Reason/factor","104 (15.1%)","7 (2.0%)","444 (64.8%)","71 (23.7%)","626 (31.0%)"],["Duration","7 (1.0%)","30 (8.6%)","347 (50.7%)","212 (70.9%)","596 (29.5%)"],["Primary need","132 (19.2%)","320 (91.4%)","505 (73.7%)","88 (29.4%)","1045 (51.7%)"],["Main action","466 (67.8%)","7 (2.0%)","4 (0.6%)","1 (0.3%)","478 (23.7%)"],["Education","533 (77.6%)","346 (98.9%)","677 (98.8%)","297 (99.3%)","1853 (91.7%)"],["Previous occupation","446 (64.9%)","316 (90.3%)","626 (91.4%)","282 (94.3%)","1670 (82.6%)"],["Marital status","452 (65.8%)","157 (44.9%)","587 (85.7%)","149 (49.8%)","1345 (66.6%)"]]},{"type":"table","rows":[["Consistency issue","Count / evidence","Why it matters"],["Duplicated 2025 case table","685 duplicate entries on Sheet1","Would add 685 false case entries if both sheets were counted"],["Month field disagrees with operation date","24 rows, plus one blank month","Month-name groupings change trend totals"],["Numeric age vs birth-year mismatch >1 year","92 rows","Age profiles remain approximate"],["Numeric age outside source age band","22 rows","Age-band counts and numeric-age counts differ"],["Closure before operation","5 rows","Invalid time ordering"],["2026 closure after reporting period","33 rows, including 32 future-dated to 25 Oct","Cannot treat as completed September outcomes"],["Same linked identity/date with multiple rows","3 extra rows, including 2 hospital/release conflicts in 2026","Final action and distinct encounter count are uncertain"],["Later observed encounter still labelled first","206 of 296 consolidated dates; 208 of 298 raw rows","160 linked groups affected; counts use different units"],["Later observed encounter marked new","205 of 296 later-date entries","New administrative case is not necessarily a new person"],["Citizen code plus immigration handover","2025 profile row 457","Citizenship/action inconsistency needs source review"],["Citizen code with non-citizen-origin field populated","2023 profile row 69: Indonesia in AB","Field applicability needs review; country and citizenship are distinct"],["UNHCR number in holder yes/no field","2024 profile row 125","Invalid status entry should not silently become yes"],["Normal disability code with mental-health signal","32 rows, all 2026","Illness and disability must stay distinct; consistency still needs review"]]},{"type":"p","text":"Some text values in education and occupation say “Tiada Maklumat” with code numbers that belong to other categories in the coding sheet. Missingness is therefore identified from both the label and the blank value, rather than blindly interpreting the number alone. The original codes and text are retained in the extraction."},{"type":"p","text":"The provided quality-audit CSV identifies individual affected source rows. It is not a cleaned replacement for the originals. Questionable values are not overwritten and no unrecorded clinical, legal or housing outcome is imputed."}]},{"title":"20. Practical conclusions supported by these files. These are operational implications of the records, not claims that a particular intervention caused the observed changes.","blocks":[{"type":"li","text":"Track people as well as new administrative cases. Use a persistent internal person key with an explicit review process for alternate names, shared family documents and incorrect IDs. Preserve an encounter key separately. A first case in a reporting cycle should not erase prior encounters."},{"type":"li","text":"Separate the service populations when reviewing performance. At minimum, compare citizens/non-citizens, adults/children, begging/homelessness/Peleser, and operation types. This would prevent a changing population mix from appearing to be a service effect."},{"type":"li","text":"Plan for middle-aged and older adults. The 2026 age profile, 126 older records with an accommodation need across the period, and recurring institutional routes show that age, housing and health support need to be considered together."},{"type":"li","text":"Make health routing visible. Keep the broad hospital/KKM/clinic route separate from completed assessment and treatment. Record the referral destination, whether it was accepted, whether the person attended, and the next confirmed step."},{"type":"li","text":"Record disability and mental illness separately. Distinguish a recorded limitation, formal registration, clinical illness, suspected illness and an assessed support need. Do not rely on a normal/unknown field to negate a narrative concern."},{"type":"li","text":"Preserve precise encounter locations. A specific street/site and a broad area should have different fields. Generic Kuala Lumpur labels erase the information needed to identify actual hotspots and plan repeat outreach."},{"type":"li","text":"Replace closure alone with measurable follow-up. A referral, order or release can close an administrative action while housing and treatment remain unresolved. Track confirmed accommodation and service engagement at specified follow-up points, and retain an explicit unknown category."},{"type":"li","text":"Review the flagged high-priority inconsistencies. Start with same-day hospital/release conflicts, future end dates, citizenship/action conflicts, mismatched ages and repeatedly first-coded identities. Review against the original case files rather than automatically correcting them."},{"type":"p","text":"The strongest defensible reading is that these files document a changing operation and a changing recorded caseload, substantial recurrence obscured by first/new labels, increasing recorded demand among older Malaysian adults, and a concentrated mental-health burden in the September 2026 operation. They do not establish a reliable city-wide homelessness rate, a treatment success rate or a durable housing success rate."}]},{"title":"21. Extraction and reproducibility. The companion files make the findings traceable while keeping direct identifiers out of the deliverables.","blocks":[{"type":"table","rows":[["Review performed","Result"],["Original source hashes compared with the first report","All four match; source workbooks unchanged"],["Independent XML extraction versus the original extraction","2,021 record locations, dates, numeric ages and relevant source fields match"],["Duplicate 2025 secondary table","All 685 case entries match the principal table; excluded once"],["Independent graph-based identity linkage","Independent graph check confirms 1,722 groups and 208 recurring groups under the revised cross-column rule"],["Published source-derived table cells reviewed","1,223"],["Additive annual-to-total rows reconciled","188"],["Arithmetic discrepancies in these checks","0"]]},{"type":"table","rows":[["Deliverable","Contents"],["case-records-pseudonymized.csv","All 2,021 principal-table records, source workbook/sheet/row, original categorical codes and text, numeric age, dates, normalized origin/location, linkage group and analytical flags."],["repeat-encounter-audit.csv","296 later-date linked encounters, with previous/current source rows, actions, dates, staff frequency/status and interval in days."],["repeat-encounter-raw-rows.csv","All 298 source rows on later linked dates, including the two additional same-day rows."],["first-coded-repeat-review.csv","208 first-coded rows with a document-linked earlier date, across 160 groups."],["repeat-identity-groups.csv","208 recurring identity groups with counts of dates, rows, first-coded later rows and consistency flags."],["possible-repeat-name-matches.csv","34 unconfirmed exact-name/birth-year/gender/citizenship matches, excluded from primary repeat totals."],["verified-totals.csv","Independently reviewed annual and cumulative source, demographic, health and recurrence totals."],["data-quality-audit.csv","Affected rows and the specific inconsistencies used in this report."],["analysis-tables.csv","Long-form counts by year for source categories, reported-age bands and normalized non-citizen origins."],["unique-repeat-by-year.csv","First-observed identities, later dates, same-day extras and annual distinct-identity measures."],["vulnerability-gender-breakdown.csv","All ages and age 60+, by year, recorded condition, citizenship and gender."],["physical-illness-record-review.csv","60 explicit physical-condition records and one separate suspected-only case, with source-row evidence."],["jkm-repeat-comparison-by-year.csv","Annual JKM repeat codes, data-matched returns, overlap, additional records, combined totals and counting units."],["jkm-repeat-combined-records.csv","All 537 combined repeat-evidence source records, identifying JKM-only, matching-only and overlapping evidence; direct identifiers withheld."]]},{"type":"p","text":"Pseudonymization removes names, full document numbers, UNHCR numbers, file references and case-officer names. The one named family-contact detail is replaced with a neutral description, and two disability-registration numbers embedded in narrative text are removed. Source-row references still allow the user to locate the original case. Rare combinations and source access can permit re-identification, so these files are not anonymous public-use datasets."},{"type":"p","text":"The English column names identify the field, while source categorical values remain in Malay with their original codes. Derived fields are labelled separately. The report does not alter source workbooks, recalculate them, execute macros, or contact outside services. All relevant case-table cells are stored values, with no formulas requiring recalculation."},{"type":"table","rows":[["Source workbook","SHA-256 before analysis"],["Dec 2023.xlsx","26240128abb7083c9eda63a94383c2b4cf3e791b3caa96f0d8e0254cc3cc8fa2"],["Dec 2024.xlsx","407ff5837dbf34a15c87838c76aa41e0c7d837e03a56e71ee9e91f0765a3f013"],["Dec 2025.xlsx","2656b67343f22b26cee5a2d96d0673246c2f82c468235b581b0fc7de3a17ed78"],["Sept 2026.xlsx","ca3bebbcb1d3fdedbd9bb504a175d2e2c88b2db5bac61db36ab08ae3c275d59a"]]},{"type":"p","text":"Percentages are rounded to one decimal. Denominators are stated beside the relevant analysis: most percentages use all recorded rows; age percentages explicitly marked “known ages” exclude missing ages; nationality uses non-citizen rows; ethnicity/state-origin comparisons use citizen rows. Tables may not sum to 100.0% because of rounding. Recurrence measures are exploratory linkage results, not verified identities or causal evaluations."}]},{"title":"22. Unique identities and repeat encounters by year. The word unique can mean a distinct identity, a person seen only once, or a first recorded encounter. These meanings give different figures. The following reconciliation keeps them separate and uses the same document-linkage rules as the existing repeat audit.","blocks":[{"type":"table","rows":[["Period","Identities first observed in the full history","Later linked encounter dates","Additional same-day rows","Recorded rows"],["2023","636","50","1","687"],["2024","287","63","0","350"],["2025","578","107","0","685"],["2026 Jan–Sep","221","76","2","299"],["Whole period","1,722","296","3","2,021"]]},{"type":"p","text":"2,021 recorded rows = 1,722 first-observed identity rows + 296 later-date encounters + 3 additional same-day rows. Thus the working estimate is 1,722 distinct linked identities. The remaining 299 records comprise 296 later-date encounters and three same-day extras. The three extras are not automatically classified as separate returns. This is a document-linkage estimate, not a verified count of different people; missing or erroneous identifiers can change the true number."},{"type":"p","text":"A first-observed identity means the earliest appearance found in these supplied files, not necessarily a first-ever encounter with JKM. Some first-observed entries are already staff-coded repeat because their history may pre-date these records or be otherwise absent. The existing staff-coded repeat total of 328 and repeat-evidence review total of 537 are therefore different measures."},{"type":"table","rows":[["Year","Distinct identities appearing in that year","First observed during that year","Already present in an earlier year"],["2023","636","636","0"],["2024","309","287","22"],["2025","601","578","23"],["2026 Jan–Sep","284","221","63"]]},{"type":"p","text":"Annual distinct-identity counts are not additive: an identity can appear in several years. For example, 2026 contains 284 distinct linked identities, of whom 221 first appear in 2026 and 63 appeared earlier. The whole-period distinct count is 1,722, not the sum of annual counts."},{"type":"table","rows":[["Period","Identities seen on one date","Identities seen on multiple dates","Distinct identities in that period"],["2023","598","38","636"],["2024","281","28","309"],["2025","540","61","601"],["2026 Jan–Sep","271","13","284"],["Whole period, recomputed","1,514","208","1,722"]]},{"type":"p","text":"Across the whole period, 1,514 groups are seen on only one date and 208 groups on multiple dates, giving 1,722 groups. The one-date groups contain 1,515 source rows because one has two entries on the same date. The recurring groups contain 506 rows, including first observations and two additional same-day entries. Accordingly 1,515 rows in one-date groups + 506 rows in recurring groups = 2,021; all 506 rows should not be called return encounters. If unique means exactly one source row, the count is 1,513 groups, rather than 1,514 one-date groups."},{"type":"p","text":"Source: Dec 2023.xlsx · Profil · rows 7–693; Dec 2024.xlsx · Profil · rows 7–356; Dec 2025.xlsx · Profil · rows 7–691; Sept 2026.xlsx · Profil · rows 7–305. Fields: P/Q/R/AE linkage evidence; J operation dates. Identifiers remain withheld in deliverables; the linkage rules and limitations are unchanged from section 10.."}]},{"title":"23. Citizenship, OKU, mental illness and physical illness by gender. These tables use all 2,021 case records. They retain repeat appearances, so their gender and citizenship totals reconcile to the source rows. They are not demographic counts of 1,722 deduplicated people.","blocks":[{"type":"table","rows":[["All ages: recorded group","Male","Female","Gender unknown","Total"],["All case records","1,329","687","5","2,021"],["Citizens","806","208","0","1,014"],["Non-citizens","520","479","5","1,004"],["Citizenship unknown","3","0","0","3"],["All coded OKU/disability","49","18","1","68"],["OKU/disability: physical","34","3","0","37"],["OKU/disability: mental","4","6","1","11"],["OKU/disability: other categories","11","9","0","20"],["Mental illness: explicit illness code","35","14","0","49"],["Mental health: broader indication","37","18","1","56"],["Physical illness/health condition: explicit record","45","14","1","60"],["Physical illness: suspected only","1","0","0","1"],["Unwell: illness type unresolved","38","14","0","52"]]},{"type":"p","text":"Citizens + non-citizens + unknown citizenship form a partition of all records. The health and disability rows overlap. Physical, mental and other disability are the components of the 68 coded disability records; the disability subtotal must not be added again to those components."},{"type":"p","text":"Definitions retained: OKU/disability means the substantive category codes in AX, without assuming formal registration. Mental illness means the 49 records explicitly coded Mental in AV. The broader mental-health indication count remains 56 and includes other relevant fields and narratives; it does not create seven additional confirmed diagnoses. Mental disability is a separate measure and can overlap the illness measures."},{"type":"p","text":"New physical-illness definition: 60 records contain an explicit physical illness, injury or symptom description in the illness code/detail fields, or the specific diabetes description in the needs narrative. This includes recorded conditions such as diabetes, hypertension, HIV/hepatitis, asthma, stroke, fractures and physical symptoms. It excludes disability alone, old age alone, substance use alone, unspecified unwell status, unspecified other illness, and explicit negative HIV/Hepatitis C results. The classification is a description of the record, not an independently confirmed diagnosis."},{"type":"p","text":"One additional record describes suspected tuberculosis and remains in a separate suspected-only row. Another 52 unwell records lack enough detail to assign a physical or mental illness type under these rules. The physical total is not calculated by subtracting mental illness from all unwell records. One explicit physical-condition narrative conflicts with a healthy status code, and one has an unknown health status; both are retained with source evidence rather than overwriting AU. Two of the 60 physical-condition records also have a broader mental-health indication, including one with an explicit Mental illness code."},{"type":"summary","text":"Show citizenship and gender within each recorded condition"},{"type":"table","rows":[["All ages: condition","Citizenship","Male","Female","Gender unknown","Total"],["All case records","Citizen","806","208","0","1,014"],["All case records","Non-citizen","520","4 all ages"},{"type":"p","text":"2023"},{"type":"table","rows":[["All ages: recorded group","Male","Female","Gender unknown","Total"],["All case records","346","338","3","687"],["Citizens","131","70","0","201"],["Non-citizens","213","268","3","484"],["Citizenship unknown","2","0","0","2"],["All coded OKU/disability","2","4","0","6"],["OKU/disability: physical","2","1","0","3"],["OKU/disability: mental","0","1","0","1"],["OKU/disability: other categories","0","2","0","2"],["Mental illness: explicit illness code","2","3","0","5"],["Mental health: broader indication","2","3","0","5"],["Physical illness/health condition: explicit record","9","7","1","17"],["Physical illness: suspected only","0","0","0","0"],["Unwell: illness type unresolved","1","1","0","2"]]},{"type":"p","text":"2024"},{"type":"table","rows":[["All ages: recorded group","Male","Female","Gender unknown","Total"],["All case records","168","182","0","350"],["Citizens","52","31","0","83"],["Non-citizens","116","151","0","267"],["Citizenship unknown","0","0","0","0"],["All coded OKU/disability","12","3","0","15"],["OKU/disability: physical","9","0","0","9"],["OKU/disability: mental","0","0","0","0"],["OKU/disability: other categories","3","3","0","6"],["Mental illness: explicit illness code","0","0","0","0"],["Mental health: broader indication","0","2","0","2"],["Physical illness/health condition: explicit record","3","3","0","6"],["Physical illness: suspected only","1","0","0","1"],["Unwell: illness type unresolved","6","5","0","11"]]},{"type":"p","text":"2025"},{"type":"table","rows":[["All ages: recorded group","Male","Female","Gender unknown","Total"],["All case records","577","106","2","685"],["Citizens","422","57","0","479"],["Non-citizens","154","49","2","205"],["Citizenship unknown","1","0","0","1"],["All coded OKU/disability","23","7","1","31"],["OKU/disability: physical","16","1","0","17"],["OKU/disability: mental","4","3","1","8"],["OKU/disability: other categories","3","3","0","6"],["Mental illnes
