rmasuk 32 bertarikh masa hadapan pada 25 Okt","Tidak boleh dianggap hasil September yang telah selesai"],["Beberapa baris bagi identiti/tarikh dipadankan yang sama","3 baris tambahan, termasuk 2 percanggahan hospital/dilepaskan pada 2026","Tindakan akhir dan bilangan pertemuan berbeza tidak pasti"],["Pertemuan kemudian masih dilabel kali pertama","206 daripada 296 tarikh digabungkan; 208 daripada 298 baris asal","160 kumpulan dipadankan terlibat; bilangan menggunakan unit berbeza"],["Pertemuan kemudian ditandakan baharu","205 daripada 296 catatan pada tarikh kemudian","Kes pentadbiran baharu tidak semestinya individu baharu"],["Kod warganegara bersama penyerahan imigresen","Profil 2025 baris 457","Ketidakselarasan kewarganegaraan/tindakan memerlukan semakan sumber"],["Kod warganegara dengan medan asal bukan warganegara diisi","Profil 2023 baris 69: Indonesia dalam AB","Kesesuaian medan perlu disemak; negara dan kewarganegaraan berbeza"],["Nombor UNHCR dalam medan ya/tidak pemegang","Profil 2024 baris 125","Catatan status tidak sah tidak boleh ditukar secara senyap kepada ya"],["Kod ketidakupayaan normal bersama petunjuk kesihatan mental","32 baris, semuanya pada 2026","Penyakit dan ketidakupayaan mesti dibezakan; ketekalan masih perlu disemak"]]},{"type":"p","text":"Sesetengah nilai teks pendidikan dan pekerjaan menyatakan “Tiada Maklumat” dengan nombor kod yang tergolong dalam kategori lain pada lembaran kod. Oleh itu, maklumat yang tidak tersedia dikenal pasti melalui label dan nilai kosong, bukannya mentafsir nombor sahaja secara membuta tuli. Kod dan teks asal dikekalkan dalam ekstrak."},{"type":"p","text":"CSV audit kualiti yang disediakan mengenal pasti baris sumber individu yang terlibat. Ia bukan pengganti asal yang telah dibersihkan. Nilai yang diragui tidak ditulis ganti dan tiada hasil klinikal, undang-undang atau perumahan yang tidak direkodkan diandaikan."}]},{"title":"20. Kesimpulan praktikal yang disokong oleh fail ini. Ini ialah implikasi operasi berdasarkan rekod, bukannya dakwaan bahawa intervensi tertentu menyebabkan perubahan yang diperhatikan.","blocks":[{"type":"li","text":"Jejaki individu serta kes pentadbiran baharu. Gunakan kunci individu dalaman yang kekal dengan proses semakan jelas bagi nama alternatif, dokumen keluarga yang dikongsi dan ID yang salah. Kekalkan kunci pertemuan secara berasingan. Kes pertama dalam sesuatu kitaran pelaporan tidak sepatutnya memadam sejarah pertemuan terdahulu."},{"type":"li","text":"Bezakan populasi perkhidmatan semasa menilai prestasi. Sekurang-kurangnya, bandingkan warganegara/bukan warganegara, dewasa/kanak-kanak, pengemis/gelandangan/Peleser dan jenis operasi. Ini dapat mengelakkan perubahan komposisi populasi daripada kelihatan sebagai kesan perkhidmatan."},{"type":"li","text":"Rancang perkhidmatan untuk orang dewasa pertengahan umur dan warga emas. Profil umur 2026, 126 rekod warga emas dengan keperluan tempat tinggal sepanjang tempoh, serta laluan institusi yang berulang menunjukkan bahawa umur, perumahan dan sokongan kesihatan perlu dipertimbangkan bersama."},{"type":"li","text":"Pastikan laluan kesihatan dapat dikenal pasti. Bezakan laluan hospital/KKM/klinik yang luas daripada penilaian dan rawatan yang telah selesai. Rekodkan destinasi rujukan, sama ada rujukan diterima, sama ada individu hadir dan langkah berikutnya yang disahkan."},{"type":"li","text":"Rekodkan ketidakupayaan dan penyakit mental secara berasingan. Bezakan keterbatasan yang direkodkan, pendaftaran rasmi, penyakit klinikal, penyakit yang disyaki dan keperluan sokongan yang dinilai. Jangan bergantung pada medan normal/tidak diketahui untuk menafikan kebimbangan dalam naratif."},{"type":"li","text":"Kekalkan lokasi pertemuan yang tepat. Jalan/lokasi khusus dan kawasan luas perlu mempunyai medan berbeza. Label umum Kuala Lumpur menghilangkan maklumat yang diperlukan untuk mengenal pasti kawasan tumpuan sebenar dan merancang khidmat jangkauan berulang."},{"type":"li","text":"Lengkapkan penutupan kes dengan susulan yang boleh diukur. Rujukan, perintah atau pelepasan boleh menutup tindakan pentadbiran sementara isu tempat tinggal dan rawatan masih belum diselesaikan. Jejaki tempat tinggal yang disahkan dan penglibatan dalam perkhidmatan pada masa susulan yang ditetapkan, serta kekalkan kategori tidak diketahui secara jelas."},{"type":"li","text":"Semak ketidakselarasan yang ditandakan sebagai keutamaan tinggi. Mulakan dengan percanggahan hospital/dilepaskan pada hari yang sama, tarikh tamat masa hadapan, percanggahan kewarganegaraan/tindakan, umur tidak sepadan dan identiti yang berulang kali dikodkan kali pertama. Semak dengan fail kes asal dan jangan membetulkannya secara automatik."},{"type":"p","text":"Tafsiran paling kukuh yang dapat dipertahankan ialah fail ini mendokumentasikan operasi dan profil kes yang berubah, kejadian berulang yang ketara tetapi terlindung oleh label pertama/baharu, peningkatan keperluan perkhidmatan yang direkodkan dalam kalangan warga Malaysia berusia lebih tua, serta beban kesihatan mental yang tertumpu pada operasi September 2026. Fail ini tidak dapat menentukan kadar gelandangan seluruh bandar yang boleh dipercayai, kadar kejayaan rawatan atau kadar kejayaan tempat tinggal yang berkekalan."}]},{"title":"21. Pengekstrakan dan kebolehulangan analisis. Fail iringan membolehkan dapatan dijejaki tanpa memasukkan pengenal pasti langsung dalam hasil yang disediakan.","blocks":[{"type":"table","rows":[["Semakan semula yang dijalankan","Hasil"],["Hash sumber asal dibandingkan dengan laporan pertama","Keempat-empatnya sepadan; buku kerja sumber tidak berubah"],["Pengekstrakan XML bebas dibandingkan dengan pengekstrakan asal","2,021 lokasi rekod, tarikh, umur berangka dan medan sumber berkaitan sepadan"],["Jadual sekunder pendua 2025","Kesemua 685 catatan kes sepadan dengan jadual utama; dikecualikan sekali"],["Padanan identiti bebas berasaskan graf","Semakan graf bebas mengesahkan 1,722 kumpulan dan 208 kumpulan berulang mengikut peraturan merentas lajur yang disemak"],["Sel jadual terbitan sumber yang diterbitkan disemak semula","1,223"],["Baris tahunan yang boleh dijumlahkan diselaraskan dengan jumlah keseluruhan","188"],["Percanggahan aritmetik dalam semakan ini","0"]]},{"type":"table","rows":[["Fail yang disediakan","Kandungan"],["case-records-pseudonymized.csv","Kesemua 2,021 rekod jadual utama, buku kerja/lembaran/baris sumber, kod dan teks kategori asal, umur berangka, tarikh, asal/lokasi yang diseragamkan, kumpulan padanan dan penanda analisis."],["repeat-encounter-audit.csv","296 pertemuan dipadankan pada tarikh kemudian, dengan baris sumber terdahulu/semasa, tindakan, tarikh, kekerapan/status pegawai dan sela dalam hari."],["repeat-encounter-raw-rows.csv","Kesemua 298 baris sumber pada tarikh kemudian yang dipadankan, termasuk dua baris tambahan pada hari yang sama."],["first-coded-repeat-review.csv","208 baris berkod kali pertama dengan tarikh terdahulu dipadankan melalui dokumen, merentasi 160 kumpulan."],["repeat-identity-groups.csv","208 kumpulan identiti berulang dengan bilangan tarikh, baris, baris kemudian berkod kali pertama dan penanda ketekalan."],["possible-repeat-name-matches.csv","34 padanan tepat nama/tahun lahir/jantina/kewarganegaraan yang belum disahkan, dikecualikan daripada jumlah utama kes berulang."],["verified-totals.csv","Jumlah tahunan dan terkumpul sumber, demografi, kesihatan dan kejadian berulang yang disemak semula secara bebas."],["data-quality-audit.csv","Baris yang terlibat dan ketidakselarasan khusus yang digunakan dalam laporan ini."],["analysis-tables.csv","Bilangan dalam format memanjang mengikut tahun bagi kategori sumber, kumpulan umur yang dilaporkan dan asal bukan warganegara yang diseragamkan."],["unique-repeat-by-year.csv","Identiti pertama diperhatikan, tarikh kemudian, baris tambahan hari yang sama dan ukuran identiti berbeza tahunan."],["vulnerability-gender-breakdown.csv","Semua umur dan umur 60+, mengikut tahun, keadaan yang direkodkan, kewarganegaraan dan jantina."],["physical-illness-record-review.csv","60 rekod keadaan fizikal yang jelas dan satu kes disyaki sahaja yang berasingan, dengan bukti baris sumber."],["jkm-repeat-comparison-by-year.csv","Kod kes berulang JKM tahunan, pertemuan semula dipadankan, pertindihan, rekod tambahan, jumlah gabungan dan unit pengiraan."],["jkm-repeat-combined-records.csv","Kesemua 537 rekod sumber gabungan dengan bukti kes berulang, mengenal pasti bukti JKM sahaja, padanan sahaja dan kedua-duanya; pengenal pasti langsung tidak didedahkan."]]},{"type":"p","text":"Penggunaan kod samaran membuang nama, nombor dokumen penuh, nombor UNHCR, rujukan fail dan nama pegawai kes. Satu butiran hubungan keluarga yang bernama diganti dengan keterangan neutral, dan dua nombor pendaftaran ketidakupayaan yang terbenam dalam naratif dibuang. Rujukan baris sumber masih membolehkan pengguna mencari kes asal. Gabungan ciri yang jarang berlaku dan akses kepada sumber boleh membolehkan pengecaman semula; oleh itu fail ini bukan set data tanpa identiti untuk kegunaan awam."},{"type":"p","text":"Nama lajur bahasa Inggeris mengenal pasti medan, manakala nilai kategori sumber kekal dalam Bahasa Melayu bersama kod asal. Medan yang diterbitkan melalui analisis dilabelkan berasingan. Laporan tidak mengubah buku kerja sumber, mengira semulanya, menjalankan makro atau menghubungi perkhidmatan luar. Semua sel jadual kes yang berkaitan ialah nilai tersimpan, tanpa formula yang memerlukan pengiraan semula."},{"type":"table","rows":[["Buku kerja sumber","SHA-256 sebelum analisis"],["Dec 2023.xlsx","26240128abb7083c9eda63a94383c2b4cf3e791b3caa96f0d8e0254cc3cc8fa2"],["Dec 2024.xlsx","407ff5837dbf34a15c87838c76aa41e0c7d837e03a56e71ee9e91f0765a3f013"],["Dec 2025.xlsx","2656b67343f22b26cee5a2d96d0673246c2f82c468235b581b0fc7de3a17ed78"],["Sept 2026.xlsx","ca3bebbcb1d3fdedbd9bb504a175d2e2c88b2db5bac61db36ab08ae3c275d59a"]]},{"type":"p","text":"Peratusan dibundarkan kepada satu tempat perpuluhan. Penyebut dinyatakan bersebelahan analisis berkaitan: kebanyakan peratusan menggunakan semua baris rekod; peratusan umur yang dinyatakan sebagai “umur diketahui” mengecualikan umur yang tiada; kerakyatan menggunakan baris bukan warganegara; perbandingan etnik/negeri asal menggunakan baris warganegara. Jumlah jadual mungkin tidak menjadi 100.0% disebabkan pembundaran. Ukuran kejadian berulang ialah hasil padanan penerokaan, bukannya identiti yang disahkan atau penilaian sebab-akibat."}]},{"title":"22. Identiti unik dan pertemuan berulang mengikut tahun. Perkataan unik boleh bermaksud identiti berbeza, seseorang yang hanya ditemui sekali atau pertemuan pertama yang direkodkan. Maksud ini menghasilkan angka berbeza. Penyelarasan berikut membezakannya dan menggunakan peraturan padanan dokumen yang sama seperti audit kes berulang sedia ada.","blocks":[{"type":"table","rows":[["Tempoh","Identiti pertama diperhatikan dalam keseluruhan sejarah","Tarikh pertemuan kemudian yang dipadankan","Baris tambahan pada hari yang sama","Baris rekod"],["2023","636","50","1","687"],["2024","287","63","0","350"],["2025","578","107","0","685"],["2026 Jan–Sep","221","76","2","299"],["Seluruh tempoh","1,722","296","3","2,021"]]},{"type":"p","text":"2,021 baris rekod = 1,722 baris identiti pertama diperhatikan + 296 pertemuan pada tarikh kemudian + 3 baris tambahan pada hari yang sama. Maka, anggaran kerja ialah 1,722 identiti dipadankan yang berbeza. Baki 299 rekod terdiri daripada 296 pertemuan pada tarikh kemudian dan tiga baris tambahan hari yang sama. Tiga baris tambahan itu tidak secara automatik dikelaskan sebagai pertemuan semula berasingan. Ini ialah anggaran berdasarkan padanan dokumen, bukannya bilangan individu berbeza yang telah disahkan; pengenal pasti yang hilang atau salah boleh mengubah bilangan sebenar."},{"type":"p","text":"Identiti pertama diperhatikan bermaksud kemunculan terawal yang ditemui dalam fail yang dibekalkan ini, bukannya semestinya pertemuan pertama sepanjang sejarah dengan JKM. Sesetengah catatan pertama diperhatikan telah pun dikodkan pegawai sebagai berulang kerana sejarahnya mungkin mendahului rekod ini atau tidak tersedia. Oleh itu, jumlah sedia ada 328 kes berulang mengikut kod pegawai dan 537 rekod semakan bukti berulang ialah ukuran berbeza."},{"type":"table","rows":[["Tahun","Identiti berbeza yang muncul dalam tahun tersebut","Pertama diperhatikan dalam tahun tersebut","Telah wujud pada tahun lebih awal"],["2023","636","636","0"],["2024","309","287","22"],["2025","601","578","23"],["2026 Jan–Sep","284","221","63"]]},{"type":"p","text":"Bilangan identiti berbeza tahunan tidak boleh dijumlahkan: satu identiti boleh muncul dalam beberapa tahun. Contohnya, 2026 mengandungi 284 identiti dipadankan yang berbeza, dengan 221 pertama muncul pada 2026 dan 63 telah muncul lebih awal. Bilangan berbeza bagi seluruh tempoh ialah 1,722, bukannya hasil tambah bilangan tahunan."},{"type":"table","rows":[["Tempoh","Identiti ditemui pada satu tarikh","Identiti ditemui pada beberapa tarikh","Identiti berbeza dalam tempoh tersebut"],["2023","598","38","636"],["2024","281","28","309"],["2025","540","61","601"],["2026 Jan–Sep","271","13","284"],["Seluruh tempoh, dikira semula","1,514","208","1,722"]]},{"type":"p","text":"Sepanjang seluruh tempoh, 1,514 kumpulan ditemui pada satu tarikh sahaja dan 208 kumpulan pada beberapa tarikh, menjadikan 1,722 kumpulan. Kumpulan satu tarikh mengandungi 1,515 baris sumber kerana satu kumpulan mempunyai dua catatan pada tarikh yang sama. Kumpulan berulang mengandungi 506 baris, termasuk pemerhatian pertama dan dua catatan tambahan hari yang sama. Maka 1,515 baris dalam kumpulan satu tarikh + 506 baris dalam kumpulan berulang = 2,021; kesemua 506 baris tidak wajar dipanggil pertemuan semula. Jika unik bermaksud tepat satu baris sumber, bilangannya ialah 1,513 kumpulan, bukannya 1,514 kumpulan satu tarikh."},{"type":"p","text":"Sumber: Dec 2023.xlsx · Profil · baris 7–693; Dec 2024.xlsx · Profil · baris 7–356; Dec 2025.xlsx · Profil · baris 7–691; Sept 2026.xlsx · Profil · baris 7–305. Medan: P/Q/R/AE bukti padanan; J tarikh operasi. Pengenal pasti kekal tidak didedahkan dalam fail yang disediakan; peraturan dan batasan padanan tidak berubah daripada bahagian 10."}]},{"title":"23. Kewarganegaraan, OKU, penyakit mental dan penyakit fizikal mengikut jantina. Jadual ini menggunakan semua 2,021 rekod kes. Kemunculan berulang dikekalkan supaya jumlah jantina dan kewarganegaraan sepadan dengan baris sumber. Ini bukan bilangan demografi bagi 1,722 individu yang telah dinyahpendua.","blocks":[{"type":"table","rows":[["Semua umur: kumpulan direkodkan","Lelaki","Perempuan","Jantina tidak diketahui","Jumlah"],["Semua rekod kes","1,329","687","5","2,021"],["Warganegara","806","208","0","1,014"],["Bukan warganegara","520","479","5","1,004"],["Kewarganegaraan tidak diketahui","3","0","0","3"],["Semua OKU/ketidakupayaan berkod","49","18","1","68"],["OKU/ketidakupayaan: fizikal","34","3","0","37"],["OKU/ketidakupayaan: mental","4","6","1","11"],["OKU/ketidakupayaan: kategori lain","11","9","0","20"],["Penyakit mental: kod penyakit jelas","35","14","0","49"],["Kesihatan mental: petunjuk lebih luas","37","18","1","56"],["Penyakit/keadaan kesihatan fizikal: rekod jelas","45","14","1","60"],["Penyakit fizikal: disyaki sahaja","1","0","0","1"],["Tidak sihat: jenis penyakit belum dapat ditentukan","38","14","0","52"]]},{"type":"p","text":"Warganegara + bukan warganegara + kewarganegaraan tidak diketahui membentuk pecahan lengkap semua rekod. Baris kesihatan dan ketidakupayaan bertindih. Ketidakupayaan fizikal, mental dan lain-lain ialah komponen 68 rekod ketidakupayaan berkod; subjumlah ketidakupayaan tidak boleh dijumlahkan sekali lagi dengan komponennya."},{"type":"p","text":"Takrif yang dikekalkan: OKU/ketidakupayaan bermaksud kod kategori substantif dalam AX, tanpa menganggap pendaftaran rasmi. Penyakit mental bermaksud 49 rekod yang dikodkan secara jelas sebagai Mental dalam AV. Bilangan petunjuk kesihatan mental yang lebih luas kekal 56 dan merangkumi medan serta naratif lain yang berkaitan; ia tidak mewujudkan tujuh diagnosis tambahan yang disahkan. Ketidakupayaan mental ialah ukuran berasingan dan boleh bertindih dengan ukuran penyakit."},{"type":"p","text":"Takrif baharu penyakit fizikal: 60 rekod mengandungi keterangan jelas penyakit fizikal, kecederaan atau gejala dalam medan kod/butiran penyakit, atau keterangan diabetes yang khusus dalam naratif keperluan. Ini termasuk keadaan yang direkodkan seperti diabetes, hipertensi, HIV/hepatitis, asma, strok, patah tulang dan gejala fizikal. Ia mengecualikan ketidakupayaan sahaja, usia tua sahaja, penggunaan bahan sahaja, status tidak sihat tanpa butiran, penyakit lain yang tidak dinyatakan dan keputusan negatif HIV/Hepatitis C yang jelas. Pengelasan ini menghuraikan rekod, bukannya diagnosis yang disahkan secara bebas."},{"type":"p","text":"Satu rekod tambahan menyatakan tuberkulosis yang disyaki dan kekal dalam baris berasingan bagi kes disyaki sahaja. Sebanyak 52 lagi rekod tidak sihat tidak mempunyai butiran mencukupi untuk menentukan jenis penyakit fizikal atau mental mengikut peraturan ini. Jumlah fizikal tidak dikira dengan menolak penyakit mental daripada semua rekod tidak sihat. Satu naratif keadaan fizikal yang jelas bercanggah dengan kod status sihat, dan satu mempunyai status kesihatan tidak diketahui; kedua-duanya dikekalkan dengan bukti sumber tanpa menulis ganti AU. Dua daripada 60 rekod keadaan fizikal turut mempunyai petunjuk kesihatan mental yang lebih luas, termasuk satu dengan kod penyakit Mental yang jelas."},{"type":"summary","text":"Paparkan kewarganegaraan dan jantina bagi setiap keadaan yang direkodkan"},{"type":"table","rows":[["Semua umur: keadaan","Kewarganegaraan","Lelaki","Perempuan","Jantina tidak diketahui","Jumlah"],["Semua rekod kes","Warganegara","806","208","0","1,014"],["Semua rekod kes","Bukan warganegara","520","479","5","1,004"],["Semua rekod kes","Kewarganegaraa alam kalangan rekod warga emas, 21 mempunyai ketidakupayaan berkod: 12 fizikal, dua mental dan tujuh dalam kategori ketidakupayaan lain. Terdapat 15 baris penyakit dengan kod Mental yang jelas, 16 baris petunjuk kesihatan mental yang lebih luas dan 22 baris keadaan fizikal yang jelas. Penyakit fizikal yang disyaki direkodkan berasingan pada satu baris tambahan. Baris kesihatan/ketidakupayaan ini bertindih dan tidak boleh dijumlahkan untuk mendapatkan jumlah individu rentan."},{"type":"table","rows":[["Rekod warga emas mengikut tahun","Lelaki","Perempuan","Jantina tidak diketahui","Jumlah"],["2023","79","57","0","136"],["2024","46","31","0","77"],["2025","153","19","0","172"],["2026 Jan–Sep","97","20","0","117"],["Seluruh tempoh","375","127","0","502"]]},{"type":"summary","text":"Paparkan kewarganegaraan dan jantina warga emas bagi setiap keadaan yang direkodkan"},{"type":"table","rows":[["Umur 60+: keadaan","Kewarganegaraan","Lelaki","Perempuan","Jantina tidak diketahui","Jumlah"],["Semua rekod kes","Warganegara","294","75","0","369"],["Semua rekod kes","Bukan warganegara","80","52","0","132"],["Semua rekod kes","Kewarganegaraan tidak diketahui","1","0","0","1"],["Semua OKU/ketidakupayaan berkod","Warganegara","11","6","0","17"],["Semua OKU/ketidakupayaan berkod","Bukan warganegara","4","0","0","4"],["Semua OKU/ketidakupayaan berkod","Kewarganegaraan tidak diketahui","0","0","0","0"],["OKU/ketidakupayaan: fizikal","Warganegara","8","1","0","9"],["OKU/ketidakupayaan: fizikal","Bukan warganegara","3","0","0","3"],["OKU/ketidakupayaan: fizikal","Kewarganegaraan tidak diketahui","0","0","0","0"],["OKU/ketidakupayaan: mental","Warganegara","1","1","0","2"],["OKU/ketidakupayaan: mental","Bukan warganegara","0","0","0","0"],["OKU/ketidakupayaan: mental","Kewarganegaraan tidak diketahui","0","0","0","0"],["OKU/ketidakupayaan: kategori lain","Warganegara","2","4","0","6"],["OKU/ketidakupayaan: kategori lain","Bukan warganegara","1","0","0","1"],["OKU/ketidakupayaan: kategori     const ui = {year:'all',scope:'all',condition:0,place:'parliament',origin:'citizen',charts:{}};

    function interactiveBars(id,title,items,denominator,caption='',options={}) {
      const control=ui.charts[id]||{mode:'count',sort:'desc',limit:8};
      const sorted=[...items]; if(control.sort==='desc')sorted.sort((a,b)=>b.value-a.value);
      const shown=control.limit==='all'?sorted:sorted.slice(0,control.limit);
      const isPercent=control.mode==='share';
      const high=isPercent?100:Math.max(1,...items.map(d=>d.value));
      const axisMax=isPercent?100:Math.ceil(high/(high>100?100:high>20?10:5))*(high>100?100:high>20?10:5);
      const denomFor = d => d.denominator??denominator;
      const displayed = d => isPercent?percent(d.value,denomFor(d)):num(d.value);
      const tool = d => `${d.label}: ${num(d.value)} ${d.unit||options.unit||L('rekod','records')} · ${percent(d.value,denomFor(d))} ${L('daripada','of')} ${num(denomFor(d))}`;
      const outputRows=[[L('Kategori','Category'),L('Bilangan','Count'),L('Penyebut','Denominator'),L('Bahagian daripada penyebut','Share of denominator')],...shown.map(d=>[d.label,num(d.value),num(denomFor(d)),percent(d.value,denomFor(d))])];
      return `<section class="panel r-chart" data-chart="${id}" data-denominator="${denominator}"><div class="panel-head"><div><h3>${title}</h3><p>${caption}</p></div><button class="r-small" data-csv="${id}" type="button" title="${L('Muat turun data carta','Download chart data')}">↓ CSV</button></div>
        <div class="r-chart-toolbar"><div class="r-segment" role="group" aria-label="${L('Unit carta','Chart unit')}"><button type="button" data-chart-mode="count" data-id="${id}" aria-pressed="${!isPercent}">${L('Bilangan','Count')}</button><button type="button" data-chart-mode="share" data-id="${id}" aria-pressed="${isPercent}">%</button></div><label class="r-inline">${L('Susunan','Order')}<select data-chart-sort="${id}"><option value="source" ${control.sort==='source'?'selected':''}>${L('Sumber','Source')}</option><option value="desc" ${control.sort==='desc'?'selected':''}>${L('Tertinggi','Highest')}</option></select></label>${items.length>8?`<button class="r-small" data-chart-limit="${id}" type="button">${control.limit==='all'?L('8 teratas','Top 8'):L('Semua kategori','All categories')}</button>`:''}</div>
        <p class="r-unit">${options.denominatorText||`${L('Penyebut','Denominator')}: ${num(denominator)} ${options.unit||L('rekod','records')}`} · ${options.period||yearLabel()}</p>
        <div class="r-bars" role="group" aria-label="${esc(title)}">${shown.map((d,i)=>{const den=denomFor(d),v=isPercent?(den?d.value/den*100:0):d.value;return `<button type="button" class="r-bar-row" data-readout="${esc(tool(d))}" aria-label="${esc(tool(d))}"><span class="r-bar-label">${esc(d.label)}</span><span class="r-bar-rail" aria-hidden="true"><span class="r-bar-line" style="width:${v/axisMax*100}%;background:${options.color||'#0b7d71'}"><i></i></span></span><span class="r-bar-number">${displayed(d)}</span></button>`;}).join('')}</div>
        <div class="r-axis" aria-hidden="true">${[0,.25,.5,.75,1].map(v=>`<span>${isPercent?Math.round(v*axisMax)+'%':num(Math.round(v*axisMax))}</span>`).join('')}</div>
        <p class="r-readout" aria-live="polite">${L('Ketik atau fokus pada bar untuk butiran tepat.','Select or focus a bar for exact details.')}</p>

        <div class="metric-grid">
          ${metric('101 → 42',state.lang==='ms'?'tarikh operasi':'operation dates',state.lang==='ms'?'2023 kepada 2025':'2023 to 2025','accent-teal')}
          ${metric('~7 → 16',state.lang==='ms'?'individu setiap operasi':'people per operation',state.lang==='ms'?'purata, 2023 kepada 2025':'average, 2023 to 2025','accent-amber')}
          ${metric('41 → 50',state.lang==='ms'?'umur median':'median age',state.lang==='ms'?'41 → 44 → 50, 2023–2025':'41 → 44 → 50, 2023–2025','accent-coral')}
          ${metric('20% → 26%',state.lang==='ms'?'berumur 60 tahun ke atas':'aged 60 or above',state.lang==='ms'?'2023 kepada 2025':'2023 to 2025','accent-purple')}
        </div>
        <div class="grid-2">
          ${panel(state.lang==='ms'?'Trend utama yang ditambah':'Additional key trends',findings(s().trendFindings),state.lang==='ms'?'Dapatan yang belum dipaparkan dalam siri utama.':'Findings not previously shown in the main series.')}
          ${panel(state.lang==='ms'?'Jadual pelengkap · Profil umur 2025':'Supplementary table · Age profile, 2025',table([state.lang==='ms'?'Kumpulan pada 2025':'Group in 2025',state.lang==='ms'?'Umur median':'Median age',state.lang==='ms'?'Berumur 50+':'Aged 50+',state.lang==='ms'?'Berumur 60+':'Aged 60+'],ageRows.map(row=>`<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td></tr>`),state.lang==='ms'?'Tempoh 2025 sahaja; angka dikekalkan seperti dilaporkan.':'2025 only; figures retained as reported.'))}
        </div>
        <div class="grid-2">
          ${panel(state.lang==='ms'?'Mengapa trend perlu ditafsir dengan berhati-hati':'Why the trends need cautious interpretation',findings(s().trendInterpretation),state.lang==='ms'?'Perubahan operasi boleh mengubah data yang direkodkan.':'Changes in operations can change the data recorded.')}
          ${panel(state.lang==='ms'?'Apa yang data tidak dapat tunjukkan':'What the data cannot show',findings(s().dataLimits),state.lang==='ms'?'Batasan ini adalah sebahagian daripada dapatan, bukan data yang hilang.':'These limitations are findings, not simply missing data.')}
        </div>
        <div class="grid-2">
          ${panel(lensTitle,`<ul class="timeline">${s().politicalLenses.map(row=>`<li><b>${row[0]}</b><p>${row[1]}</p></li>`).join('')}</ul>`,state.lang==='ms'?'Lensa yang digunakan dalam laporan pelengkap.':'Lenses used in the supplementary report.')}
          ${panel(policyTitle,findings(s().policyContext),state.lang==='ms'?'Huraian ini khusus kepada data 2023–2025.':'This discussion is specific to the 2023–2025 data.')}
        </div>
        <div class="panel" style="margin-top:16px"><h3>${actionTitle}</h3><div class="recommendations">${s().additionalActions.map(row=>`<article class="recommendation"><b>${row[0]}</b><p>${row[1]}</p></article>`).join('')}</div><p class="table-caption">${s().trendSource}</p></div>
      </section>`;
    }

    function renderPractice() {
      const discrepancyRows=discrepancies.map(row=>`<tr><td>${state.lang==='ms'?row[0]:row[1]}</td><td>${num(row[2])}</td><td>${num(row[3])}</td><td>${num(row[4])}</td><td>${num(row[5])}</td><td>${num(row[6])}</td><td>${num(row[7])}</td></tr>`);
      return `<section class="view ${state.view==='practice'?'active':''}" id="view-practice">
        ${sectionHead(t().practice,t().practiceLead,t().period)}
        <div class="grid-2">
          ${panel(state.lang==='ms'?'Apa yang sistem ini lakukan':'What the systems do',`<ul class="timeline">${s().cities.map(row=>`<li><b>${row[0]}</b><p>${row[1]}</p></li>`).join('')}</ul><blockquote class="quote">${s().practiceLesson}</blockquote>`,'','London · Singapore · Houston')}
          ${panel(state.lang==='ms'?'Lima amalan untuk KL':'Five practices for Kuala Lumpur',`<div class="pill-grid">${s().practices.map((item,i)=>`<div class="pill"><b>0${i+1}</b><span>${item}</span></div>`).join('')}</div><h3 style="margin-top:22px">${state.lang==='ms'?'Kesimpulan':'Conclusion'}</h3>${findings(s().conclusion,39)}`,'','38–42')}
        </div>
        <div class="panel" style="margin-top:16px"><h3>${state.lang==='ms'?'Syor berasaskan amalan':'Practice-based recommendations'}</h3><div class="recommendations">${s().recommendations.map(row=>`<article class="recommendation"><b>${row[0]}</b><p>${row[1]}</p></article>`).join('')}</div><p class="table-caption">${s().practiceSource}</p></div>
        <div class="grid-2 practice-data-grid">
          ${panel(state.lang==='ms'?'Untuk perhatian':'For attention',findings(s().attention,47),'','47–50')}
          <section class="panel">${revisedPracticeTable()}</section>
        </div>
      </section>`;
    }

    function render() {
      const c=t();
      document.documentElement.lang=state.lang;
      $('#eyebrow').textContent=c.eyebrow; $('#page-title').textContent=c.title; $('#page-subtitle').textContent=c.subtitle; $('#source-line').textContent=c.source; $('#download-btn').textContent=c.download;
      $('#nav').innerHTML=c.nav.map(([id,labelText])=>`<button class="nav-tab ${state.view===id?'active':''}" data-view="${id}" type="button">${labelText}</button>`).join('');
      $('#dashboard-content').innerHTML=[renderOverview(),renderTrends(),renderAnnual(),renderProfile(),renderPlace(),renderAction(),renderReferral(),renderPractice(),`<footer class="footer"><p><b>${c.sources}</b></p><p>${L('Analisis: Report.html dan Laporan.html; dirujuk silang dengan Homeless Op.docx dan Homeless Op (ENG)(2).docx. Padanan identiti disemak 20 Oktober; gabungan rekod berulang dikemas kini 21 Oktober 2026.','Analysis: Report.html and Laporan.html; cross-referenced with Homeless Op.docx and Homeless Op (ENG)(2).docx. Identity linkage revised 20 October; combined repeat records updated 21 October 2026.')}</p><p>${L('Angka merujuk kepada rekod atau kumpulan identiti calon seperti dilabel. Data 2026 meliputi Januari–September, dengan rekod terakhir pada 24 September. Bahagian Trend dan Amalan dikekalkan daripada dashboard asal, kecuali Jadual 8.','Figures refer to records or candidate identity groups as labelled. 2026 covers January–September, with the latest record on 24 September. Trends and Practice retain the original dashboard content, except Table 8.')}</p></footer>`].join('');
      labelTableCells();
      enhanceUpdated();
      $$('.nav-tab').forEach(button=>button.addEventListener('click',()=>{state.view=button.dataset.view; render(); window.scrollTo({top:0,behavior:'smooth'});}));
      const yearly=$('#year-select'); if(yearly) yearly.addEventListener('change',event=>{state.year=event.target.value; render();});
      const actionYear=$('#action-year-select'); if(actionYear) actionYear.addEventListener('change',event=>{state.year=event.target.value; render();});
      $('.view.active')?.setAttribute('aria-live','polite');
    }
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
    function labelTableCells() {
      const isNumeric = value => /^(?:[+\-−]?\d[\d\s,.%*+()/:–—−-]*|[–—-])$/.test(value);
      $$('.table-wrap table').forEach(tableElement=>{
        const headingCells=[...tableElement.querySelectorAll('thead th')];
        const headers=headingCells.map(cell=>cell.textContent.replace(/\s+/g,' ').trim());
        const rows=[...tableElement.querySelectorAll('tbody tr')];
        const alignment=headers.map((_,index)=>{
          if(index===0) return 'text';
          const values=rows.map(row=>row.children[index]?.textContent.replace(/\s+/g,' ').trim()||'').filter(Boolean);
          return values.length && values.filter(isNumeric).length>=values.length/2 ? 'number' : 'text';
        });
        headingCells.forEach((cell,index)=>cell.dataset.align=alignment[index]);
        rows.forEach(row=>{
          [...row.children].forEach((cell,index)=>{
            cell.dataset.label=headers[index]||'';
            cell.dataset.align=alignment[index]||'text';
          });
        });
        if(tableElement.closest('#view-trends') && headers.length===4) tableElement.dataset.layout='age-profile';
      });
    }

    $$('.language').forEach(button=>button.addEventListener('click',()=>{state.lang=button.dataset.lang; $$('.language').forEach(b=>b.setAttribute('aria-pressed',String(b===button))); render();}));
    $('#download-btn').addEventListener('click',async()=>{
      const button=$('#download-btn'); const original=button.textContent; button.disabled=true; button.textContent=t().exporting;
      try {
        if(typeof window.html2canvas!=='function') throw new Error('html2canvas unavailable');
        document.body.classList.add('exporting');
        const canvas=await window.html2canvas($('#export-area'),{backgroundColor:'#f5f7f4',scale:2,useCORS:true,logging:false,windowWidth:document.documentElement.scrollWidth});
        const anchor=document.createElement('a'); anchor.download=`dashboard-gelandangan-kl-2023-sep-2026-${state.lang}.png`; anchor.href=canvas.toDataURL('image/png'); anchor.click();
      } catch(error) { window.alert(t().downloadFail); }
      finally { document.body.classList.remove('exporting'); button.disabled=false; button.textContent=original; }
    });

    copy.ms.subtitle='Analisis rekod operasi Januari 2023 hingga September 2026. Bezakan rekod, kumpulan identiti calon dan pertemuan semula.';
    copy.en.subtitle='Analysis of operation records from January 2023 to September 2026. Records, candidate identity groups and later encounters are counted separately.';
    copy.ms.source='Sumber: dua laporan analisis dan dua pecahan Word · Semakan sehingga 21 Oktober 2026';
    copy.en.source='Sources: two analysis reports and two Word breakdowns · Revisions through 21 October 2026';
    render();
  })();
  </script>
</body>
</html>
