<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dashboard dwibahasa analisis rekod operasi gelandangan Kuala Lumpur, Januari 2023 hingga September 2026.">
  <title>Analisis Operasi Gelandangan | KL 2023–2026</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --ink:#172729; --muted:#66777a; --paper:#f5f7f4; --card:#ffffff; --line:#d8e1dd;
      --forest:#0b5f55; --forest-dark:#053d38; --aqua:#18a394; --lime:#b4d653; --amber:#f4b844;
      --coral:#e87559; --blue:#5384c8; --purple:#8c6dc9; --red:#b84442; --shadow:0 10px 32px rgba(22,48,45,.09);
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.55 Inter, Aptos, Segoe UI, Arial, sans-serif; }
    button, select { font:inherit; }
    button { cursor:pointer; }
    .topbar { background:linear-gradient(120deg,var(--forest-dark),var(--forest)); color:#fff; padding:24px clamp(18px,4vw,60px) 20px; }
    .topbar-inner, .page { width:min(1440px,100%); margin:auto; }
    .eyebrow { display:flex; align-items:center; gap:8px; margin:0 0 7px; color:#cae8d4; font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    .eyebrow::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--lime); box-shadow:0 0 0 5px rgba(180,214,83,.14); }
    h1 { max-width:900px; margin:0; font-size:clamp(25px,4vw,45px); line-height:1.06; letter-spacing:-.04em; }
    .subtitle { max-width:850px; margin:11px 0 0; color:#d6e9e6; font-size:16px; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-top:22px; }
    .source-line { color:#b9d5d0; font-size:12px; }
    .control-group { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .button, .language, .year-filter { min-height:38px; border:1px solid transparent; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:750; transition:.18s ease; }
    .button { background:#fff; color:var(--forest-dark); }
    .button:hover { background:#dcf1e5; transform:translateY(-1px); }
    .language { background:transparent; color:#e4f1ef; border-color:rgba(255,255,255,.35); }
    .language[aria-pressed="true"] { background:var(--lime); border-color:var(--lime); color:#19322c; }
    .main-nav { position:sticky; top:0; z-index:5; background:rgba(245,247,244,.94); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); box-shadow:0 5px 14px rgba(22,48,45,.05); }
    .nav-scroll { width:min(1440px,100%); margin:auto; display:flex; flex-wrap:wrap; justify-content:center; overflow:visible; padding:8px clamp(12px,2vw,28px); gap:5px 6px; }
    .nav-tab { white-space:nowrap; border:0; background:transparent; color:#496062; padding:8px 10px; border-radius:8px; font-size:12.5px; font-weight:750; }
    .nav-tab:hover, .nav-tab.active { background:#dcefe8; color:var(--forest-dark); }
    .page { padding:24px clamp(18px,4vw,60px) 64px; }
    .view { display:none; animation:fade .24s ease; }
    .view.active { display:block; }
    @keyframes fade { from{opacity:.2; transform:translateY(5px)} to{opacity:1; transform:none} }
    .section-intro { display:flex; justify-content:space-between; gap:22px; align-items:flex-end; margin:10px 0 18px; }
    h2 { margin:0; font-size:clamp(24px,3vw,34px); line-height:1.13; letter-spacing:-.03em; }
    h3 { margin:0 0 10px; font-size:17px; line-height:1.25; }
    .lead { max-width:780px; margin:7px 0 0; color:var(--muted); }
    .mini-note { margin:0; max-width:340px; color:#496062; font-size:12px; text-align:right; }
    .metric-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
    .metric { min-height:139px; padding:18px; border:1px solid var(--line); border-radius:14px; background:var(--card); box-shadow:var(--shadow); position:relative; overflow:hidden; }
    .metric::after { content:""; position:absolute; right:-22px; bottom:-28px; width:98px; height:98px; border-radius:50%; background:var(--tint,#e1f0ea); }
    .metric .label { position:relative; z-index:1; color:var(--muted); font-size:12px; font-weight:750; }
    .metric .value { position:relative; z-index:1; margin-top:5px; font-size:clamp(26px,3.4vw,39px); font-weight:850; line-height:1; letter-spacing:-.05em; }
    .metric .detail { position:relative; z-index:1; max-width:88%; margin:8px 0 0; color:#4b6061; font-size:12px; line-height:1.35; }
    .accent-teal { --tint:#d8f1ec; } .accent-amber { --tint:#ffefc8; } .accent-coral { --tint:#fae2dc; } .accent-purple { --tint:#ece6f8; }
    .grid-2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:16px; }
    .grid-3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-top:16px; }
    .panel { min-width:0; background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:18px; }
    .panel-head { display:flex; align-items:start; justify-content:space-between; gap:16px; margin-bottom:13px; }
    .panel-head p { margin:2px 0 0; color:var(--muted); font-size:12px; }
    .badge { flex:0 0 auto; padding:4px 8px; border-radius:999px; background:#e5f2ef; color:var(--forest-dark); font-size:11px; font-weight:800; }
    .alert { margin-top:16px; border-left:5px solid var(--amber); background:#fff6dc; padding:14px 16px; border-radius:10px; color:#57451c; }
    .alert strong { display:block; margin-bottom:3px; }
    .alert ul { margin:7px 0 0 18px; padding:0; }
    .findings { display:grid; gap:9px; margin:0; padding:0; list-style:none; counter-reset:item; }
    .findings li { counter-increment:item; display:grid; grid-template-columns:29px 1fr; gap:10px; align-items:start; padding:10px 0; border-bottom:1px solid #e7ece9; }
    .findings li:last-child { border-bottom:0; }
    .findings li::before { content:counter(item, decimal-leading-zero); display:grid; place-items:center; width:27px; height:27px; background:#e1f0ea; color:var(--forest-dark); border-radius:7px; font-size:10px; font-weight:900; }
    .findings p { margin:0; }
    .bar-chart { display:grid; gap:11px; }
    .bar-row { display:grid; grid-template-columns:minmax(78px,1.1fr) minmax(110px,3.2fr) auto; align-items:center; gap:9px; font-size:12px; }
    .bar-label { color:#3f5455; font-weight:700; overflow-wrap:anywhere; }
    .bar-track { height:13px; overflow:hidden; border-radius:99px; background:#ecf0ee; transition:transform .16s ease, box-shadow .16s ease, background .16s ease; }
    .bar-fill { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--forest),var(--aqua)); transition:filter .16s ease; }
    .bar-value { color:#304344; font-variant-numeric:tabular-nums; font-weight:800; }
    .bar-row:hover .bar-track, .bar-row:focus-within .bar-track { transform:scaleY(1.24); background:#e2ece8; box-shadow:0 0 0 2px #d0e4dd; }
    .bar-row:hover .bar-fill, .bar-row:focus-within .bar-fill { filter:brightness(1.08) saturate(1.13); }
    .bar-row:hover .bar-label, .bar-row:hover .bar-value, .bar-row:focus-within .bar-label, .bar-row:focus-within .bar-value { color:var(--forest-dark); }
    .legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; color:var(--muted); font-size:12px; }
    .legend span { display:flex; align-items:center; gap:5px; }
    .swatch { width:10px; height:10px; border-radius:3px; background:var(--forest); } .swatch.alt { background:var(--amber); } .swatch.red { background:var(--coral); }
    .chart-svg { width:100%; min-height:240px; display:block; overflow:visible; }
    .chart-svg text { font-family:Inter, Aptos, Segoe UI, Arial, sans-serif; fill:#516365; font-size:11px; }
    .chart-series { cursor:default; }
    .chart-series .chart-mark { transform-box:fill-box; transform-origin:center bottom; transition:transform .16s ease, filter .16s ease; }
    .chart-series .chart-value { transform-box:fill-box; transform-origin:center; transition:transform .16s ease, filter .16s ease; }
    .chart-series:hover .chart-mark, .chart-series:focus .chart-mark { transform:scaleY(1.05); filter:brightness(1.08) saturate(1.13); }
    .chart-series:hover .chart-value, .chart-series:focus .chart-value { transform:translateY(-6px); filter:brightness(.72); }
    .table-wrap { overflow:hidden; border:1px solid var(--line); border-radius:10px; }
    table { width:100%; border-collapse:collapse; table-layout:fixed; background:#fff; font-size:12px; }
    th, td { padding:10px 11px; text-align:right; vertical-align:top; overflow-wrap:anywhere; border-bottom:1px solid #e5ebe8; }
    th:first-child, td:first-child { width:32%; text-align:left; }
    thead th { position:sticky; top:0; z-index:1; background:#e8f1ed; color:#1d4843; font-size:11px; font-weight:850; }
    .table-wrap.comparison-table table { font-size:11px; }
    .table-wrap.comparison-table th, .table-wrap.comparison-table td { padding:9px 6px; }
    .table-wrap.comparison-table th:first-child, .table-wrap.comparison-table td:first-child { width:28%; }
    .table-wrap.comparison-table thead th { font-size:10px; line-height:1.35; overflow-wrap:normal; word-break:normal; hyphens:none; }
    tbody tr:nth-child(even) { background:#fafcfb; }
    tbody tr:hover { background:#f1f8f5; }
    tbody tr:last-child td { border-bottom:0; }
    .table-caption { margin:10px 0 0; color:var(--muted); font-size:11px; }
    .stack { display:grid; gap:16px; }
    .table-filter { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
    .year-filter { color:#315352; background:#fff; border-color:#cbd9d5; outline:0; }
    .year-filter:focus { border-color:var(--forest); box-shadow:0 0 0 3px #d6eee8; }
    .identity-compare { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; text-align:center; min-height:192px; }
    .identity-compare .big { font-size:48px; font-weight:900; line-height:1; letter-spacing:-.06em; color:var(--forest-dark); }
    .identity-compare .small { margin-top:6px; color:var(--muted); font-size:12px; }
    .versus { display:grid; place-items:center; width:38px; height:38px; border-radius:50%; background:#fbe8d3; color:#865815; font-size:11px; font-weight:900; }
    .quote { margin:0; padding:17px 18px; border-radius:10px; background:#ecf5f2; color:#19463f; font-size:16px; font-weight:700; line-height:1.42; }
    .quote cite { display:block; margin-top:8px; color:#597876; font-size:11px; font-style:normal; font-weight:600; }
    .pill-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .pill { padding:13px; border:1px solid #d6e4de; border-radius:10px; background:#fbfdfc; }
    .pill b { display:block; color:var(--forest-dark); font-size:23px; line-height:1.05; letter-spacing:-.04em; }
    .pill span { display:block; margin-top:5px; color:var(--muted); font-size:11px; line-height:1.3; }
    .timeline { display:grid; gap:0; margin:0; padding:0; list-style:none; }
    .timeline li { position:relative; padding:0 0 18px 28px; }
    .timeline li::before { content:""; position:absolute; left:5px; top:5px; width:11px; height:11px; border-radius:50%; background:var(--aqua); box-shadow:0 0 0 4px #d9f2ed; }
    .timeline li:not(:last-child)::after { content:""; position:absolute; left:10px; top:18px; bottom:0; width:1px; background:#b8d9cf; }
    .timeline b { display:block; color:#284a48; }
    .timeline p { margin:4px 0 0; color:#506466; }
    .recommendations { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; counter-reset:rec; }
    .recommendation { counter-increment:rec; padding:15px 15px 14px 54px; border-radius:12px; background:#f4f8f6; border:1px solid #dce9e4; position:relative; }
    .recommendation::before { content:counter(rec); position:absolute; left:14px; top:15px; display:grid; place-items:center; width:26px; height:26px; border-radius:8px; background:var(--forest); color:#fff; font-weight:900; }
    .recommendation b { display:block; color:var(--forest-dark); }
    .recommendation p { margin:4px 0 0; color:#526567; font-size:12px; }
    .footer { margin-top:28px; padding-top:17px; border-top:1px solid var(--line); color:#66777a; font-size:11px; }
    .footer p { margin:5px 0; }
    .hide-when-exporting { }
    body.exporting .hide-when-exporting { display:none!important; }
    @media (max-width:1180px) and (min-width:951px) { .practice-data-grid { grid-template-columns:1fr; } }
    @media (max-width:950px) { .metric-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .grid-2,.grid-3 { grid-template-columns:1fr; } .mini-note { text-align:left; } .section-intro { align-items:start; flex-direction:column; } }
    @media (max-width:700px) {
      .table-wrap { overflow:visible; border:0; }
      .table-wrap table { display:block; background:transparent; }
      .table-wrap thead { display:none; }
      .table-wrap tbody { display:grid; gap:10px; }
      .table-wrap tbody tr { display:block; overflow:hidden; border:1px solid var(--line); border-radius:10px; background:#fff; }
      .table-wrap td { display:grid; grid-template-columns:minmax(108px,42%) minmax(0,1fr); gap:10px; width:100%!important; padding:9px 11px; text-align:right!important; }
      .table-wrap td::before { content:attr(data-label); color:#476160; font-size:11px; font-weight:800; text-align:left; }
      .table-wrap td:first-child { color:var(--forest-dark); font-weight:800; }
      .table-wrap tbody tr:last-child td:last-child { border-bottom:0; }
    }
    @media (max-width:560px) { .topbar { padding-top:20px; } .metric-grid { grid-template-columns:1fr; } .identity-compare { grid-template-columns:1fr; } .versus { margin:auto; } .pill-grid,.recommendations { grid-template-columns:1fr; } .bar-row { grid-template-columns:82px 1fr auto; } }
    @media print { .topbar { padding:18px; } .main-nav,.toolbar .button,.toolbar .language,.hide-when-exporting { display:none!important; } .view { display:block!important; page-break-after:always; } .page { padding:18px; } .panel,.metric { box-shadow:none; break-inside:avoid; } }
    /* Updated-view styling; shared table alignment is defined at the end. */
    .updated-view { --chart-border:#dbe6df; }
    .updated-view .section-intro { margin-bottom:20px; }
    .updated-view .lead { max-width:740px; }
    .updated-view .panel { box-shadow:0 4px 16px #16302d06; padding:23px; }
    .updated-view .metric { min-height:151px; box-shadow:none; }
    .updated-view .metric .detail { max-width:100%; padding-right:10px; }
    .updated-view .metric .label { max-width:95%; line-height:1.35; }
    .r-panel,.r-full { margin-top:22px; }
    .r-callout { margin-top:20px; padding:17px 20px; border:1px solid #cce3da; border-left:4px solid #0b7d71; border-radius:11px; background:#edf7f1; font-size:13px; }
    .r-callout strong { color:#174b42; font-size:14px; }
    .r-callout p { margin:5px 0 0; max-width:115ch; color:#3c5c53; }
    .r-amber { background:#fff8e8; border-color:#ead9ae; border-left-color:#cb9735; }
    .r-amber strong,.r-amber p { color:#665027; }
    .r-facts { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-top:20px; }
    .r-facts article { padding:21px; border:1px solid #dbe6df; border-radius:13px; background:#fff; }
    .r-facts b { font-size:31px; line-height:1.15; color:#075c50; font-variant-numeric:tabular-nums; letter-spacing:-.03em; }
    .r-facts h3 { font-size:14px; margin:8px 0 5px; }
    .r-facts p,.r-note { font-size:12px; color:#5a6e67; line-height:1.55; margin:8px 0 0; }
    .r-filters { display:flex; align-items:end; gap:13px; flex-wrap:wrap; margin:18px 0; padding:15px 18px; background:#e8f1ec; border:1px solid #d2e2d8; border-radius:12px; }
    .r-filter { display:flex; flex-direction:column; gap:5px; color:#28584c; font-weight:750; font-size:11px; max-width:100%; }
    .r-filter select { max-width:100%; min-width:160px; min-height:40px; border:1px solid #b7cfc2; background:#fff; color:#254a40; padding:8px 30px 8px 10px; border-radius:8px; font-size:13px; }
    #revised-condition { max-width:470px; }
    .r-filter-note { font-size:11px; color:#516d61; padding-bottom:10px; }
    .r-chart { overflow:hidden; }
    .r-chart .panel-head { margin-bottom:18px; }
    .r-chart .panel-head p { max-width:70ch; line-height:1.5; }
    .r-small { border:1px solid #cbdcd2; color:#355e50; border-radius:7px; font-size:11px; font-weight:750; padding:6px 9px; background:white; white-space:nowrap; min-height:32px; }
    .r-small:hover { background:#e8f3ec; }
    .r-chart-toolbar { display:flex; flex-wrap:wrap; gap:9px; justify-content:space-between; align-items:center; margin-bottom:13px; }
    .r-segment { display:inline-flex; border:1px solid #ccddd2; border-radius:8px; padding:3px; background:#f3f8f5; }
    .r-segment button { padding:5px 12px; background:transparent; border:0; color:#507062; border-radius:5px; font-size:11px; font-weight:800; }
    .r-segment button[aria-pressed=true] { background:#0b6e5f; color:white; }
    .r-inline { display:flex; gap:6px; align-items:center; color:#60796b; font-size:11px; }
    .r-inline select { border:1px solid #ccddd2; border-radius:6px; padding:5px; color:#355e50; background:#fff; font-size:11px; }
    .r-unit { color:#6e8176; font-size:10.5px; margin:0 0 9px; }
    .r-bars { display:grid; gap:2px; }
    .r-bar-row { display:grid; grid-template-columns:minmax(115px,1.2fr) minmax(80px,2fr) 68px; gap:12px; align-items:center; width:100%; border:1px solid transparent; background:transparent; text-align:left; padding:8px 6px; border-radius:7px; min-height:42px; }
    .r-bar-row:hover,.r-bar-row:focus-visible,.r-bar-row.r-selected { background:#eff6f1; border-color:#c9dfd1; outline:0; }
    .r-bar-label { font-size:12px; font-weight:650; color:#315247; line-height:1.35; overflow-wrap:anywhere; }
    .r-bar-rail { position:relative; background:#e5ede8; height:3px; border-radius:9px; }
    .r-bar-line { display:block; height:3px; border-radius:9px; position:relative; transition:width .25s; }

    .r-chart-data { border-top:1px solid #e1eae4; margin-top:14px; padding-top:11px; }

    .r-chart-data[open] summary { margin-bottom:12px; }

    .updated-view .revised-table table,.action-summary-table table { table-layout:auto; min-width:520px; font-size:11.5px; }

    .updated-view .revised-table th,.updated-view .revised-table td,.action-summary-table .revised-table th,.action-summary-table .revised-table td { padding:11px 12px; text-align:right; border-bottom:1px solid #e5ece7; font-variant-numeric:tabular-nums; overflow-wrap:normal; }
    .updated-view .revised-table th:first-child,.updated-view .revised-table td:first-child,.action-summary-table .revised-table th:first-child,.action-summary-table .revised-table td:first-child { text-align:left; min-width:160px; width:36%; }

    .updated-view .r-annual table { min-width:0; width:100%; table-layout:fixed; }
    .updated-view .r-annual th,.updated-view .r-annual td { min-width:0; padding:10px 6px; white-space:normal; overflow-wrap:anywhere; }
    .updated-view .r-annual th:first-child,.updated-view .r-annual td:first-child { width:12%; min-width:0; }

    .r-detail summary:hover { background:#f1f7f3; border-radius:10px; }
    .r-detail-body { padding:0 20px 20px; max-width:100%; }

    .r-detail-body .r-source { color:#7b8a80; font-size:10px; }
    .r-detail-body h4 { margin:20px 0 8px; color:#2f5947; }
    .r-stack-svg { width:100%; display:block; height:auto; }

    const t = () => copy[state.lang];

    const table = (headers, rows, caption = '', wrapClass = '') => `<div class="table-wrap ${wrapClass}"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>${caption?`<p class="table-caption">${caption}</p>`:''}`;

    const panel = (title, body, subtitle='', badge='') => `<section class="panel"><div class="panel-head"><div><h3>${title}</h3>${subtitle?`<p>${subtitle}</p>`:''}</div>${badge?`<span class="badge">${badge}</span>`:''}</div>${body}</section>`;
    const findings = (items, start=1) => `<ol class="findings" style="counter-reset:item ${start-1}">${items.map(x=>`<li><p>${x}</p></li>`).join('')}</ol>`;
    const max = values => Math.max(...values, 1);
    const bars = (items, valueIndex, textIndex, suffix='', color='') => {
      const high = suffix==='%' ? 100 : max(items.map(row=>row[valueIndex]));
      return `<div class="bar-chart">${items.map(row=>{const width=Math.max(0,Math.min(100,row[valueIndex]/high*100)); return `<div class="bar-row"><span class="bar-label">${esc(row[textIndex])}</span><span class="bar-track"><span class="bar-fill" style="width:${width}%;${color?`background:${color}`:''}"></span></span><span class="bar-value">${num(row[valueIndex])}${suffix}</span></div>`;}).join('')}</div>`;

    const annualChart = () => {
      const high = max(annual.map(d=>d.records)); const w=680, h=260, base=216, chartH=164; const x=[86,234,382,530];
      const groups = annual.map((d,i)=>{
        const recordH=d.records/high*chartH, uniqueH=d.unique/high*chartH;
        return `<g class="chart-series" tabindex="0" aria-label="${d.year}: ${num(d.records)} ${t().records}"><rect class="chart-mark" x="${x[i]}" y="${base-recordH}" width="40" height="${recordH}" rx="5" fill="#0b5f55"/><text class="chart-value" x="${x[i]+20}" y="${base-recordH-7}" text-anchor="middle" fill="#0b5f55">${num(d.records)}</text></g><g class="chart-series" tabindex="0" aria-label="${d.year}: ${num(d.unique)} ${t().unique}"><rect class="chart-mark" x="${x[i]+46}" y="${base-uniqueH}" width="40" height="${uniqueH}" rx="5" fill="#f4b844"/><text class="chart-value" x="${x[i]+66}" y="${base-uniqueH-7}" text-anchor="middle" fill="#a56a00">${num(d.unique)}</text></g><text x="${x[i]+43}" y="${base+22}" text-anchor="middle">${d.year}</text>`;
      }).join('');
      return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${t().recordsVsUnique}"><line x1="55" y1="${base}" x2="650" y2="${base}" stroke="#bfd1cb"/><line x1="55" y1="${base-chartH}" x2="650" y2="${base-chartH}" stroke="#e1e9e5" stroke-dasharray="4 5"/><text x="52" y="${base-chartH+3}" text-anchor="end">${num(high)}</text>${groups}</svg><div class="legend"><span><i class="swatch"></i>${t().records}</span><span><i class="swatch alt"></i>${t().unique}</span></div>`;
