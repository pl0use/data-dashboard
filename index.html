s: explicit illness code","8","3","0","11"],["Mental health: broader indication","10","3","1","14"],["Physical illness/health condition: explicit record","23","0","0","23"],["Physical illness: suspected only","0","0","0","0"],["Unwell: illness type unresolved","13","3","0","16"]]},{"type":"p","text":"January–September 2026"},{"type":"table","rows":[["All ages: recorded group","Male","Female","Gender unknown","Total"],["All case records","238","61","0","299"],["Citizens","201","50","0","251"],["Non-citizens","37","11","0","48"],["Citizenship unknown","0","0","0","0"],["All coded OKU/disability","12","4","0","16"],["OKU/disability: physical","7","1","0","8"],["OKU/disability: mental","0","2","0","2"],["OKU/disability: other categories","5","1","0","6"],["Mental illness: explicit illness code","25","8","0","33"],["Mental health: broader indication","25","10","0","35"],["Physical illness/health condition: explicit record","10","4","0","14"],["Physical illness: suspected only","0","0","0","0"],["Unwell: illness type unresolved","18","5","0","23"]]},{"type":"p","text":"The accompanying vulnerability-gender-breakdown.csv contains all annual and pooled citizenship/gender combinations, including zero and unknown categories. Its linked-identity counts are non-additive: the same identity may have different citizenship entries over time or belong to several conditions. The source-row counts remain the primary figures in these tables."},{"type":"p","text":"Source: Dec 2023.xlsx · Profil · rows 7–693; Dec 2024.xlsx · Profil · rows 7–356; Dec 2025.xlsx · Profil · rows 7–691; Sept 2026.xlsx · Profil · rows 7–305. Fields: V recorded gender; W citizenship; AX disability; AV illness; AW illness detail; AN specific physical-illness narrative. Physical classification evidence is in physical-illness-record-review.csv.."}]},{"title":"24. The elderly population by citizenship, disability, illness and gender. Elderly means reported numeric age 60 or above, consistent with the existing report. The 53 records without a numeric age are not assigned to this group. The resulting 502 elderly case rows belong to 402 linked identity groups under the existing matching method.","blocks":[{"type":"table","rows":[["Age 60+: recorded group","Male","Female","Gender unknown","Total"],["All case records","375","127","0","502"],["Citizens","294","75","0","369"],["Non-citizens","80","52","0","132"],["Citizenship unknown","1","0","0","1"],["All coded OKU/disability","15","6","0","21"],["OKU/disability: physical","11","1","0","12"],["OKU/disability: mental","1","1","0","2"],["OKU/disability: other categories","3","4","0","7"],["Mental illness: explicit illness code","9","6","0","15"],["Mental health: broader indication","9","7","0","16"],["Physical illness/health condition: explicit record","18","4","0","22"],["Physical illness: suspected only","1","0","0","1"],["Unwell: illness type unresolved","12","3","0","15"]]},{"type":"p","text":"Citizenship and gender reconcile: 369 citizen rows (294 male, 75 female), 132 non-citizen rows (80 male, 52 female), and one unknown-citizenship male row give 502 elderly records: 375 male + 127 female = 502."},{"type":"p","text":"Among elderly records, 21 have a coded disability: 12 physical, two mental and seven in other disability categories. There are 15 explicitly Mental-coded illness rows, 16 broader mental-health-indication rows, and 22 explicit physical-condition rows. A suspected physical illness is recorded separately on one additional row. These health/disability rows overlap and cannot be added to obtain a vulnerable-person total."},{"type":"table","rows":[["Elderly records by year","Male","Female","Gender unknown","Total"],["2023","79","57","0","136"],["2024","46","31","0","77"],["2025","153","19","0","172"],["2026 Jan–Sep","97","20","0","117"],["Whole period","375","127","0","502"]]},{"type":"summary","text":"Show elderly citizenship and gender within each recorded condition"},{"type":"table","rows":[["Age 60+: condition","Citizenship","Male","Female","Gender unknown","Total"],["All case records","Citizen","294","75","0","369"],["All case records","Non-citizen","80","52","0","132"],["All case records","Citizenship unknown","1","0","0","1"],["All coded OKU/disability","Citizen","11","6","0","17"],["All coded OKU/disability","Non-citizen","4","0","0","4"],["All coded OKU/disability","Citizenship unknown","0","0","0","0"],["OKU/disability: physical","Citizen","8","1","0","9"],["OKU/disability: physical","Non-citizen","3","0","0","3"],["OKU/disability: physical","Citizenship unknown","0","0","0","0"],["OKU/disability: mental","Citizen","1","1","0","2"],["OKU/disability: mental","Non-citizen","0","0","0","0"],["OKU/disability: mental","Citizenship unknown","0","0","0","0"],["OKU/disability: other categories","Citizen","2","4","0","6"],["OKU/disability: other categories","Non-citizen","1","0","0","1"],["OKU/disability: other categories","Citizenship unknown","0","0","0","0"],["Mental illness: explicit illness code","Citizen","6","6","0","12"],["Mental illness: explicit illness code","Non-citizen","3","0","0","3"],["Mental illness: explicit illness code","Citizenship unknown","0","0","0","0"],["Mental health: broader indication","Citizen","6","7","0","13"],["Mental health: broader indication","Non-citizen","3","0","0","3"],["Mental health: broader indication","Citizenship unknown","0","0","0","0"],["Physical illness/health condition: explicit record","Citizen","18","2","0","20"],["Physical illness/health condition: explicit record","Non-citizen","0","2","0","2"],["Physical illness/health condition: explicit record","Citizenship unknown","0","0","0","0"],["Physical illness: suspected only","Citizen","1","0","0","1"],["Physical illness: suspected only","Non-citizen","0","0","0","0"],["Physical illness: suspected only","Citizenship unknown","0","0","0","0"],["Unwell: illness type unresolved","Citizen","12","3","0","15"],["Unwell: illness type unresolved","Non-citizen","0","0","0","0"],["Unwell: illness type unresolved","Citizenship unknown","0","0","0","0"]]},{"type":"summary","text":"Show the annual gender breakdowns for age 60+"},{"type":"p","text":"2023"},{"type":"table","rows":[["Age 60+: recorded group","Male","Female","Gender unknown","Total"],["All case records","79","57","0","136"],["Citizens","57","29","0","86"],["Non-citizens","21","28","0","49"],["Citizenship unknown","1","0","0","1"],["All coded OKU/disability","1","2","0","3"],["OKU/disability: physical","1","0","0","1"],["OKU/disability: mental","0","1","0","1"],["OKU/disability: other categories","0","1","0","1"],["Mental illness: explicit illness code","0","2","0","2"],["Mental health: broader indication","0","2","0","2"],["Physical illness/health condition: explicit record","0","2","0","2"],["Physical illness: suspected only","0","0","0","0"],["Unwell: illness type unresolved","0","0","0","0"]]},{"type":"p","text":"2024"},{"type":"table","rows":[["Age 60+: recorded group","Male","Female","Gender unknown","Total"],["All case records","46","31","0","77"],["Citizens","26","12","0","38"],["Non-citizens","20","19","0","39"],["Citizenship unknown","0","0","0","0"],["All coded OKU/disability","3","0","0","3"],["OKU/disability: physical","2","0","0","2"],["OKU/disability: mental","0","0","0","0"],["OKU/disability: other categories","1","0","0","1"],["Mental illness: explicit illness code","0","0","0","0"],["Mental health: broader indication","0","1","0","1"],["Physical illness/health condition: explicit record","1","1","0","2"],["Physical illness: suspected only","1","0","0","1"],["Unwell: illness type unresolved","3","1","0","4"]]},{"type":"p","text":"2025"},{"type":"table","rows":[["Age 60+: recorded group","Male","Female","Gender unknown","Total"],["All case records","153","19","0","172"],["Citizens","131","17","0","148"],["Non-citizens","22","2","0","24"],["Citizenship unknown","0","0","0","0"],["All coded OKU/disability","7","2","0","9"],["OKU/disability: physical","5","0","0","5"],["OKU/disability: mental","1","0","0","1"],["OKU/disability: other categories","1","2","0","3"],["Mental illness: explicit illness code","1","0","0","1"],["Mental health: broader indication","1","0","0","1"],["Physical illness/health condition: explicit record","13","0","0","13"],["Physical illness: suspected only","0","0","0","0"],["Unwell: illness type unresolved","3","2","0","5"]]},{"type":"p","text":"January–September 2026"},{"type":"table","rows":[["Age 60+: recorded group","Male","Female","Gender unknown","Total"],["All case records","97","20","0","117"],["Citizens","80","17","0","97"],["Non-citizens","17","3","0","20"],["Citizenship unknown","0","0","0","0"],["All coded OKU/disability","4","2","0","6"],["OKU/disability: physical","3","1","0","4"],["OKU/disability: mental","0","0","0","0"],["OKU/disability: other categories","1","1","0","2"],["Mental illness: explicit illness code","8","4","0","12"],["Mental health: broader indication","8","4","0","12"],["Physical illness/health condition: explicit record","4","1","0","5"],["Physical illness: suspected only","0","0","0","0"],["Unwell: illness type unresolved","6","0","0","6"]]},{"type":"p","text":"For physical disability among elderly citizens, the records show eight men and one woman; elderly non-citizens contribute three men and no women. Both mental-disability rows are citizens, one male and one female. Explicit mental-illness coding covers six male and six female citizen rows, plus three male non-citizen rows. Explicit physical conditions cover 18 male and two female citizen rows, plus two female non-citizen rows."},{"type":"p","text":"Age reconciliation: 1,466 rows aged under 60 + 502 aged 60 or above + 53 with unknown age = 2,021. Within each new table male + female + unknown gender equals total, and citizenship subtotals reconcile to their parent condition. A zero means no matching recorded case under the stated rule; it does not establish absence of the condition in the underlying population."},{"type":"p","text":"Source: Dec 2023.xlsx · Profil · rows 7–693; Dec 2024.xlsx · Profil · rows 7–356; Dec 2025.xlsx · Profil · rows 7–691; Sept 2026.xlsx · Profil · rows 7–305. Fields: T numeric reported age, together with the same gender, citizenship, disability and illness definitions as section 23.."},{"type":"p","text":"Analysis of supplied operation records. No external data or clinical/legal assumptions added."}]}],"ms":[{"title":"1. Dapatan utama. Profil dan jumlah kes yang direkodkan berubah dengan ketara dari semasa ke semasa, seiring dengan perubahan jenis operasi dan kelengkapan pencatatan. Kesimpulan paling kukuh berkaitan dengan keperluan perkhidmatan, kejadian berulang yang direkodkan dan batas bukti susulan.","blocks":[{"type":"li","text":"Operasi ini melibatkan beberapa populasi yang berbeza. Fail awal kebanyakannya merekodkan bukan warganegara yang dikelaskan sebagai pengemis. Fail kemudian kebanyakannya merekodkan lelaki Malaysia yang dikelaskan sebagai gelandangan. Menggabungkan kategori ini sebagai satu “populasi gelandangan” yang seragam akan menyembunyikan perbezaan besar."},{"type":"li","text":"Label kekerapan menunjukkan kejadian berulang yang lebih rendah daripada bukti padanan rekod. Padanan berasaskan dokumen secara konservatif mengenal pasti 296 pertemuan pada tarikh kemudian dalam 208 kumpulan. Daripada pertemuan kemudian itu, 206 masih dilabelkan sebagai “kali pertama”. Gabungan pertemuan semula ini dengan sejarah kes berulang yang direkodkan JKM memberikan 537 rekod dengan bukti kes berulang: 328 rekod ditandakan JKM serta 209 rekod tambahan dikenal pasti melalui padanan."},{"type":"li","text":"Kes pada tahun kemudian melibatkan umur yang lebih tua. Pada 2026, 117 rekod mempunyai umur yang dilaporkan sekurang-kurangnya 60 tahun, mewakili 39.1% daripada semua 299 rekod dan 39.5% daripada rekod dengan umur diketahui. Subkumpulan rakyat Malaysia sudah pun berumur lebih tua dalam fail awal; oleh itu perubahan komposisi kewarganegaraan perlu diambil kira."},{"type":"li","text":"Petunjuk kesihatan pada 2026 tertumpu pada satu operasi. Tiga puluh dua daripada 35 rekod tahun tersebut yang mempunyai petunjuk kesihatan mental berlaku pada 24 September. Ini bukan bukti peningkatan yang seragam sepanjang tahun."},{"type":"li","text":"Rujukan atau penutupan pentadbiran tidak membuktikan pemulihan. Fail ini tidak merekodkan secara sistematik rawatan yang selesai, pengekalan tempat tinggal yang disahkan, pekerjaan selepas rujukan atau ketiadaan pertemuan berulang di jalanan."},{"type":"li","text":"Perubahan pengumpulan data cukup besar untuk memesongkan perbandingan trend yang mudah. Khususnya, pencatatan ketidakupayaan, kesihatan, butiran lokasi dan sebab menjadi kes berbeza dengan ketara mengikut tahun."}]},{"title":"2. Perkara yang dikira dan dikecualikan. Setiap baris yang dikekalkan ialah catatan kes dalam jadual profil utama yang mempunyai tarikh operasi. Kesemua 2,021 baris yang dikekalkan mempunyai medan nama yang diisi dan tarikh operasi yang sah dalam tahun pelaporan masing-masing. Enam nilai nama ialah pengisi seperti Unknown atau Tiada Maklumat; nilai ini tidak membuktikan identiti individu diketahui.","blocks":[{"type":"table","rows":[["Buku kerja","Tempoh berdasarkan tarikh operasi","Rekod yang dikekalkan","Julat jadual kes","Baris templat tanpa kes yang dikecualikan"],["Dec 2023.xlsx","2023-01-04 hingga 2023-12-29","687","'Profil '!A7:BG693","28"],["Dec 2024.xlsx","2024-01-06 hingga 2024-12-24","350","'Profil '!A7:BG356","0"],["Dec 2025.xlsx","2025-01-08 hingga 2025-12-16","685","'Profil '!A7:BG691","0"],["Sept 2026.xlsx","2026-01-07 hingga 2026-09-24","299","'Profil '!A7:BG305","69"],["Gabungan","Januari 2023–September 2026","2,021","Empat jadual profil utama","97"]]},{"type":"p","text":"Semua lembaran kerja diperiksa, termasuk lembaran kod tersembunyi. Buku kerja 2025 mengandungi jadual kedua dalam Sheet1. Sebanyak 685 rekod kes di dalamnya mengulangi rekod profil utama secara tepat, dengan anjakan dua baris. Mengira kedua-dua lembaran akan meningkatkan jumlah secara salah kepada 2,706. Salinan pendua itu dikecualikan. Lembaran panduan dan kod mengandungi takrif serta pilihan, bukannya kes tambahan."},{"type":"p","text":"Tiada dua rekod lengkap dalam empat jadual profil utama yang sama sepenuhnya apabila nombor turutan diabaikan. Terdapat tiga baris tambahan dalam gabungan identiti/tarikh dipadankan yang sama, termasuk dua pasangan pada 2026 dengan tindakan yang berbeza. Baris ini dikekalkan sebagai catatan asal kerana tidak jelas sama ada ia menggambarkan tindakan berasingan atau dokumentasi pendua. Analisis kes berulang mengira tarikh yang berbeza, maka pasangan ini tidak mewujudkan pertemuan semula palsu."},{"type":"p","text":"Lajur nombor turutan tidak boleh diandalkan sebagai jumlah kawalan. Contohnya, lembaran 2023 meneruskan nilai bulan dan turutan yang telah diisi selepas kes sebenar terakhir. Dimensi lembaran berformat juga menjangkau jauh melampaui data sebenar. Kedua-duanya tidak digunakan untuk menganggarkan jumlah kes."}]},{"title":"3. Jumlah rekod dan corak operasi. Angka ini menunjukkan aktiviti yang direkodkan oleh operasi ini. Ia tidak dapat mengukur prevalens gelandangan tanpa maklumat tentang usaha pencarian, liputan, kelengkapan pencatatan dan populasi yang lebih luas.","blocks":[{"type":"table","rows":[["Ukuran","2023","2024","2025","2026 Jan–Sep","Gabungan 2023–Sep 2026"],["Semua baris rekod kes","687","350","685","299","2,021"],["Baris Januari–September, berdasarkan tarikh operasi","608","320","536","299","1,763"],["Tarikh berbeza dengan sekurang-kurangnya satu rekod","101","57","42","34","234"],["Baris operasi berjadual/berkala","594","256","116","110","1,076"],["Baris operasi bersepadu","43","12","510","133","698"],["Baris operasi tidak berjadual","50","82","59","56","247"],["Bahagian pada dua tarikh paling sibuk","5.5%","14.0%","35.8%","76.3%","12.4% pada dua tarikh paling sibuk sepanjang tempoh"]]},{"type":"p","text":"Catatan setahun penuh menurun 49.1% daripada 687 pada 2023 kepada 350 pada 2024, kemudian meningkat 95.7% kepada 685 pada 2025. Bagi perbandingan Januari–September yang setara, 2026 mempunyai 299 catatan berbanding 536 pada 2025, iaitu penurunan 44.2%. Ini ialah penurunan pertemuan yang direkodkan, bukannya bukti bahawa gelandangan atau kejadian gelandangan berulang telah berkurang."},{"type":"p","text":"Aktiviti semakin tertumpu pada beberapa operasi sahaja. Enam tarikh paling sibuk pada 2025 merangkumi 535 daripada 685 catatan (78.1%). Pada 2026, 4 Mac menyumbang 110 dan 24 September menyumbang 118, menjadikan 228 daripada 299 (76.3%). Dua tarikh paling sibuk pada 2023 hanya menyumbang 38 daripada 687 (5.5%). Perubahan penumpuan ini boleh mengubah peratusan demografi dan kesihatan tahunan walaupun perubahan sebenar populasi di jalanan lebih kecil."},{"type":"table","rows":[["Tarikh operasi paling sibuk","Rekod","Bahagian daripada tahun berkenaan"],["2023: 2023-07-21","20","2.9%"],["2023: 2023-06-09","18","2.6%"],["2023: 2023-03-31","17","2.5%"],["2024: 2024-02-23","29","8.3%"],["2024: 2024-05-12","20","5.7%"],["2024: 2024-02-03","15","4.3%"],["2025: 2025-02-23","132","19.3%"],["2025: 2025-05-18","113","16.5%"],["2025: 2025-07-06","99","14.5%"],["2026: 2026-09-24","118","39.5%"],["2026: 2026-03-04","110","36.8%"],["2026: 2026-07-16","13","4.3%"]]},{"type":"table","rows":[["Bulan operasi","2023","2024","2025","2026","Jumlah bagi tempoh yang dibekalkan"],["Januari","68","21","1","25","115"],["Februari","67","67","139","0","273"],["Mac","79","64","31","111","285"],["April","18","15","73","7","113"],["Mei","99","74","162","6","341"],["Jun","107","47","0","7","161"],["Julai","57","22","115","17","211"],["Ogos","56","3","8","6","73"],["September","57","7","7","120","191"],["Oktober","17","11","120","Di luar tempoh yang dibekalkan","148"],["November","34","8","19","Di luar tempoh yang dibekalkan","61"],["Disember","28","11","10","Di luar tempoh yang dibekalkan","49"],["Semua bulan","687","350","685","299","2,021"]]},{"type":"p","text":"Bilangan bulanan menggunakan tarikh operasi J. Medan nama bulan B tidak sepadan dengan tarikh pada 24 baris dan kosong pada satu baris. Oleh itu, bilangan bulanan ini berbeza daripada pengelompokan berdasarkan medan nama bulan semata-mata. Jun 2025 dan Februari 2026 tidak mengandungi catatan kes bertarikh dalam fail yang dibekalkan; ini tidak membuktikan bahawa tiada operasi dijalankan."},{"type":"p","text":"Sumber: Dec 2023.xlsx · Profil · baris 7–693; Dec 2024.xlsx · Profil · baris 7–356; Dec 2025.xlsx · Profil · baris 7–691; Sept 2026.xlsx · Profil · baris 7–305. Medan: J tarikh operasi; K jenis operasi; B bulan yang dilaporkan."}]},{"title":"4. Profil individu dalam rekod. Jumlah demografi dikira mengikut pertemuan: seseorang yang direkodkan berulang kali menyumbang kepada bilangan berulang kali. Jantina dan kewarganegaraan mengikut kategori yang dicatatkan pegawai, tanpa membuat inferens daripada nama atau nombor dokumen.","blocks":[{"type":"table","rows":[["Profil","2023","2024","2025","2026 Jan–Sep","Semua rekod"],["Lelaki","346 (50.4%)","168 (48.0%)","577 (84.2%)","238 (79.6%)","1,329 (65.8%)"],["Perempuan","338 (49.2%)","182 (52.0%)","106 (15.5%)","61 (20.4%)","687 (34.0%)"],["Jantina tidak direkodkan","3","0","2","0","5"],["Warganegara Malaysia","201 (29.3%)","83 (23.7%)","479 (69.9%)","251 (83.9%)","1,014"],["Bukan warganegara","484 (70.5%)","267 (76.3%)","205 (29.9%)","48 (16.1%)","1,004"],["Kewarganegaraan tidak diketahui","2","0","1","0","3"],["Direkodkan sebagai tiada kewarganegaraan","0","0","0","0","0"]]},{"type":"p","text":"Pecahan kewarganegaraan gabungan hampir seimbang: 1,014 warganegara dan 1,004 bukan warganegara, serta tiga tidak diketahui. Angka gabungan ini menyembunyikan perubahan bahagian warganegara daripada 29.3% pada 2023 dan 23.7% pada 2024 kepada 69.9% pada 2025 dan 83.9% pada 2026. Sepanjang tempoh tersebut, bahagian lelaki lebih tinggi dalam kalangan warganegara: 806 daripada 1,014 (79.5%), berbanding 520 daripada 1,004 catatan bukan warganegara (51.8%). Ini menyumbang kepada profil yang lebih didominasi lelaki pada tahun kemudian."},{"type":"p","text":"Tiada rekod dikodkan secara jelas sebagai “Tiada Kewarganegaraan” dalam medan kewarganegaraan. Ini tidak membuktikan bahawa tiada individu tanpa kewarganegaraan. Ketiadaan pasport, label Rohingya, kad UNHCR atau kod kewarganegaraan tidak diketahui tidak boleh membuktikan keadaan tanpa kewarganegaraan dengan sendirinya. Begitu juga, kod bukan warganegara atau penyerahan kepada imigresen tidak membuktikan status imigresen tanpa dokumen atau tidak sah."},{"type":"p","text":"Sumber: Dec 2023.xlsx · Profil · baris 7–693; Dec 2024.xlsx · Profil · baris 7–356; Dec 2025.xlsx · Profil · baris 7–691; Sept 2026.xlsx · Profil · baris 7–305. Medan: V jantina; W kewarganegaraan."}]},{"title":"5. Demografi umur dan corak penuaan. Statistik umur menggunakan umur berangka yang dilaporkan dalam T. Umur ini tidak digantikan secara senyap dengan medan kumpulan umur sumber dan tidak dianggarkan daripada nombor pengenalan. “Kanak-kanak” di sini bermaksud umur yang dilaporkan bawah 18 tahun, manakala “warga emas” bermaksud umur yang dilaporkan 60 tahun atau lebih.","blocks":[{"type":"table","rows":[["Umur yang dilaporkan","2023","2024","2025","2026 Jan–Sep","Jumlah"],["0-17","110","25","27","1","163"],["18-29","76","52","45","13","186"],["30-39","121","69","90","24","304"],["40-49","137","79","162","74","452"],["50-59","91","48","155","67","361"],["60-64","55","27","73","45","200"],["65+","81","50","99","72","302"],["Tidak diketahui","16","0","34","3","53"]]},{"type":"table","rows":[["Ukuran umur","2023","2024","2025","2026 Jan–Sep","Gabungan 2023–Sep 2026"],["Umur berangka diketahui","671","350","651","296","1,968"],["Median umur yang dilaporkan","41.0","44.0","50.0","55.0","47.0"],["Purata umur yang dilaporkan","39.9","43.7","48.6","53.9","45.6"],["Julat umur, umur diketahui","0–88","0–89","1–84","15–79","0–89"],["Umur 60+, sebagai bahagian umur diketahui","20.3%","22.0%","26.4%","39.5%","25.5%"],["Umur 65+, sebagai bahagian umur diketahui","12.1%","14.3%","15.2%","24.3%","15.3%"],["Median umur warganegara","58.0","58.0","53.0","55.0","54.0"],["Median umur bukan warganegara","36.0","41.0","36.0","50.0","38.0"]]},{"type":"p","text":"Sepanjang semua tahun, 502 rekod berumur 60 tahun atau lebih dan 302 berumur 65 tahun atau lebih. Dalam kalangan 1,968 rekod dengan umur diketahui, masing-masing mewakili 25.5% dan 15.3%. Kumpulan umur gabungan terbesar ialah 40–49, dengan 452 catatan. Pada 2026, 258 daripada 296 rekod dengan umur diketahui (87.2%) berumur sekurang-kurangnya 40 tahun. Oleh itu, keperluan perkhidmatan merangkumi keperluan praktikal orang dewasa pertengahan umur dan warga emas, selain penempatan pekerjaan."},{"type":"p","text":"Peningkatan umur keseluruhan sebahagiannya berpunca daripada perubahan komposisi. Median umur warganegara ialah 58 pada kedua-dua 2023 dan 2024, 53 pada 2025 dan 55 pada 2026. Ini tidak menunjukkan peningkatan yang berterusan. Kenaikan besar median gabungan daripada 41 kepada 55 berlaku ketika komposisi rekod beralih daripada bukan warganegara yang lebih muda kepada warganegara. Adalah mengelirukan untuk mengatakan bahawa kohort yang sama telah meningkat umur sebanyak 14 tahun dalam tempoh ini."},{"type":"p","text":"Umur yang dilaporkan mempunyai kelemahan: 92 rekod berbeza lebih daripada satu tahun daripada hasil tahun operasi ditolak tahun lahir yang direkodkan, dan 22 mempunyai umur berangka di luar kumpulan umur sumber yang dinyatakan. Satu rekod 2026 menyatakan umur 22, tahun lahir 1971 dan kumpulan umur 55–59. Satu lagi menyatakan umur berangka 59 tetapi kumpulan 65+. Oleh itu, jumlah berasaskan umur berangka sebanyak 72 bagi umur 65+ pada 2026 berbeza daripada 73 baris berlabel 65+ dalam medan kumpulan umur. Ketidakselarasan sumber ini dikekalkan dan ditandakan."},{"type":"p","text":"Sumber: Dec 2023.xlsx · Profil · baris 7–693; Dec 2024.xlsx · Profil · baris 7–356; Dec 2025.xlsx · Profil · baris 7–691; Sept 2026.xlsx · Profil · baris 7–305. Medan: S tahun lahir; T umur berangka; U kumpulan umur sumber; W kewarganegaraan."}]},{"title":"6. Kanak-kanak dan keluarga. Terdapat 163 rekod dengan umur yang dilaporkan bawah 18 tahun, termasuk 69 bawah lima tahun. Ini ialah catatan kes, bukannya bilangan kanak-kanak unik atau keluarga yang telah disahkan.","blocks":[{"type":"table","rows":[["Dapatan berkaitan kanak-kanak","Bilangan"],["Bawah 18: 2023 / 2024 / 2025 / 2026","110 / 25 / 27 / 1"],["Rekod kanak-kanak bukan warganegara","133"],["Rekod kanak-kanak warganegara","30"],["Dikelaskan sebagai pengemis","145"],["Diserahkan kepada Pelindung","33"],["Dilepaskan","55"],["Tiada tindakan direkodkan","65"],["Dikembalikan kepada keluarga","3"],["Hospital / imigresen / NGO / lain-lain","1 / 1 / 1 / 4"]]},{"type":"p","text":"Bukan warganegara merangkumi 81.6% daripada catatan kanak-kanak. Negara asal paling lazim yang direkodkan bagi kanak-kanak bukan warganegara ialah Myanmar (53), Kemboja (17), Indonesia (15), Pakistan (13), Palestin (12) dan Syria (12). Oleh sebab hubungan keluarga tidak dikodkan secara sistematik, fail ini tidak dapat menentukan jumlah isi rumah yang terjejas, sama ada kanak-kanak ditemani atau sama ada kumpulan adik-beradik menerima intervensi yang diselaraskan."},{"type":"p","text":"Sesetengah pengenal pasti dokumen alternatif dan UNHCR dikongsi oleh orang dewasa dan kanak-kanak. Menganggap setiap nombor kad yang dikongsi sebagai seorang individu akan menggabungkan ahli keluarga secara salah. Sebab itu, kaedah analisis kejadian berulang mensyaratkan padanan tepat nama yang diseragamkan untuk dokumen alternatif. Orang dewasa yang muncul berulang kali dan anak-anak mereka masih boleh menjadi rekod berasingan walaupun nombor kad yang sama muncul pada kedua-duanya."},{"type":"p","text":"Sebab “tiada pekerjaan” direkodkan bagi 36 catatan kanak-kanak. Ini tidak wajar ditafsirkan sebagai penjelasan pasaran buruh orang dewasa bagi kanak-kanak tersebut. Rekod turut mengandungi catatan tentang menemani ibu yang mengemis, ibu yang bekerja dan kanak-kanak yang masih bersekolah. Butiran ini menunjukkan mengapa kategori operasi perlu ditafsirkan pada peringkat individu dan keluarga."},{"type":"p","text":"Sumber: Dec 2023.xlsx · Profil · baris 7–693; Dec 2024.xlsx · Profil · baris 7–356; Dec 2025.xlsx · Profil · baris 7–691; Sept 2026.xlsx · Profil · baris 7–305. Medan: T umur; W kewarganegaraan; AB/AC asal; AF kategori; AJ/AK faktor; AO tindakan; R/AE dokumen alternatif digunakan untuk semakan padanan sahaja."}]},{"title":"7. Jenis kes. Sumber menggunakan tiga kategori kes utama: Pengemis, Gelandangan dan Peleser (kategori sumber bagi aktiviti berkeliaran). Ini ialah pengelasan pegawai, bukannya keadaan tempat tinggal yang disahkan secara bebas.","blocks":[{"type":"table","rows":[["Kategori kes","2023","2024","2025","2026 Jan–Sep","Jumlah"],["Pengemis","659","326","73","24","1,082"],["Gelandangan","18","20","544","270","852"],["Peleser, kategori sumber","3","2","67","1","73"],["Tidak diketahui atau kosong","7","2","1","4","14"]]},{"type":"p","text":"Pengemis merangkumi 95.9% daripada rekod pada 2023 dan 93.1% pada 2024. Gelandangan merangkumi 79.4% pada 2025 dan 90.3% pada 2026. Sepanjang keseluruhan tempoh terdapat 1,082 catatan pengemis, 852 catatan gelandangan dan 73 catatan Peleser. Bukan warganegara merangkumi 799 catatan pengemis, manakala warganegara merangkumi 671 catatan gelandangan."},{"type":"p","text":"Peralihan pada 2025 berlaku seiring dengan peningkatan operasi bersepadu kepada 510 daripada 685 rekod (74.5%), berbanding 43 daripada 687 (6.3%) pada 2023. Ini menunjukkan perubahan cara populasi tersebut ditemui. Bukti ini tidak mencukupi untuk menyimpulkan bahawa kegiatan mengemis telah hilang atau gelandangan tiba-tiba berlipat ganda di seluruh bandar."},{"type":"p","text":"Sesetengah catatan naratif menyatakan dengan jelas bahawa individu mempunyai rumah, bilik sewa, pekerjaan, sokongan keluarga atau bilik yang dibiayai organisasi lain. Oleh itu, rekod termasuk individu yang ditemui ketika mengemis atau semasa operasi jalanan yang tidak semestinya tidur di jalanan. Dalam satu kumpulan dipadankan pada 2025, dokumen yang sama muncul di bawah gelandangan sebanyak lima kali dan Peleser sekali. Perubahan kategori tidak semestinya bermakna individu berbeza atau perubahan status perumahan yang jelas."},{"type":"p","text":"Sumber: Dec 2023.xlsx · Profil · baris 7–693; Dec 2024.xlsx · Profil · baris 7–356; Dec 2025.xlsx · Profil · baris 7–691; Sept 2026.xlsx · Profil · baris 7–305. Medan: AF kategori kes; K jenis operasi; AK/AN/AP catatan naratif."}]},{"title":"8. Kerakyatan, asal, kewarganegaraan dan UNHCR. Medan negara asal hanya dianalisis dalam kalangan 1,004 rekod yang dikodkan secara jelas sebagai bukan warganegara. Variasi seperti Yaman/Yemen dan Palestin/Palestine diseragamkan. Angka ini kekal sebagai negara asal yang direkodkan, bukannya penentuan kerakyatan yang disahkan secara bebas.","blocks":[{"type":"table","rows":[["Asal yang direkodkan dalam kalangan bukan warganegara","2023","2024","2025","2026 Jan–Sep","Jumlah"],["Pakistan","129","158","30","1","318"],["Myanmar","99","32","56","5","192"],["Indonesia","48","20","48","13","129"],["China","39","8","12","0","59"],["Kemboja","39","9","1","6","55"],["Palestin","38","7","0","0","45"],["Bangladesh","12","4","14","1","31"],["Syria","25","5","0","0","30"],["India","7","2","17","2","28"],["Yaman","16","6","0","0","22"],["Jordan","2","4","1","0","7"],["Thailand","4","3","0","0","7"],["Vietnam","3","1","2","0","6"],["Filipina","1","0","3","0","4"],["Ukraine","0","1","3","0","4"],["Sri Lanka","2","0","0","1","3"],["Nepal","0","0","3","0","3"],["Turki","0","1","1","0","2"],["Singapura","0","0","1","0","1"],["Jamaica","0","0","1","0","1"],["Sudan","0","0","1","0","1"],["Jepun","0","0","1","0","1"],["Cameroon","0","0","1","0","1"],["Uganda","0","0","1","0","1"],["Somalia","1","0","0","0","1"],["Uzbekistan","0","0","1","0","1"],["Britain Raya","0","0","0","1","1"],["Label Rohingya, negara tidak jelas","0","3","1","0","4"],["Tidak diketahui","18","3","6","18","45"],["Lain-lain, tidak dinyatakan","1","0","0","0","1"],["Semua rekod bukan warganegara","484","267","205","48","1,004"]]},{"type":"p","text":"Pakistan ialah negara asal terbesar yang direkodkan dengan 318 catatan (31.7% daripada rekod bukan warganegara), diikuti Myanmar dengan 192 (19.1%). Indonesia mempunyai 123 catatan dalam medan negara yang ditetapkan serta enam yang dinyatakan secara jelas sebagai “PR INDONESIA” dalam medan dokumen alternatif. India mempunyai 27 dalam medan yang ditetapkan serta satu catatan “PR INDIA”. Jadual memasukkan tujuh catatan asal yang dinyatakan secara jelas itu, menjadikan Indonesia 129 dan India 28. Negara asal tidak dianggarkan daripada nama, awalan nombor pengenalan atau etnik."},{"type":"p","text":"Medan negara yang ditetapkan kosong atau tidak diketahui bagi 52 catatan bukan warganegara. Tujuh catatan PR menjelaskan asal bagi tujuh daripadanya, meninggalkan 45 tidak diketahui dalam jadual ini. Pada 2026 sahaja, 25 daripada 48 catatan bukan warganegara tidak mempunyai negara dalam medan yang ditetapkan; selepas tujuh catatan PR diambil kira, 18 kekal tidak diketahui. Ini mengehadkan kesimpulan tentang perubahan komposisi kerakyatan pada 2026. Empat baris tambahan mempunyai label Rohingya tanpa negara dinyatakan. Baris ini dikekalkan berasingan tanpa ditetapkan kerakyatannya."},{"type":"table","rows":[["Medan pemegang UNHCR, rekod bukan warganegara sahaja","2023","2024","2025","2026 Jan–Sep","Jumlah"],["Ya","43","8","19","4","74"],["Tidak","133","11","46","10","200"],["Tidak diketahui, kosong atau tidak sah","308","248","140","34","730"]]},{"type":"p","text":"Sebanyak 74 catatan positif pemegang UNHCR termasuk 65 dengan Myanmar direkodkan sebagai asal. Ini bukan 74 pemegang kad unik yang telah disahkan. Terdapat satu baris dengan nombor menyerupai nombor kad dimasukkan ke medan ya/tidak pemegang; ia dianggap status tidak sah, bukannya secara automatik “ya”. Sesetengah nilai “tidak” juga muncul pada rekod warganegara dan dikecualikan daripada jadual bukan warganegara yang berkenaan. Rekod ini tidak dapat menentukan jumlah populasi pelarian atau bilangan tepat dokumen yang sah, tamat tempoh atau belum disahkan."},{"type":"p","text":"Keterangan pemastautin tetap atau kad merah muncul dalam catatan, termasuk tujuh catatan PR-negara yang jelas pada 2026 dan keterangan kad merah pada 2025. Ini bukan medan status undang-undang yang diselenggara secara konsisten. Status pelarian, pemastautin tetap, kebenaran bekerja, kesahan pasport, kewarganegaraan dan keadaan tanpa kewarganegaraan perlu kekal sebagai konsep berasingan."},{"type":"p","text":"Sumber: Dec 2023.xlsx · Profil · baris 7–693; Dec 2024.xlsx · Profil · baris 7–356; Dec 2025.xlsx · Profil · baris 7–691; Sept 2026.xlsx · Profil · baris 7–305. Medan: W kewarganegaraan; AB negara; AC negara lain; R keterangan dokumen; AD medan pemegang UNHCR; AE nombor kad, digunakan untuk padanan sahaja."}]},{"title":"9. Etnik dan negeri asal di Malaysia. Etnik terutamanya dilaporkan bagi warganegara. Oleh itu, jadual di bawah menggunakan 1,014 catatan warganegara sebagai penyebut dan tidak mentafsir label negara asing sebagai etnik.","blocks":[{"type":"table","rows":[["Etnik warganegara yang direkodkan","2023","2024","2025","2026 Jan–Sep","Jumlah"],["Melayu","66","39","194","65","364"],["Cina","33","18","111","50","212"],["India","13","9","87","35","144"],["Kategori peribumi Semenanjung","0","0","1","0","1"],["Kategori peribumi Sabah","1","1","7","4","13"],["Kategori peribumi Sarawak","0","0","6","2","8"],["Lain-lain","1","0","2","1","4"],["Tidak direkodkan atau tidak diketahui","87","16","71","94","268"]]},{"type":"table","rows":[["Negeri asal, rekod warganegara","Bilangan","Bahagian daripada 1,014 catatan warganegara"],["Selangor","176","17.4%"],["Perak","135","13.3%"],["W.P. Kuala Lumpur","130","12.8%"],["(kosong)","117","11.5%"],["Johor","71","7.0%"],["Negeri Sembilan","54","5.3%"],["Kedah","46","4.5%"],["Sabah","45","4.4%"],["Kelantan","44","4.3%"],["Pulau Pinang","40","3.9%"],["Tiada Maklumat","38","3.7%"],["Pahang","35","3.5%"],["Melaka","31","3.1%"],["Sarawak","26","2.6%"],["Perlis","14","1.4%"],["Terengganu","12","1.2%"],["Semua rekod warganegara","1,014","100.0%"]]},{"type":"p","text":"Selangor (176), Perak (135) dan Kuala Lumpur (130) ialah asal warganegara paling banyak direkodkan. Selangor dan Kuala Lumpur bersama-sama merangkumi 306 daripada 1,014 catatan warganegara (30.2%). Negeri asal diketahui bagi 859 catatan warganegara; daripada jumlah ini, 729 (84.9%) menamakan negeri selain Kuala Lumpur. Ini tidak membuktikan penghijrahan baru-baru ini: tempat lahir atau negeri asal tidak sama dengan kediaman terakhir, lokasi keluarga semasa atau tempat seseorang mula menjadi gelandangan."},{"type":"p","text":"Etnik tidak direkodkan atau tidak diketahui bagi 268 catatan warganegara (26.4%). Komposisi etnik yang diperhatikan tidak dapat membuktikan risiko yang tidak seimbang tanpa penyebut populasi yang sepadan dan liputan operasi yang setara. Etnik tidak dianggarkan daripada nama."},{"type":"p","text":"Sumber: Dec 2023.xlsx · Profil · baris 7–693; Dec 2024.xlsx · Profil · baris 7–356; Dec 2025.xlsx · Profil · baris 7–691; Sept 2026.xlsx · Profil · baris 7–305. Medan: W kewarganegaraan; X etnik; AA negeri asal."}]},{"title":"10. Kes berulang, dikira menggunakan dua kaedah berbeza. Kod kekerapan pegawai mengukur sejarah pertemuan yang dilaporkan. Padanan merentas masa mengukur kejadian berulang yang dapat dilihat dalam fail ini. Kedua-duanya menjawab soalan berbeza dan tidak boleh saling menggantikan.","blocks":[{"type":"p","text":"21 Oktober 2026 — rekod berulang JKM berbanding jumlah gabungan. JKM mengkodkan 328 rekod (16.2%) sebagai pertemuan kali kedua, ketiga atau lebih daripada tiga. Padanan yang dibetulkan mengenal pasti 209 rekod tambahan yang tidak ditandakan sebagai berulang oleh JKM. Maka jumlah gabungan ialah 537 rekod dengan bukti kes berulang (26.6% daripada 2,021). Selepas dua catatan tambahan pada hari yang sama digabungkan, rekod ini mewakili 535 pertemuan identiti/tarikh yang berbeza. Ini ialah bilangan gabungan yang dapat dipertahankan mengikut peraturan dinyatakan, bukannya bancian individu berulang yang disahkan atau semua kemungkinan pertemuan semula yang tidak direkodkan."},{"type":"table","rows":[["Kod kekerapan pegawai","2023","2024","2025","2026 Jan–Sep","Jumlah"],["Pertama","470","240","647","293","1,650"],["Kedua","40","28","33","2","103"],["Ketiga","15","9","3","1","28"],["Lebih daripada tiga","124","70","2","1","197"],["Tidak direkodkan","38","3","0","2","43"],["Semua rekod","687","350","685","299","2,021"]]},{"type":"p","text":"Pecahan kekerapan sumber sepadan tepat: 1,650 pertama + 103 kedua + 28 ketiga + 197 lebih daripada tiga + 43 tidak direkodkan = 2,021 rekod. Subjumlah kes berulang ialah 103 + 28 + 197 = 328. Ini ialah subjumlah, bukannya kategori tambahan untuk dijumlahkan sekali lagi."},{"type":"p","text":"Catatan yang dikodkan pegawai sebagai kes berulang menurun daripada 179 daripada 687 (26.1%) pada 2023 dan 107 daripada 350 (30.6%) pada 2024 kepada 38 daripada 685 (5.5%) pada 2025 dan empat daripada 299 (1.3%) pada 2026. Angka ini sahaja seolah-olah menunjukkan peningkatan prestasi yang besar. Padanan identiti bercanggah dengan tafsiran mudah tersebut."},{"type":"table","rows":[["Kod kes berulang JKM berbanding padanan data: baris rekod","2023","2024","2025","2026 Jan–Sep","Jumlah"],["Rekod berkod berulang JKM (kedua, ketiga atau lebih)","179","107","38","4","328"],["Rekod dipadankan dengan tarikh lebih awal","50","63","107","78","298"],["Daripadanya: dilabel kali pertama","24","31","79","74","208"],["Daripada rekod dipadankan: sudah ditandakan JKM (pertindihan)","25","32","28","4","89"],["Daripadanya: kekerapan tidak direkodkan","1","0","0","0","1"],["Rekod tambahan dipadankan yang tidak ditandakan JKM","25","31","79","74","209"],["Rekod gabungan dengan bukti kes berulang (tanpa pengiraan berganda)","204","138","117","78","537"],["Bahagian rekod gabungan berulang daripada semua rekod kes","29.7%","39.4%","17.1%","26.1%","26.6%"]]},{"type":"p","text":"Daripada rekod tambahan yang dikenal pasti melalui padanan, 208 dikodkan kali pertama walaupun mempunyai tarikh lebih awal berdasarkan padanan dokumen. Baris ini melibatkan 160 kumpulan identiti yang dipadankan. Dalam kalangan semua 208 kumpulan berulang, 123 mempunyai setiap baris rekod dilabel kali pertama. Sebanyak 208 baris berkod kali pertama yang disyaki ini mewakili 12.6% daripada semua 1,650 baris berkod kali pertama. Ini ialah tanda untuk semakan sumber, bukannya kesilapan pentadbiran yang telah disahkan atau pengesahan bebas tentang kes berulang."},{"type":"table","rows":[["Audit kes berulang, tarikh selepas penggabungan catatan hari yang sama","2023","2024","2025","2026 Jan–Sep","Jumlah"],["Tarikh kemudian yang dipadankan","50","63","107","76","296"],["Daripadanya: dilabel kali pertama","24","31","79","72","206"],["Daripadanya: dilabel kali kedua atau seterusnya","25","32","28","4","89"],["Daripadanya: kekerapan tidak direkodkan","1","0","0","0","1"]]},{"type":"p","text":"Mengapa kedua-dua angka 206 dan 208 digunakan: dua kumpulan identiti pada tarikh kemudian pada 2026 masing-masing mempunyai satu baris tambahan pada hari yang sama, dan kedua-dua baris tambahan dikodkan sebagai kali pertama. Mengira satu catatan bagi setiap kumpulan/tarikh dipadankan memberikan 206 tarikh kemudian berkod kali pertama daripada 296 (69.6%). Mengekalkan setiap baris sumber memberikan 208 baris kemudian berkod kali pertama daripada 298 (69.8%). Kedua-dua baris tambahan ialah percanggahan hospital/dilepaskan yang dihuraikan di bawah. Ia tidak dikira sebagai tarikh kembali tambahan."},{"type":"p","text":"Kohort yang muncul berulang kali dapat diselaraskan sebagai 506 baris rekod = 208 kumpulan/tarikh pertama diperhatikan + 296 kumpulan/tarikh kemudian + 2 baris tambahan pada hari yang sama. Bagi keseluruhan set data, 2,021 baris = 1,722 kumpulan/tarikh awal + 296 kumpulan/tarikh kemudian + 3 baris tambahan pada hari yang sama. Satu baris tambahan pada hari yang sama berlaku dalam kumpulan yang hanya ditemui pada satu tarikh. Tarikh awal yang diperhatikan tidak semestinya pertemuan pertama sepanjang sejarah individu."},{"type":"p","text":"Menggabungkan kod kes berulang JKM dengan bukti padanan tanpa pengiraan berganda memberikan 328 rekod berkod berulang JKM + 209 rekod tambahan dipadankan = 537 rekod. Sebanyak 209 rekod tambahan itu terdiri daripada 208 rekod berkod kali pertama + 1 rekod tanpa kekerapan. Secara setara, 328 + 298 − 89 = 537, kerana 89 daripada 298 rekod kemudian yang dipadankan telah pun dikodkan berulang oleh JKM. Ini ialah 209 rekod lebih banyak daripada subjumlah kes berulang JKM, iaitu peningkatan 63.7%; 38.9% daripada rekod gabungan dengan bukti kes berulang tidak ditandakan sebagai berulang oleh JKM."},{"type":"p","text":"Terdapat 239 rekod berkod berulang JKM tanpa tarikh lebih awal yang dipadankan melalui dokumen dalam fail ini. Sejarah terdahulu mungkin mendahului Januari 2023, tiada dalam fail yang dibekalkan atau tidak mempunyai pengenal pasti yang boleh digunakan. Rekod ini kekal dalam jumlah gabungan kerana JKM merekodkannya secara jelas sebagai berulang. Oleh itu, padanan sahaja tidak menggantikan bilangan JKM: ia menambah bukti dan pertindihan dikeluarkan daripada pengiraan."},{"type":"p","text":"Unit pengiraan: sebanyak 537 baris sumber bersamaan 535 pertemuan identiti/tarikh yang berbeza selepas dua baris tambahan pada hari yang sama digabungkan. Pengiraan pertemuan ialah 328 + 296 − 89 = 535. Rekod ini melibatkan 425 kumpulan identiti calon yang dipadankan: 297 dengan sekurang-kurangnya satu kod berulang JKM, ditambah 208 dengan tarikh kemudian yang dipadankan, ditolak 80 kumpulan dalam kedua-dua set. Setiap kumpulan dikira sekali sepanjang keseluruhan tempoh. Sebanyak 425 kumpulan itu bukan individu unik yang disahkan secara bebas, dan bilangan kumpulan tahunan tidak boleh dijumlahkan. Sebanyak 208 kumpulan berbilang tarikh serta 506 barisnya kekal sebagai ukuran berbeza yang termasuk catatan pertama diperhatikan."},{"type":"p","text":"Terdapat 388 baris berkod kali pertama dalam keseluruhan kohort berulang, tetapi 180 daripadanya berada pada tarikh pertama kumpulan tersebut diperhatikan. Kesemuanya tidak boleh dianggap salah klasifikasi. Hanya 208 baris yang mempunyai tarikh lebih awal dipadankan menyokong tanda utama pertemuan semula berkod kali pertama."},{"type":"p","text":"Satu peringkat semakan berasingan menemukan 34 baris tambahan berkod kali pertama dengan padanan tepat nama berbilang perkataan yang diseragamkan, tahun lahir, jantina dan kewarganegaraan dengan rekod lebih awal dalam kumpulan padanan dokumen yang berbeza: sembilan pada 2023, tujuh pada 2024, 15 pada 2025 dan tiga pada 2026. Ini mungkin mencerminkan dokumen yang hilang atau tersalah taip, atau individu berbeza dengan demografi yang sama. Rekod ini disediakan dalam possible-repeat-name-matches.csv dan dikecualikan daripada angka utama 208, 296 dan 537. Tiada padanan ejaan hampir sama digunakan."},{"type":"li","text":"Peraturan padanan: nilai dokumen yang sama tepat selepas penyeragaman dalam lajur IC/MyKid Q membentuk satu kumpulan identiti. Nilai angka Q sepanjang sebelas digit ditambah sifar di hadapan supaya menjadi 12 digit bagi mengekalkan sifar awal yang berkemungkinan telah hilang. Nilai dokumen alternatif atau UNHCR yang sama tepat dalam R/AE memerlukan padanan tepat nama yang diseragamkan sebagai sokongan. Padanan turut mengenal pasti dokumen yang sama selepas penyeragaman bersama nama yang sama tepat selepas penyeragaman merentas Q, R dan AE. Nama sahaja tidak menggabungkan rekod, dan padanan ejaan hampir sama tidak digunakan."},{"type":"li","text":"Kejadian berulang yang diperhatikan: 208 kumpulan dipadankan muncul pada lebih daripada satu tarikh operasi. Kumpulan ini mengandungi 506 baris rekod merentasi 504 gabungan kumpulan/tarikh: 208 tarikh pertama diperhatikan dan 296 tarikh berikutnya. Daripada kumpulan ini, 102 muncul dalam lebih daripada satu tahun kalendar."},{"type":"li","text":"Semakan lebih terhad menggunakan dokumen sahaja: lajur IC/MyKid sahaja mengandungi 1,022 baris berisi dan 821 nilai berbeza selepas penyeragaman. Daripada kumpulan dokumen tersebut, 141 muncul semula pada tarikh berbeza, melibatkan 342 baris. Hasil yang lebih terhad ini tidak bergantung pada padanan dokumen alternatif/nama."},{"type":"li","text":"Ketidakpadanan label selepas penggabungan catatan hari yang sama: daripada 296 pertemuan pada tarikh kemudian, 206 (69.6%) masih dilabel “kali pertama”, 89 dilabel kali kedua atau seterusnya dan satu tiada kekerapan. Selain itu, 205 daripada catatan kemudian yang digabungkan ini ditandakan “baharu” dalam medan status kes yang berasingan. Bilangan baris asal berkod kali pertama ialah 208, seperti yang diselaraskan di atas."},{"type":"li","text":"Ketidakpadanan pada 2026: 76 catatan ialah pertemuan pada tarikh kemudian dalam pengelompokan merentas masa, dan 72 daripadanya dilabel “kali pertama”. Enam puluh tiga kumpulan dipadankan yang direkodkan pada 2026 telah pun wujud pada tahun lebih awal, menyumbang 71 daripada 299 baris tahun tersebut."},{"type":"li","text":"Batasan: 431 baris tidak mempunyai dokumen yang boleh digunakan di bawah peraturan ini. Variasi ejaan boleh memisahkan individu yang sama kepada beberapa kumpulan, manakala kesilapan kemasukan data atau perkongsian dokumen boleh menggabungkan individu berbeza. Satu kumpulan dipadankan melalui Q mempunyai kod jantina tidak konsisten, dan 48 kumpulan dipadankan melalui Q mempunyai variasi nama. Oleh itu, 1,722 kumpulan yang terhasil bukan bilangan individu unik yang telah disahkan."},{"type":"li","text":"Kes berulang terdahulu kekal relevan: 216 baris yang dikodkan pegawai sebagai berulang berada dalam kumpulan dengan hanya satu baris yang diperhatikan di sini. Pertemuan terdahulu mungkin berlaku sebelum tempoh fail, tiada dalam fail atau tiada dokumen yang boleh dipadankan. Satu baris sahaja yang diperhatikan tidak membuktikan kes kali pertama sepanjang sejarah individu."},{"type":"table","rows":[["Padanan dalam tahun yang sama sahaja","2023","2024","2025","2026 Jan–Sep","Perbandingan seluruh tempoh (bukan hasil tambah)"],["Kumpulan yang muncul pada beberapa tarikh dalam tahun tersebut","38","28","61","13","208 sepanjang keseluruhan tempoh"],["Baris dalam kumpulan tersebut","88","69","145","27","506 sepanjang keseluruhan tempoh"],["Tarikh berbeza berikutnya dalam tahun tersebut","50","41","84","13","188 pertemuan semula dalam tahun yang sama; 296 termasuk pertemuan semula merentas tahun"]]},{"type":"p","text":"Median sela antara tarikh pemerhatian berturutan dalam kumpulan dipadankan ialah 132 hari, dengan julat satu hingga 1,228 hari. Enam puluh tiga daripada 296 sela pertemuan semula ialah 30 hari atau kurang, 125 ialah 90 hari atau kurang dan 243 ialah 365 hari atau kurang. Ini ialah sela antara pertemuan yang diperhatikan. Ia tidak mengukur hari tanpa tempat tinggal, tempoh berterusan di jalanan atau masa sejak discaj kecuali peristiwa tersebut direkodkan secara jelas."},{"type":"p","text":"Dalam catatan sejurus sebelum 296 pertemuan semula ini, tindakan utama yang direkodkan termasuk dilepaskan bagi 123, penempatan NGO bagi 25, penyerahan imigresen bagi 14, perintah institusi sementara bagi sepuluh dan rujukan hospital bagi enam. Bilangan ini menunjukkan pertemuan semula selepas tindakan tersebut direkodkan. Ia tidak membuktikan kadar kegagalan perkhidmatan kerana tempoh susulan, kehadiran yang disempurnakan, sokongan lain dan penyebut yang setara tidak tersedia."},{"type":"p","text":"Sumber: Dec 2023.xlsx · Profil · baris 7–693; Dec 2024.xlsx · Profil · baris 7–356; Dec 2025.xlsx · Profil · baris 7–691; Sept 2026.xlsx · Profil · baris 7–305. Medan: pengenal pasti Q/R/AE dan nama P untuk padanan setempat sahaja; J tarikh; AH kekerapan; AG status; AO tindakan."}]},{"title":"11. Contoh perjalanan kes individu yang berulang. Contoh berikut menggunakan kumpulan berkod samaran dan rujukan baris sumber. Ia menggambarkan rekod tanpa mendedahkan nama atau nombor pengenalan.","blocks":[{"type":"table","rows":[["Kumpulan P1028: tarikh pada 2025","Baris sumber","Kategori yang direkodkan","Tindakan utama yang direkodkan","Kekerapan"],["2025-02-23","114","Gelandangan","Lain-lain (Nyatakan)","Pertama"],["2025-04-30","200","Gelandangan","Dilepaskan","Pertama"],["2025-05-18","326","Gelandangan","Lain-lain (Nyatakan)","Pertama"],["2025-05-21","388","Peleser","Lain-lain (Nyatakan)","Pertama"],["2025-10-15","588","Gelandangan","Lain-lain (Nyatakan)","Pertama"],["2025-11-26","646","Gelandangan","Diperintah tahan sementara di Desa Bina Diri/Pusat Sehenti Bina Diri-Sek. 3(2)","Pertama"]]},{"type":"p","text":"P1028 direkodkan sebagai warganegara Malaysia berumur 57 tahun pada enam tarikh dalam 2025. Kesemua enam rekod menyatakan “kali pertama”. Kategori berubah sekali kepada Peleser dan kemudian kembali kepada gelandangan. Catatan terakhir yang diperhatikan merekodkan perintah sementara Desa Bina Diri/Pusat Sehenti Bina Diri. Ini ialah contoh nyata kejadian berulang dan perubahan pengelasan yang tidak kelihatan melalui jumlah kod berulang semata-mata."},{"type":"p","text":"P0504 ialah kumpulan orang dewasa bukan warganegara yang dipadankan melalui dokumen alternatif serta nama yang sama tepat selepas penyeragaman merentasi keempat-empat tahun: baris 546 dan 675 pada 2023, baris 312 pada 2024, baris 241 pada 2025 dan baris 29 pada 2026. Dokumen yang dikongsi turut muncul pada kanak-kanak dengan nama berbeza, yang dikekalkan berasingan. Tahun lahir orang dewasa tersebut tidak konsisten pada satu catatan. Ini menggambarkan kemunculan berterusan merentas tahun dan keperluan mengelakkan penggabungan berlebihan melalui kad keluarga."},{"type":"p","text":"Dua pasangan identiti/tarikh pada 24 September 2026 mempunyai tindakan utama yang bercanggah: baris 220 dan 272, serta baris 228 dan 273 dalam profil 2026. Dalam setiap pasangan, satu baris merekodkan rujukan hospital dan satu lagi pelepasan. Tanpa turutan waktu atau nota kes sokongan, tindakan akhir tidak dapat ditentukan. Pasangan ini dikekalkan dalam audit kualiti."}]},{"title":"12. Petunjuk kesihatan mental dan ketidakupayaan mental. Bilangan kesihatan mental sengaja menggabungkan beberapa petunjuk berbeza tanpa menyamakannya. Kod penyakit, keperluan yang dinilai, faktor penyebab yang dinyatakan dan kategori OKU mental ialah jenis catatan yang berbeza.","blocks":[{"type":"table","rows":[["Petunjuk kesihatan mental","2023","2024","2025","2026 Jan–Sep","Jumlah"],["Medan penyakit dikodkan secara jelas sebagai Mental","5","0","11","33","49"],["Medan ketidakupayaan dikodkan sebagai Mental","1","0","8","2","11"],["Penyakit mental direkodkan sebagai faktor","1","0","6","1","8"],["Pemulihan mental direkodkan sebagai keperluan","2","1","4","0","7"],["Mental disebut dalam medan naratif terpilih","0","2","3","0","5"],["Mana-mana petunjuk ini, dikira sekali bagi setiap baris","5","2","14","35","56"]]},{"type":"p","text":"Baris petunjuk bertindih dan tidak boleh dijumlahkan. Medan naratif terpilih ialah AK, AN, AP dan AW. Penyakit mental yang disyaki dikekalkan sebagai petunjuk, bukan dinaik taraf kepada diagnosis yang disahkan. Fail ini tidak menyediakan diagnosis psikiatri piawai, hasil penilaian klinikal, tahap keterukan, penilaian keupayaan membuat keputusan atau sejarah ubat."},{"type":"p","text":"Terdapat 49 rekod yang dikodkan secara jelas sebagai Mental dalam medan penyakit dan 56 dengan mana-mana petunjuk kesihatan mental. Sebanyak 56 baris ini berada dalam 52 kumpulan dipadankan mengikut peraturan yang dinyatakan. Median umur yang dilaporkan ialah 54, dengan 16 berumur 60 tahun atau lebih dan empat tiada umur. Terdapat 47 catatan warganegara dan sembilan bukan warganegara; 37 direkodkan sebagai lelaki, 18 perempuan dan satu tiada jantina."},{"type":"p","text":"Bilangan petunjuk kesihatan mental yang lebih luas berubah daripada lima rekod pada 2023 kepada dua pada 2024, 14 pada 2025 dan 35 pada 2026. Pada 2026, 32 daripada 35 berlaku pada 24 September; kesemua 32 mempunyai kod penyakit Mental. Hari itu sahaja merangkumi 57.1% daripada semua 56 baris petunjuk kesihatan mental sepanjang keseluruhan tempoh. Ini mungkin mencerminkan individu yang ditemui, amalan saringan atau pencatatan, serta penumpuan operasi. Fail ini tidak dapat memisahkan penjelasan tersebut atau membuktikan trend prevalens seluruh bandar."},{"type":"table","rows":[["Tindakan utama bagi baris dengan petunjuk kesihatan mental","2023","2024","2025","2026 Jan–Sep","Jumlah"],["Rujukan hospital","0","1","4","27","32"],["Dilepaskan","0","1","2","1","4"],["Penyerahan kepada imigresen","0","0","2","6","8"],["Dikembalikan kepada keluarga","1","0","0","0","1"],["Tindakan lain","0","0","6","1","7"],["Tiada tindakan direkodkan","4","0","0","0","4"]]},{"type":"p","text":"Dalam 56 rekod ini, 32 mempunyai tindakan utama rujukan hospital, lapan penyerahan imigresen, tujuh tindakan lain, empat dilepaskan, satu dikembalikan kepada keluarga dan empat tiada tindakan direkodkan. Pada 2026, tindakan berkaitan ialah 27 rujukan hospital, enam penyerahan imigresen, satu dilepaskan dan satu tindakan lain. Ini ialah laluan atau syor yang direkodkan. Ia tidak membuktikan kemasukan hospital, rawatan yang selesai, peningkatan klinikal, discaj yang selamat atau proses imigresen yang selesai."},{"type":"p","text":"Satu lagi perbezaan perlu diberi perhatian: 11 baris mempunyai kod ketidakupayaan mental, dan sembilan daripadanya turut mempunyai kod penyakit Mental. Tiga puluh dua baris petunjuk kesihatan mental dikodkan “Tiada/Normal” dalam medan ketidakupayaan, semuanya pada 2026. Penyakit mental tidak secara automatik bermaksud ketidakupayaan mental yang berdaftar. Gabungan ini mungkin perbezaan yang sah atau pencatatan yang tidak konsisten; fail ini tidak memberikan kepastian. Tiada individu dikelaskan semula sebagai OKU semata-mata kerana terdapat petunjuk kesihatan mental."},{"type":"p","text":"Hanya tujuh daripada 56 baris petunjuk kesihatan mental merekodkan pemulihan mental sebagai keperluan utama, manakala 36 mempunyai keperluan utama tidak diketahui. Ini menunjukkan jurang dokumentasi antara petunjuk kesihatan mental dan medan keperluan. Ia tidak membuktikan bahawa tiada penilaian atau sokongan berlaku di luar hamparan."},{"type":"p","text":"Sumber: Dec 2023.xlsx · Profil · baris 7–693; Dec 2024.xlsx · Profil · baris 7–356; Dec 2025.xlsx · Profil · baris 7–691; Sept 2026.xlsx · Profil · baris 7–305. Medan: AV penyakit; AX ketidakupayaan; AJ faktor; AM keperluan; AK/AN/AP/AW naratif; AO tindakan utama; J tarikh."}]},{"title":"13. OKU dan ketidakupayaan lain. Bilangan utama berkaitan OKU merangkumi kod medan ketidakupayaan 2–8. Hamparan tidak membezakan secara konsisten status OKU berdaftar dengan keterangan ketidakupayaan yang direkodkan; oleh itu laporan menggunakan istilah rekod ketidakupayaan berkod.","blocks":[{"type":"table","rows":[["Ketidakupayaan berkod","2023","2024","2025","2026 Jan–Sep","Jumlah"],["Fizikal","3","9","17","8","37"],["Mental","1","0","8","2","11"],["Masalah pembelajaran","1","4","2","2","9"],["Penglihatan","0","1","2","3","6"],["Pendengaran","1","1","1","1","4"],["Pelbagai","0","0","1","0","1"],["Pertuturan","0","0","0","0","0"],["Semua ketidakupayaan berkod","6","15","31","16","68"],["Tiada ketidakupayaan / Normal","1","59","403","262","725"],["Tidak direkodkan atau tidak diketahui","680","276","251","21","1,228"]]},{"type":"p","text":"Sebanyak 68 rekod ketidakupayaan berkod berada dalam 65 kumpulan dipadankan: 39 catatan warganegara dan 29 bukan warganegara. Ketidakupayaan fizikal ialah kategori terbesar dengan 37 rekod, diikuti ketidakupayaan mental dengan 11 dan masalah pembelajaran dengan sembilan. Masalah pembelajaran dikekalkan berasingan daripada bilangan ketidakupayaan mental dan penyakit mental. Satu catatan ketidakupayaan pelbagai tidak menyatakan komponennya, maka ia tidak dapat dimasukkan ke subkategori fizikal dan mental."},{"type":"p","text":"Pencatatan ketidakupayaan berubah dengan amat ketara. Pada 2023, 680 daripada 687 medan ketidakupayaan kosong; hanya tujuh mempunyai kod normal atau ketidakupayaan. Pada 2026, hanya 21 daripada 299 kosong atau tidak diketahui. Oleh itu, kenaikan yang kelihatan daripada enam kepada 16 ketidakupayaan berkod tidak boleh ditafsirkan sebagai peningkatan prevalens yang boleh dipercayai. Dalam semua rekod, 1,228 catatan (60.8%) tidak mempunyai status ketidakupayaan yang boleh digunakan."},{"type":"table","rows":[["Tindakan utama yang direkodkan","Semua baris ketidakupayaan berkod","Baris ketidakupayaan fizikal","Baris ketidakupayaan mental"],["Dilepaskan","40","27","2"],["Rujukan hospital","6","0","6"],["Perintah institusi sementara, RSK","2","2","0"],["Perintah institusi sementara, DBD/PSBD","8","5","0"],["Penyerahan kepada imigresen","3","1","1"],["Dikembalikan kepada keluarga","1","0","1"],["Penempatan NGO","1","0","0"],["Penyerahan kepada Pelindung","1","0","0"],["Tindakan lain","3","1","1"],["Tiada tindakan utama","3","1","0"]]},{"type":"p","text":"Empat puluh daripada 68 rekod ketidakupayaan berkod (58.8%) mempunyai pelepasan sebagai tindakan utama. Bagi ketidakupayaan fizikal, angkanya ialah 27 daripada 37 (73.0%). Catatan ketidakupayaan fizikal termasuk 22 rekod bukan warganegara dan 15 warganegara, dan 24 dikelaskan sebagai pengemis. Catatan ketidakupayaan mental lebih kerap merekodkan rujukan hospital: enam daripada 11. Pelepasan tidak membuktikan bahawa tempat tinggal, peralatan, pengangkutan, penjagaan atau susulan tidak diperlukan atau telah disediakan."},{"type":"p","text":"Tiga baris lain mengandungi keterangan jelas berkaitan ketidakupayaan dalam naratif terpilih tanpa kod ketidakupayaan substantif: baris 97 dan 107 pada 2023 serta baris 338 pada 2024. Ia disenaraikan berasingan dalam audit kualiti dan tidak ditambah secara senyap kepada jumlah ketidakupayaan berkod. Sakit, kaki lemah, penyakit atau usia tua tidak secara automatik dikelaskan sebagai ketidakupayaan."},{"type":"p","text":"Sumber: Dec 2023.xlsx · Profil · baris 7–693; Dec 2024.xlsx · Profil · baris 7–356; Dec 2025.xlsx · Profil · baris 7–691; Sept 2026.xlsx · Profil · baris 7–305. Medan: AX ketidakupayaan; AW/AK keterangan naratif; W kewarganegaraan; AF kategori; AO tindakan utama."}]},{"title":"14. Keperluan kesihatan lain dan maklumat penggunaan dadah/bahan. Maklumat kesihatan ini bukan daftar klinikal. Banyak rekod hanya menyatakan “sihat”, “tidak sihat” atau “tidak diketahui”, dan diagnosis tidak disahkan secara bebas.","blocks":[{"type":"table","rows":[["Medan status kesihatan","2023","2024","2025","2026 Jan–Sep","Jumlah"],["Sihat","558","3","415","227","1,203"],["Tidak sihat / masalah kesihatan","24","20","48","71","163"],["Dinyatakan sebagai tidak diketahui","101","327","134","0","562"],["Kosong","4","0","88","1","93"]]},{"type":"p","text":"Terdapat 163 catatan direkodkan sebagai tidak sihat, 1,203 sebagai sihat dan 655 dengan status kesihatan tidak diketahui atau kosong. Pencatatan kesihatan amat tidak lengkap pada 2024: 327 daripada 350 (93.4%) tidak diketahui. Pada 2026, 71 daripada 299 (23.7%) dikodkan tidak sihat dan hanya satu medan status kesihatan kosong. Perubahan kelengkapan pencatatan terlalu besar untuk mentafsir bilangan penyakit tahunan mentah sebagai insiden penyakit."},{"type":"p","text":"Selain kesihatan mental, medan penyakit berstruktur merekodkan HIV pada enam baris dan Hepatitis B pada tiga. Catatan naratif turut menyebut diabetes, hipertensi, masalah jantung dan buah pinggang, asma, strok, patah tulang atau kesukaran bergerak, masalah kulit, gout dan kebergantungan alkohol. Lapan baris 2025 menyebut Hepatitis C tanpa keputusan negatif yang jelas. Satu baris berasingan menyatakan Hep C dan HIV negatif secara jelas dan dikecualikan daripada bilangan sebutan Hepatitis C positif/tidak dinyatakan itu. Satu catatan 2024 menyatakan tuberkulosis yang disyaki; ini tidak dianggap kes yang disahkan. Satu sebutan HIV dalam naratif tidak ditambah terus kepada bilangan HIV berstruktur kerana medan mungkin bertindih."},{"type":"table","rows":[["Medan penggunaan dadah","2023","2024","2025","2026 Jan–Sep","Jumlah"],["Tidak pernah menggunakan, seperti direkodkan","201","2","44","185","432"],["Sedang menggunakan","3","1","6","9","19"],["Bekas pengguna","1","2","6","9","18"],["Tidak diketahui atau kosong","482","345","629","96","1,552"]]},{"type":"p","text":"Hanya 19 rekod menyatakan penggunaan dadah semasa secara jelas dan 18 menyatakan bekas pengguna. Status tidak diketahui atau kosong melibatkan 1,552 daripada 2,021 baris (76.8%). Fail ini tidak menyokong kesimpulan bahawa penggunaan dadah jarang berlaku atau merupakan punca utama kes. Keperluan berkaitan dadah, catatan penyakit dan laluan AADK mungkin muncul pada baris yang medan penggunaan dadahnya tidak dilengkapkan."},{"type":"p","text":"Medan tindakan utama merekodkan 52 rujukan hospital. Pada 2025, butiran “tindakan lain” turut merekodkan 34 laluan KKM dan tiga rujukan klinik berhampiran. Mengira laluan kesihatan yang direkodkan secara jelas ini menghasilkan 89 baris sepanjang tempoh, berbanding hanya 52. Ini menunjukkan bahawa bergantung pada kod tindakan utama sahaja akan terlepas laluan berkaitan kesihatan. Angka ini bukan bilangan 89 rawatan yang selesai."},{"type":"p","text":"Sumber: Dec 2023.xlsx · Profil · baris 7–693; Dec 2024.xlsx · Profil · baris 7–356; Dec 2025.xlsx · Profil · baris 7–691; Sept 2026.xlsx · Profil · baris 7–305. Medan: AU status kesihatan; AV kod penyakit; AW naratif penyakit; AY penggunaan dadah; AO/AP tindakan."}]},{"title":"15. Sebab menjadi kes dan keperluan yang dinyatakan. Setiap medan sumber menyediakan satu kategori utama, sedangkan seseorang mungkin mempunyai beberapa masalah serentak. Jadual menerangkan sebab dan keutamaan yang direkodkan, bukannya anggaran hubungan sebab-akibat.","blocks":[{"type":"table","rows":[["Faktor utama yang direkodkan","2023","2024","2025","2026 Jan–Sep","Jumlah"],["Tiada pekerjaan","127","321","47","72","567"],["Pendapatan rendah","8","0","8","3","19"],["Kemiskinan","417","10","3","1","431"],["Tiada tempat tinggal","24","7","132","133","296"],["Penolakan keluarga","0","0","2","0","2"],["Penyakit mental","1","0","6","1","8"],["Masalah kesihatan lain","3","1","5","2","11"],["Ketagihan dadah","2","0","11","0","13"],["Bekas banduan","0","0","1","0","1"],["Lain-lain","1","4","26","16","47"],["Tidak diketahui atau kosong","104","7","444","71","626"]]},{"type":"p","text":"Tiada pekerjaan (567), kemiskinan (431) dan tiada tempat tinggal (296) ialah kategori faktor substantif terbesar. Namun, pengkodannya berubah dengan mendadak: kemiskinan mendominasi pada 2023 (417 daripada 687), tiada pekerjaan pada 2024 (321 daripada 350), sebab tidak diketahui pada 2025 (444 termasuk satu kosong), dan tiada tempat tinggal pada 2026 (133 daripada 299). Perubahan ini mungkin mencerminkan perubahan kes dan kemasukan data. Bukti tidak menunjukkan bahawa kemiskinan tidak lagi menjadi masalah atau pengangguran meningkat kemudian hilang."},{"type":"table","rows":[["Keperluan utama yang direkodkan","2023","2024","2025","2026 Jan–Sep","Jumlah"],["Tempat tinggal","17","8","99","137","261"],["Pekerjaan","49","11","6","30","96"],["Bantuan pulang ke tempat asal","179","5","1","2","187"],["Rawatan perubatan","1","2","17","8","28"],["Pemulihan mental","2","1","4","0","7"],["Pemulihan dadah","1","0","5","2","8"],["Psikologi / kaunseling","2","0","0","1","3"],["Pemulihan alkohol","0","0","0","0","0"],["Lain-lain","0","2","13","1","16"],["Tiada","304","1","35","30","370"],["Tidak diketahui atau kosong","132","320","505","88","1,045"]]},{"type":"p","text":"Keperluan tidak diketahui atau kosong melibatkan 1,045 rekod (51.7%). Nilai “tiada” yang direkodkan (370 baris) dikekalkan berasingan daripada maklumat yang hilang. Tempat tinggal ialah keperluan substantif utama dengan 261 baris, termasuk 137 pada 2026. Daripada 261 baris keperluan tempat tinggal itu, 226 ialah warganegara dan 126 mempunyai umur yang dilaporkan sekurang-kurangnya 60 tahun."},{"type":"p","text":"Bagi 261 rekod keperluan tempat tinggal, tindakan utama ialah perintah institusi sementara bagi 105, penempatan NGO bagi 58, dilepaskan bagi 44, penyerahan imigresen bagi 23, tindakan lain bagi 13, rujukan hospital bagi sepuluh, perintah institusi tetap bagi tiga, dikembalikan kepada keluarga bagi satu dan kosong bagi empat. Ini ialah laluan segera; tiada satu pun membuktikan tempat tinggal yang berkekalan. Sebanyak 44 pelepasan itu wajar disemak untuk mengetahui tempat tinggal atau susulan yang diatur, dan tidak secara automatik dilabel sebagai pelepasan yang tidak sesuai."},{"type":"p","text":"Tempoh yang direkodkan juga berubah sehingga trend gelandangan kronik tidak boleh ditafsirkan secara mudah. Pada 2023, 594 baris (86.5%) menggunakan kategori tempoh 1–2 tahun. Pada 2024, 194 baris menggunakan 1–2 bulan. Pada 2025, 347 medan tempoh tidak diketahui atau kosong, meningkat kepada 212 daripada 299 pada 2026 (70.9%). Ini mungkin mencerminkan komposisi kes, nilai lalai, penilaian terhad atau amalan pencatatan lain. Ia tidak dapat membuktikan bahawa gelandangan jangka panjang telah dihapuskan."},{"type":"p","text":"Sumber: Dec 2023.xlsx · Profil · baris 7–693; Dec 2024.xlsx · Profil · baris 7–356; Dec 2025.xlsx · Profil · baris 7–691; Sept 2026.xlsx · Profil · baris 7–305. Medan: AJ/AK faktor; AL tempoh; AM/AN keperluan; AO tindakan."}]},{"title":"16. Lokasi individu ditemui semasa operasi. Kawasan parlimen dan lokasi operasi menunjukkan tempat pertemuan direkodkan. Ia bukan alamat kediaman atau kadar prevalens mengikut kawasan. Catatan kawasan luas atau berbilang lokasi tidak diagihkan secara andaian kepada jalan tertentu.","blocks":[{"type":"table","rows":[["Medan parlimen","2023","2024","2025","2026 Jan–Sep","Jumlah"],["P120 Bukit Bintang","473","131","144","250","998"],["P119 Titiwangsa","100","176","479","14","769"],["P117 Segambut","56","8","0","1","65"],["P121 Lembah Pantai","18","21","4","15","58"],["W.P. Kuala Lumpur","0","0","47","0","47"],["P122 Seputeh","14","5","0","0","19"],["P123 Cheras","9","1","5","2","17"],["P114 Kepong","2","1","1","7","11"],["P116 Wangsa Maju","4","1","3","3","11"],["P115 Batu","7","1","1","1","10"],["P124 Bandar Tun Razak","2","0","1","6","9"],["P118 Setiawangsa","2","5","0","0","7"]]},{"type":"p","text":"Bukit Bintang merangkumi 998 rekod (49.4%) dan Titiwangsa 769 (38.1%). Bersama-sama, kedua-dua label ini meliputi 1,767 daripada 2,021 baris (87.4%). Bukit Bintang mendominasi pada 2023 dan 2026; Titiwangsa mendominasi pada 2024 dan 2025. Peralihan ketara ini mungkin mencerminkan sasaran operasi atau pengkodan, selain taburan individu."},{"type":"table","rows":[["Label lokasi khusus yang diseragamkan","2023","2024","2025","2026 Jan–Sep","Jumlah"],["BUKIT BINTANG","214","32","6","131","383"],["JALAN TUANKU ABDUL RAHMAN","54","46","0","0","100"],["CHOW KIT/JALAN TAR","0","65","0","0","65"],["MASJID INDIA","49","0","0","0","49"],["CHOW KIT","30","12","5","0","47"],["KOTA RAYA","31","5","4","0","40"],["MASJID DANG WANGI","17","13","0","0","30"],["MASJID BANGSAR","12","7","0","8","27"],["MASJID KAMPUNG BHARU","10","15","0","0","25"],["DANG WANGI","24","0","0","0","24"],["LEBUH PUDU","0","0","22","2","24"],["MASJID JAMEK","14","8","0","0","22"],["PASAR MALAM JALAN KUCHING","15","0","0","6","21"],["MASJID TTDI","21","0","0","0","21"],["PASAR CHOW KIT","6","14","0","0","20"],["BAZAAR RAMADAN JALAN RAJA ALANG","0","19","0","0","19"],["LRT PASAR SENI","6","10","0","0","16"],["JALAN LUMUT","0","1","1","14","16"]]},{"type":"p","text":"Label khusus paling banyak ialah Bukit Bintang (383), Jalan Tuanku Abdul Rahman/Jalan TAR (100), catatan gabungan Chow Kit/Jalan TAR (65), Masjid India (49), Chow Kit (47) dan Kota Raya (40). Chow Kit, Jalan TAR, Masjid India, Kota Raya, Dang Wangi, Pudu dan lokasi transit membentuk corak pusat bandar yang berulang, tetapi catatan gabungan tidak dikira sekali lagi bagi setiap jalan komponennya."},{"type":"p","text":"Ketepatan lokasi merosot dengan ketara pada 2025: 601 daripada 685 catatan (87.7%) hanya menyatakan Bandar Kuala Lumpur atau Kuala Lumpur. Sebanyak 110 lagi daripada 299 (36.8%) bersifat umum pada 2026. Dalam keseluruhan set data, 711 baris tidak mempunyai lokasi khusus, ditambah satu lokasi kosong pada 2025. Oleh itu, pemeringkatan kawasan tumpuan terperinci mengikut jalan berdasarkan 2025 sahaja akan mengelirukan. Label Bukit Bintang pada 2026 merangkumi kawasan luas, bukannya koordinat tepat."},{"type":"p","text":"Tempat ibadat, pasar malam, bazar dan lokasi transit muncul berulang kali dalam label khusus. Label bazar Ramadan/Aidilfitri yang jelas dan catatan mengemis hanya pada bulan puasa menunjukkan sesetengah aktiviti mungkin berkaitan dengan konteks tertentu. Data tidak membuktikan kesan bermusim yang berulang kerana komposisi dan keamatan operasi berbeza dengan ketara."},{"type":"p","text":"Sumber: Dec 2023.xlsx · Profil · baris 7–693; Dec 2024.xlsx · Profil · baris 7–356; Dec 2025.xlsx · Profil · baris 7–691; Sept 2026.xlsx · Profil · baris 7–305. Medan: F kawasan parlimen; I lokasi operasi. Penyeragaman menggabungkan variasi huruf besar/kecil, jarak, Jln/Jalan, Kotaraya/Kota Raya dan variasi Jalan TAR yang jelas; tempat ibadat berbeza dan label lokasi gabungan kekal berasingan."}]},{"title":"17. Tindakan seterusnya dalam rekod. Medan tindakan utama berlabel “jenis tindakan/syor oleh pegawai kes”. Nilai yang direkodkan mungkin tindakan atau syor. Keputusan mahkamah dan tarikh penutupan ialah medan berasingan dan tidak secara automatik mengesahkan bahawa laluan yang disyorkan telah disempurnakan.","blocks":[{"type":"table","rows":[["Tindakan utama atau syor","2023","2024","2025","2026 Jan–Sep","Jumlah"],["Dilepaskan","184","312","211","124","831"],["Tindakan lain / laluan agensi","0","0","248","14","262"],["Penyerahan kepada imigresen","0","0","110","35","145"],["Perintah sementara: DBD/PSBD","12","1","14","76","103"],["Perintah sementara: RSK","0","4","23","0","27"],["Penempatan jagaan NGO","0","6","56","0","62"],["Rujukan hospital","1","4","4","43","52"],["Penyerahan kepada Pelindung","20","8","5","0","33"],["Dikembalikan kepada keluarga","3","7","8","1","19"],["Perintah tetap: RSK","1","1","0","0","2"],["Perintah tetap: DBD/PSBD","0","0","0","3","3"],["Meninggalkan lokasi sebelum tindakan diambil","0","0","1","2","3"],["Penyerahan kepada polis","0","0","1","0","1"],["Tidak diketahui atau kosong","466","7","4","1","478"]]},{"type":"p","text":"Dilepaskan ialah tindakan utama paling banyak direkodkan, dengan 831 baris (41.1% daripada keseluruhan set data). Tindakan tidak diketahui atau kosong pada 478 baris (23.7%), termasuk 466 daripada 687 pada 2023. Dalam kalangan baris dengan tindakan utama substantif, dilepaskan merangkumi 831 daripada 1,543 (53.9%). Peratusan pelepasan seluruh tempoh tidak wajar ditafsirkan sebagai trend dasar yang boleh dipercayai kerana pencatatan tindakan pada 2023 tidak lengkap."},{"type":"p","text":"Pada 2026, tindakan utama termasuk 124 dilepaskan, 76 perintah sementara DBD/PSBD, tiga perintah tetap DBD/PSBD, 43 rujukan hospital dan 35 penyerahan imigresen. Oleh itu, kod tindakan perintah institusi merangkumi 79 daripada 299 catatan (26.4%), berbanding 37 daripada 685 (5.4%) pada 2025. Rujukan hospital meningkat daripada empat pada 2025 kepada 43 pada 2026, walaupun laluan KKM/klinik tambahan pada 2025 mengecilkan perbezaan bagi laluan kesihatan yang lebih luas."},{"type":"table","rows":[["Butiran dalam 248 baris “tindakan lain” pada 2025","Bilangan"],["JWP / Diserah ke JWP","114"],["YKN / Rujuk ke YKN","35"],["KKM","34"],["PKG / Rujuk ke PKG / Pusat Khidmat Geladangan","22"],["MKN","19"],["AADK / AADK Dang Wangi","17"],["Rujukan klinik berhampiran","3"],["Catatan tempat tinggal sahaja","1"],["Naratif perintah sementara RSK","1"],["Tiada butiran tindakan lain","2"]]},{"type":"p","text":"Akronim dikekalkan seperti yang dimasukkan. Organisasi dan keterangan berbeza dalam medan teks bebas “lain-lain” tidak semuanya ditafsirkan sebagai rawatan, tempat tinggal atau penyelesaian kes. Jadual ini terhad kepada baris yang tindakan utamanya benar-benar “lain-lain”; oleh itu ia berbeza sedikit daripada jumlah medan teks bebas bagi semua baris."},{"type":"p","text":"Medan peringkat mahkamah yang berasingan merekodkan peringkat Mahkamah Majistret pada 137 baris, tetapi hanya 35 baris mempunyai nilai keputusan mahkamah: 19 keputusan sementara DBD/PSBD dan 16 keputusan sementara RSK. Daripada 135 baris dengan kod perintah institusi dalam medan tindakan utama, 100 tidak mempunyai medan keputusan mahkamah yang diisi. Hamparan ini tidak dapat membuktikan bahawa semua laluan yang dicadangkan atau direkodkan itu ialah keputusan mahkamah yang disahkan. Rujukan seksyen sumber dikekalkan sebagai label; laporan ini tidak memberikan tafsiran undang-undang bagi peruntukan tersebut."},{"type":"table","rows":[["Pencatatan pentadbiran","2023","2024","2025","2026 Jan–Sep","Jumlah"],["Tarikh penutupan/tamat diisi","78","350","684","286","1,398"],["Tarikh penutupan sama dengan hari operasi","75","326","570","46","1,017"],["Tarikh penutupan pada hari berikutnya","0","2","108","204","314"],["Status dinyatakan secara jelas sebagai selesai/tamat","0","1","0","0","1"]]},{"type":"p","text":"Tarikh penutupan diisi pada 1,398 baris, tetapi hanya satu nilai status kes dinyatakan secara jelas sebagai selesai/tamat. Ketidakpadanan ini menunjukkan bahawa medan tidak digunakan sebagai sistem pengurusan kes menyeluruh yang konsisten. Pada 2026, 204 tarikh penutupan ialah hari selepas operasi. Ini mungkin menandakan langkah pentadbiran; ia bukan bukti pemulihan dalam satu hari."},{"type":"p","text":"Tiga puluh tiga tarikh penutupan pada 2026 berlaku selepas 30 September. Tiga puluh dua ialah 25 Oktober 2026, selepas tarikh analisis ini pada 18 Oktober, dan satu ialah 1 Oktober. Kesemua 33 berada pada baris tindakan perintah institusi. Maksudnya perlu disemak: ia mungkin tarikh yang dirancang, peringkat pencapaian berjadual atau kesilapan kemasukan data. Ia tidak boleh diterima sebagai hasil September yang telah selesai. Lima rekod dalam fail mempunyai tarikh tamat lebih awal daripada tarikh operasi."},{"type":"p","text":"Hanya 67 rekod mempunyai jawapan positif bagi medan piagam laporan sosial 30 hari: satu pada 2025 dan 66 pada 2026. Daripada 137 baris yang ditandakan mempunyai peringkat Mahkamah Majistret, 50 mempunyai jawapan piagam positif itu. Tujuh belas jawapan positif lain muncul pada baris yang peringkat mahkamahnya ditandakan tidak berkenaan. Oleh sebab sumber tidak menyediakan tarikh penerimaan perintah sementara dan tarikh penyediaan laporan sosial secara konsisten, fail ini tidak dapat menentukan kadar pematuhan secara bebas."},{"type":"li","text":"Perkara yang dapat dihuraikan: pelepasan, pengembalian kepada keluarga, laluan institusi, penyerahan kepada Pelindung atau agensi, rujukan hospital atau klinik, serta pertemuan berikutnya yang diperhatikan dalam fail ini."},{"type":"li","text":"Perkara yang tidak dapat ditentukan: kehadiran selepas rujukan, butiran kemasukan atau discaj, ubat atau terapi, pendaftaran ketidakupayaan yang selesai, faedah yang diterima, penyelesaian kes imigresen, tempat tinggal stabil pada 30/90/180 hari, pengekalan pekerjaan, kematian atau pemulihan jangka panjang."},{"type":"li","text":"Ketiadaan rekod kemudian: seseorang mungkin telah mendapat tempat tinggal, berpindah, mengelakkan operasi, dimasukkan ke tempat lain atau sekadar tidak didokumentasikan semula. Ketiadaan rekod bukan ukuran hasil yang berjaya."},{"type":"p","text":"Sumber: Dec 2023.xlsx · Profil · baris 7–693; Dec 2024.xlsx · Profil · baris 7–356; Dec 2025.xlsx · Profil · baris 7–691; Sept 2026.xlsx · Profil · baris 7–305. Medan: AO/AP tindakan utama dan naratif; AQ peringkat mahkamah; AR keputusan mahkamah; AT tarikh keputusan; BD tarikh penutupan; AG status; BE piagam."}]},{"title":"18. Pendidikan, pekerjaan dan keadaan keluarga. Medan ini memberikan contoh yang berguna tetapi terlalu tidak lengkap untuk menggambarkan keseluruhan populasi secara boleh dipercayai.","blocks":[{"type":"table","rows":[["Medan","Kategori substantif yang direkodkan sepanjang semua tahun","Tidak direkodkan atau tidak diketahui"],["Pendidikan","Tidak pernah bersekolah 134; sekolah rendah 20; sekolah menengah 12; SPM/setaraf 1; STPM/setaraf 1","1,853 (91.7%)"],["Pekerjaan terdahulu","Tidak bekerja 273; bekerja sendiri 47; pekerja sektor swasta 19; kakitangan kerajaan 3; suri rumah 6; pelajar 2; bersara 1","1,670 (82.6%)"],["Status perkahwinan","Bujang 310; berkahwin 233; Duda 61; Janda 43; Balu 29","1,345 (66.6%)"]]},{"type":"p","text":"Medan pekerjaan secara khusus bertanya tentang pekerjaan terdahulu, maka “tidak bekerja” tidak wajar dianggap sebagai kadar pengangguran semasa yang disahkan. Sesetengah naratif kes turut menyatakan bahawa seseorang bekerja tetapi tiada tempat tinggal, berpendapatan tidak tetap atau mempunyai bilik tetapi pendapatan tidak mencukupi. Gabungan keadaan ini tersembunyi apabila hanya satu kategori tiada pekerjaan/tiada tempat tinggal digunakan."},{"type":"p","text":"Label perkahwinan sumber Duda, Janda dan Balu dikekalkan tanpa menganggap maksudnya sama. Pencatatan tidak membuktikan bahawa saudara yang dinamakan mampu atau sanggup menyediakan penjagaan atau tempat tinggal. Tindakan pengembalian kepada keluarga bukan bukti penempatan yang selamat atau berkekalan tanpa pengesahan susulan."},{"type":"p","text":"Sumber: Dec 2023.xlsx · Profil · baris 7–693; Dec 2024.xlsx · Profil · baris 7–356; Dec 2025.xlsx · Profil · baris 7–691; Sept 2026.xlsx · Profil · baris 7–305. Medan: AZ/BA pendidikan; BB pekerjaan terdahulu; BC status perkahwinan; AK/AP catatan naratif."}]},{"title":"19. Dapatan kualiti data yang mempengaruhi tafsiran. Nilai yang tidak direkodkan dan medan yang tidak konsisten merupakan dapatan analisis tersendiri. Ia mengehadkan kesimpulan yang boleh dibuat dan menunjukkan bahagian pencatatan yang paling memerlukan penambahbaikan.","blocks":[{"type":"table","rows":[["Medan tidak diisi atau dinyatakan tidak diketahui","2023","2024","2025","2026 Jan–Sep","Jumlah"],["Status kesihatan","105 (15.3%)","327 (93.4%)","222 (32.4%)","1 (0.3%)","655 (32.4%)"],["Status ketidakupayaan","680 (99.0%)","276 (78.9%)","251 (36.6%)","21 (7.0%)","1228 (60.8%)"],["Sebab/faktor","104 (15.1%)","7 (2.0%)","444 (64.8%)","71 (23.7%)","626 (31.0%)"],["Tempoh","7 (1.0%)","30 (8.6%)","347 (50.7%)","212 (70.9%)","596 (29.5%)"],["Keperluan utama","132 (19.2%)","320 (91.4%)","505 (73.7%)","88 (29.4%)","1045 (51.7%)"],["Tindakan utama","466 (67.8%)","7 (2.0%)","4 (0.6%)","1 (0.3%)","478 (23.7%)"],["Pendidikan","533 (77.6%)","346 (98.9%)","677 (98.8%)","297 (99.3%)","1853 (91.7%)"],["Pekerjaan terdahulu","446 (64.9%)","316 (90.3%)","626 (91.4%)","282 (94.3%)","1670 (82.6%)"],["Status perkahwinan","452 (65.8%)","157 (44.9%)","587 (85.7%)","149 (49.8%)","1345 (66.6%)"]]},{"type":"table","rows":[["Isu ketekalan","Bilangan / bukti","Kesan terhadap tafsiran"],["Jadual kes pendua 2025","685 catatan pendua dalam Sheet1","Akan menambah 685 catatan kes secara salah jika kedua-dua lembaran dikira"],["Medan bulan tidak sepadan dengan tarikh operasi","24 baris, serta satu bulan kosong","Pengelompokan mengikut nama bulan mengubah jumlah trend"],["Ketidakpadanan umur berangka dengan tahun lahir >1 tahun","92 baris","Profil umur kekal sebagai anggaran"],["Umur berangka di luar kumpulan umur sumber","22 baris","Bilangan mengikut kumpulan umur dan umur berangka berbeza"],["Penutupan sebelum operasi","5 baris","Turutan masa tidak sah"],["Penutupan 2026 selepas tempoh pelaporan","33 baris, te
